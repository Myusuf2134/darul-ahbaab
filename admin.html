 fear.",""],"isRefrain":false},{"arabic":["وَبُشِّرَتِ الْجِنُّ بِإِظْلَالِ زَمَنِهِ وَانْتُهِكَتِ الْكَهَانَةْ ❁","وَرَهِبَتِ الرَّهْبَانِيَّةْ ❁"],"transliteration":["wa-bush-shirati l-jinnu bi-iẓlāli zamanihi wa-ntuhikati l-kahānah","wa-rahibati r-rahbāniyyah."],"translation":["",""],"isRefrain":false},{"arabic":["وَلَهِجَ بِخَبَرِهِ كُلُّ حَبْرٍ خَبِيرٍ وَفِي حُلَا حُسْنِهِ تَاهْ ❁","وَأُتِيَتْ أُمُّهُ فِي الْمَنَامِ فَقِيلَ لَهَا: إِنَّكِ قَدْ حَمَلْتِ بِسَيِّدِ الْعَالَمِينَ وَخَيْرِ الْبَرِيَّةْ ❁"],"transliteration":["Wa-lahija bi-khabarihi kullu ḥabrin khabīrin wa-fī ḥulā ḥusnihi tāh","wa-ūtiyat ummuhu fī l-manāmi fa-qīla lahā: innaki qad ḥamalti bi-sayyidi l-ʿālamīna wa-khayri l-bariyyah"],"translation":["Every learned sage spoke eagerly of his news and was lost in wonder at the adornments of his beauty. His mother was visited in a dream and told, “You are carrying the Master of the Worlds and the best of creation. When you give birth to him, name him Muhammad, for his outcome shall be praised.”",""],"isRefrain":false},{"arabic":["فَسَمِّيهِ إِذَا وَضَعْتِيهِ مُحَمَّدًا فَإِنَّهُ سَتُحْمَدُ عُقْبَاهْ ❁"],"transliteration":["fa-sammīhi idhā waḍaʿtīhi Muḥammadan fa-innahu sa-tuḥmadu ʿuqbāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["عَطِّرِ اللَّهُمَّ قَبْرَهُ الْكَرِيمَ بِعَرْفٍ شَذِيٍّ مِنْ صَلَاةٍ وَتَسْلِيمٍ ❁","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَيْهِ ❁"],"transliteration":["ʿAṭṭiri Llāhumma qabrahu l-karīma bi-ʿarfin shadhiyyin min ṣalātin wa-taslīmin. Allāhumma ṣalli wa-sallim wa-bārik ʿalayhi.",""],"translation":["O Allah, perfume his noble grave with a fragrant scent of prayers and peace. O Allah, send prayers, peace, and blessings upon him.",""],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: The Birth of the Prophet ﷺ","englishTitle":"Mawlid al-Barzanji: The Birth of the Prophet ﷺ","couplets":[{"arabic":["وَلَمَّا تَمَّ مِنْ حَمْلِهِ شَهْرَانِ عَلَى مَشْهُورِ الْأَقْوَالِ الْمَرْوِيَّةْ ❁","تُوُفِّيَ بِالْمَدِينَةِ الْمُنَوَّرَةِ أَبُوهُ عَبْدُ اللهْ ❁"],"transliteration":["Wa-lammā tamma min ḥamlihi shahrāni ʿalā mash-hūri l-aqwāli l-marwiyyah","tuwūffiya bi-l-Madīnati l-Munawwarati abūhu ʿAbdu Llāh"],"translation":["When two months of the pregnancy had passed, according to the most widely reported account, his father Abd Allah passed away in al-Madinah al-Munawwarah. He had stopped with his maternal relatives, the Banu Adiyy of the Najjar clan, and remained among them for a month while ill, as they tended to his sickness and suffering.",""],"isRefrain":false},{"arabic":["وَكَانَ قَدِ اجْتَازَ بِأَخْوَالِهِ بَنِي عَدِيٍّ مِنَ الطَّائِفَةِ النَّجَّارِيَّةْ ❁","وَمَكَثَ فِيهِمْ شَهْرًا سَقِيمًا يُعَانُونَ سُقْمَهُ وَشَكْوَاهْ ❁"],"transliteration":["wa-kāna qadi ijtāza bi-akhwālihi banī ʿadiyyin mina ṭ-ṭā'ifati n-Najjāriyyah","wa-makatha fīhim shahran saqīman yuʿānūna suqmahu wa-shakwāh."],"translation":["",""],"isRefrain":false},{"arabic":["وَلَمَّا تَمَّ مِنْ حَمْلِهِ عَلَى الرَّاجِحِ تِسْعَةُ أَشْهُرٍ قَمَرِيَّةْ ❁","وَآنَ لِلزَّمَانِ أَنْ يَنْجَلِيَ عَنْهُ صَدَاهْ ❁"],"transliteration":["Wa-lammā tamma min ḥamlihi ʿalā r-rājiḥi tisʿatu ash-hurin qamariyyah","wa-āna li-z-zamāni an yanjaliya ʿanhu ṣadāh"],"translation":["When the pregnancy reached nine lunar months, according to the strongest view, and the time had come for the age to be cleared of its darkness, Asiyah and Maryam came to his mother on the night of his birth, among a company of women from the sacred assembly. Then the pangs of labour came upon her, and she gave birth to him ﷺ as a light whose radiance shone brilliantly.",""],"isRefrain":false},{"arabic":["حَضَرَ أُمَّهُ لَيْلَةَ مَوْلِدِهِ آسِيَةُ وَمَرْيَمُ فِي نِسْوَةٍ مِنَ الْحَظِيرَةِ الْقُدْسِيَّةْ ❁","وَأَخَذَهَا الْمَخَاضُ فَوَلَدَتْهُ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ نُورًا يَتَلَأْلَأُ سَنَاهْ ❁"],"transliteration":["ḥaḍara ummahu laylata mawlidihi Āsiyatu wa-Maryamu fī niswatin mina l-ḥaẓīrati l-qudsiyyah","wa-akhadhaha l-makhāḍu fa-waladat-hu ṣalla Llāhu taʿālā ʿalayhi wa-sallama nūran yatala'la'u sanāh."],"translation":["",""],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: The Standing (Qiyam)","englishTitle":"Mawlid al-Barzanji: The Standing (Qiyam)","couplets":[{"arabic":["يَا نَبِيِّ سَلَامٌ عَلَيْكَ ❁","يَا رَسُولَ سَلَامٌ عَلَيْكَ ❁"],"transliteration":["Yā nabiyyi salām ʿalayka","yā rasūla salām ʿalayka"],"translation":["O Prophet, peace be upon you. O Messenger, peace be upon you. O Beloved, peace be upon you. Allah’s prayers be upon you.",""],"isRefrain":false},{"arabic":["يَا حَبِيبَ سَلَامٌ عَلَيْكَ ❁","صَلَوَاتُ اللَّهِ عَلَيْكَ ❁"],"transliteration":["yā ḥabība salām ʿalayka","ṣalawātu Llāhi ʿalayka."],"translation":["",""],"isRefrain":false},{"arabic":["أَشْرَقَ الْبَدْرُ عَلَيْنَا ❁","فَاخْتَفَتْ مِنْهُ الْبُدُورُ ❁"],"transliteration":["Ashraqa l-badru ʿalaynā","fa-khtafat minhu l-budūru"],"translation":["The full moon has risen upon us, and all other moons have faded before it. Never have we seen beauty like yours, O face of joy.",""],"isRefrain":false},{"arabic":["مِثْلَ حُسْنِكَ مَا رَأَيْنَا ❁","قَطُّ يَا وَجْهَ السُّرُورِ ❁"],"transliteration":["mithla ḥusnika mā ra'aynā","qaṭṭu yā wajha s-surūri."],"translation":["",""],"isRefrain":false},{"arabic":["أَنْتَ شَمْسٌ أَنْتَ بَدْرٌ ❁","أَنْتَ نُورٌ فَوْقَ نُورٍ ❁"],"transliteration":["Anta shamsun anta badrun","anta nūrun fawqa nūrin"],"translation":["You are a sun, you are a full moon, you are light upon light, you are a precious elixir, you are the lamp of hearts.",""],"isRefrain":false},{"arabic":["أَنْتَ إِكْسِيرٌ وَغَالِي ❁","أَنْتَ مِصْبَاحُ الصُّدُورِ ❁"],"transliteration":["anta iksīrun wa-ghālī","anta miṣbāḥu ṣ-ṣudūri."],"translation":["",""],"isRefrain":false},{"arabic":["يَا حَبِيبِي يَا مُحَمَّدُ ❁","يَا عَرُوسَ الْخَافِقَيْنِ ❁"],"transliteration":["Yā ḥabībī yā Muḥammadu","yā ʿarūsa l-khāfiqayni"],"translation":["O my beloved, O Muhammad, O bridegroom of the two horizons. O you who are supported, O you who are glorified, O leader of the two qiblas.",""],"isRefrain":false},{"arabic":["يَا مُؤَيَّدُ يَا مُمَجَّدُ ❁","يَا إِمَامَ الْقِبْلَتَيْنِ ❁"],"transliteration":["yā mu'ayyadu yā mumajjadu","yā imāma l-qiblatayni."],"translation":["",""],"isRefrain":false},{"arabic":["مَنْ رَأَى وَجْهَكَ يَسْعَدْ ❁","يَا كَرِيمَ الْوَالِدَيْنِ ❁"],"transliteration":["Man ra'ā wajhaka yasʿad","yā karīma l-wālidayni"],"translation":["Whoever sees your face finds happiness, O noble son of noble parents, may we come to your pure, refreshing Basin on the Day of Resurrection.",""],"isRefrain":false},{"arabic":["حَوْضُكَ الصَّافِي فِي الْمُبْرَدِ ❁","وَرَدْنَا يَوْمَ النُّشُورِ ❁"],"transliteration":["ḥawḍuka ṣ-ṣāfī fī l-mubarradi","waradnā yawma n-nushūr."],"translation":["",""],"isRefrain":false},{"arabic":["مَا رَأَيْنَا الْعِيسَ حَنَّتْ ❁","بِالسُّرَى إِلَّا إِلَيْكَ ❁"],"transliteration":["Mā ra'aynā l-ʿīsa ḥannat","bi-s-surā illā ilayka"],"translation":["Never have we seen the camels yearn through the night except towards you, and the cloud indeed shaded you, and the heavenly assembly sent prayers upon you.",""],"isRefrain":false},{"arabic":["وَالْغَمَامَةُ قَدْ أَظَلَّتْ ❁","وَالْمَلَا صَلَّوْا عَلَيْكَ ❁"],"transliteration":["wa-l-ghamāmatu qad aẓallat","wa-l-malā ṣallaw ʿalayka."],"translation":["",""],"isRefrain":false},{"arabic":["وَأَتَاكَ الْعُودُ يَبْكِي ❁","وَتَذَلَّلَ بَيْنَ يَدَيْكَ ❁"],"transliteration":["Wa-atāka l-ʿūdu yabkī","wa-tadhallala bayna yadayka"],"translation":["The tree trunk came to you weeping and humbled itself before you, and the timid gazelle sought refuge with you, O my beloved.",""],"isRefrain":false},{"arabic":["وَاسْتَجَارَتْ يَا حَبِيبِي ❁","عِنْدَكَ الظَّبْيُ النُّفُورُ ❁"],"transliteration":["wa-stajarāt yā ḥabībī","ʿindaka ẓ-ẓabyu n-nufūru."],"translation":["",""],"isRefrain":false},{"arabic":["عِنْدَمَا شَدُّوا الْمَحَامِلَ ❁","وَتَنَادَوْا لِلرَّحِيلِ ❁"],"transliteration":["ʿIndamā shaddū l-maḥāmila","wa-tanādaw li-l-raḥīli"],"translation":["When they secured their litters and called out to depart, I came to them with tears flowing and said, “Wait for me, O guide.",""],"isRefrain":false},{"arabic":["جِئْتُهُمْ وَالدَّمْعُ سَائِلٌ ❁","قُلْتُ قِفْ لِي يَا دَلِيلُ ❁"],"transliteration":["ji'tuhum wa-d-damʿu sā'ilun","qultu qif lī yā dalīlu."],"translation":["",""],"isRefrain":false},{"arabic":["وَتَحْمِلُ لِي رَسَائِلَ ❁","أَيُّهَا الشَّوْقُ الْجَزِيلُ ❁"],"transliteration":["Wa-taḥmilu lī rasā'ila","ayyuha sh-shawqu l-jazīlu"],"translation":["And carry messages for me, O great longing, To those distant dwellings, in the evening and at dawn.”",""],"isRefrain":false},{"arabic":["نَحْوَ هَاتِيكَ الْمَنَازِلِ ❁","فِي الْعَشِيِّ وَالْبُكُورِ ❁"],"transliteration":["naḥwa hātīka l-manāzili","fī l-ʿashiyyi wa-l-bukūri."],"translation":["",""],"isRefrain":false},{"arabic":["كُلُّ مَنْ فِي الْكَوْنِ هَامُوا ❁","فِيكَ يَا بَاهِيَ الْجَبِينِ ❁"],"transliteration":["Kullu man fī l-kawni hāmū","fīka yā bāhiya l-jabīni"],"translation":["All who dwell within creation are enraptured by you, O you whose brow is radiant, and for you they bear a passionate love, a longing and a yearning.",""],"isRefrain":false},{"arabic":["وَلَهُمْ فِيكَ غَرَامٌ ❁","وَاشْتِيَاقٌ وَحَنِينٌ ❁"],"transliteration":["wa-lahum fīka gharāmun","wa-shtiyāqun wa-ḥanīnun."],"translation":["",""],"isRefrain":false},{"arabic":["فِي مَعَانِيكَ الْأَنَامُ ❁","قَدْ تَبَدَّتْ حَائِرِينَ ❁"],"transliteration":["Fī maʿānīka l-anāmu","qad tabaddat ḥā'irīna"],"translation":["Before your sublime qualities, all people stand bewildered. You are the Seal of the Messengers, and ever grateful to the Lord.",""],"isRefrain":false},{"arabic":["أَنْتَ لِلرُّسُلِ خِتَامٌ ❁","أَنْتَ لِلْمَوْلَى شَكُورٌ ❁"],"transliteration":["anta li-r-rusuli khitāmun","anta li-l-mawlā shakūrun."],"translation":["",""],"isRefrain":false},{"arabic":["عَبْدُكَ الْمِسْكِينُ يَرْجُو ❁","فَضْلَكَ الْجَمَّ الْغَفِيرَ ❁"],"transliteration":["ʿAbduka l-miskīnu yarjū","faḍlaka l-jamma l-ghafīra"],"translation":["Your poor servant hopes for your immense and abundant grace, and I have placed my good expectations in you, O bearer of glad tidings, O warner.",""],"isRefrain":false},{"arabic":["فِيكَ قَدْ أَحْسَنْتُ ظَنِّي ❁","يَا بَشِيرُ يَا نَذِيرُ ❁"],"transliteration":["fīka qad aḥsantu ẓannī","yā bashīru yā nadhīru."],"translation":["",""],"isRefrain":false},{"arabic":["فَأَغِثْنِي وَأَجِرْنِي ❁","يَا مُجِيرَ مِنَ السَّعِيرِ ❁"],"transliteration":["Fa-aghithnī wa-ajirnī","yā mujīra mina s-saʿīri"],"translation":["So come to my aid and grant me refuge, O protector from the Blazing Fire, O my aid, O my refuge in the most pressing of affairs.",""],"isRefrain":false},{"arabic":["يَا غِيَاثِي يَا مَلَاذِي ❁","فِي مُهِمَّاتِ الْأُمُورِ ❁"],"transliteration":["yā ghiyāthī yā malādhī","fī muhimmāti l-umūri."],"translation":["",""],"isRefrain":false},{"arabic":["سَعِدَ عَبْدٌ قَدْ تَمَلَّى ❁","وَانْجَلَى عَنْهُ الْحَزِينُ ❁"],"transliteration":["Saʿida ʿabdun qad tamallā","wanjalā ʿanhu l-ḥazīnu"],"translation":["Blessed is the servant who has drunk his fill, and whose sorrow has departed. In you, O full moon, splendour has manifested, and yours is the beautiful description.",""],"isRefrain":false},{"arabic":["فِيكَ يَا بَدْرُ تَجَلَّى ❁","فَلَكَ الْوَصْفُ الْحَسِينُ ❁"],"transliteration":["fīka yā badru tajallā","falaka l-waṣfu l-ḥasīnu."],"translation":["",""],"isRefrain":false},{"arabic":["لَيْسَ أَزْكَى مِنْكَ أَصْلًا ❁","قَطُّ يَا جِدَّ الْحُسَيْنِ ❁"],"transliteration":["Laysa azkā minka aṣlan","qaṭṭu yā jidda l-Ḥusayni"],"translation":["None is purer than you in lineage, O grandfather of al-Husayn, and may Allah send prayers upon you always, throughout the ages.",""],"isRefrain":false},{"arabic":["فَعَلَيْكَ اللَّهُ صَلَّى ❁","دَائِمًا طُولَ الدُّهُورِ ❁"],"transliteration":["fa-ʿalayka Llāhu ṣallā","dā'iman ṭūla d-duhūri."],"translation":["",""],"isRefrain":false},{"arabic":["يَا وَلِيَّ الْحَسَنَاتِ ❁","يَا رَفِيعَ الدَّرَجَاتِ ❁"],"transliteration":["Yā waliyyā l-ḥasanāti","yā rafīʿa d-darajāti"],"translation":["O Guardian of good deeds, O Exalted in rank, remove my sins from me, and forgive me my misdeeds.",""],"isRefrain":false},{"arabic":["كَفِّرْ عَنِّي الذُّنُوبَ ❁","وَاغْفِرْ عَنِّي السَّيِّئَاتِ ❁"],"transliteration":["kaffir ʿannī dh-dhunūba","waghfir ʿannī s-sayyi'āti."],"translation":["",""],"isRefrain":false},{"arabic":["أَنْتَ عَفَّارُ الْخَطَايَا ❁","وَالذُّنُوبِ الْمُحْرِقَاتِ ❁"],"transliteration":["Anta ʿaffāru l-khaṭāyā","wa-dh-dhunūbi l-muḥriqāti"],"translation":["You are the Great Forgiver of faults and of sins that burn, and You are the Concealer of shortcomings and the Pardoner of slips.",""],"isRefrain":false},{"arabic":["أَنْتَ سِتَّارُ الْمَسَاوِي ❁","وَمُقِيلُ الْعَثَرَاتِ ❁"],"transliteration":["Anta sittāru l-masāwī","wa-muqīlu l-ʿatharāti."],"translation":["",""],"isRefrain":false},{"arabic":["عَالِمُ السِّرِّ وَالْخَفَى ❁","مُسْتَجِيبُ الدَّعَوَاتِ ❁"],"transliteration":["ʿĀlimu s-sirri wa-l-khafā","mustajību d-daʿawāti"],"translation":["Knower of the secret and the hidden, Responder to supplications, O Lord, have mercy upon us all through every righteous deed.",""],"isRefrain":false},{"arabic":["رَبِّ فَارْحَمْنَا جَمِيعًا ❁","بِجَمِيعِ الصَّالِحَاتِ ❁"],"transliteration":["Rabbi farḥamnā jamīʿan","bi-jamīʿi ṣ-ṣāliḥāti."],"translation":["",""],"isRefrain":false},{"arabic":["وَمُحَيًّا كَالشَّمْسِ مِنْكَ مُضِيءٌ أَسْفَرَتْ عَنْهُ لَيْلَةٌ غَرَّاءُ ❁","لَيْلَةُ الْمَوْلِدِ الَّذِي كَانَ لِلدِّينِ سُرُورٌ بِيَوْمِهِ وَازْدِهَاءُ ❁"],"transliteration":["Wa-muḥayyan ka-sh-shamsi minka muḍī'un asfarat ʿanhu laylatun gharrā'u laylatu l-mawlidi lladhī kāna li-d-dīni surūrun bi-yawmihi wa-zdihā'u yawma nālat bi-waḍʿihi-bnatu Wahbin min fakhārin mā lam tanalhu n-nisā'u, wa-atat qawmahā bi-afḍala mimmā ḥamalat qablu Maryamu l-ʿadhrā'u, mawlidun kāna minhu fī ṭāliʿi l-kufri wabālun ʿalayhum wa-wabā'u.",""],"translation":["And from you came a countenance radiant like the sun, unveiled by a resplendent night, the night of the Birth, whose day brought joy and splendour to the religion. On that day, through giving birth to him, the daughter of Wahb attained an honour that no woman had ever attained, and she brought to her people one more excellent than he whom Maryam the Virgin had borne before, a birth whose rising brought calamity and affliction upon disbelief.",""],"isRefrain":false},{"arabic":["يَوْمَ نَالَتْ بِوَضْعِهِ ابْنَةُ وَهْبٍ مِنْ فَخَارٍ مَا لَمْ تَنَلْهُ النِّسَاءُ ❁","وَأَتَتْ قَوْمَهَا بِأَفْضَلَ مِمَّا حَمَلَتْ قَبْلُ مَرْيَمُ الْعَذْرَاءُ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["مَوْلِدٌ كَانَ مِنْهُ فِي طَالِعِ الْكُفْرِ وَبَالٌ عَلَيْهُمْ وَوَبَاءُ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["وَتَوَالَتْ بُشْرَى الْهَوَاتِفِ أَنْ قَدْ وُلِدَ الْمُصْطَفَى وَحَقَّ الْهَنَاءُ ❁","هَذَا وَقَدِ اسْتَحْسَنَ الْقِيَامَ عِنْدَ ذِكْرِ مَوْلِدِهِ الشَّرِيفِ أَئِمَّةٌ ذَوُو رِوَايَةٍ وَرَوِيَّةْ ❁"],"transliteration":["Wa-tawālat bushra l-hawātifi an qad wulida l-Muṣṭafā wa-ḥaqqa l-hanā'u","hādhā wa-qadi-s-taḥsana l-qiyāma ʿinda dhikri mawlidihi sh-sharīfi a'immatun dhawū riwāyatin wa-rawiyyah"],"translation":["And the glad tidings of the voices followed one after another, proclaiming that the Chosen One had indeed been born and that the time for rejoicing had truly come. Leading scholars endowed with sound transmission and considered judgement have deemed it commendable to stand at the mention of his noble birth. So blessed is the one whose ultimate aim and aspiration is to honour him, may Allah Most High send prayers and peace upon him.",""],"isRefrain":false},{"arabic":["فَطُوبَى لِمَنْ كَانَ تَعْظِيمُهُ صَلَّى اللَّهُ عَلَيْهِ تَعَالَى وَسَلَّمَ غَايَةَ مَرَامِهِ وَمَرْمَاهْ ❁"],"transliteration":["fa-ṭūba li-man kāna taʿẓīmuhu ṣalla Llāhu ʿalayhi taʿālā wa-sallama ghāyata marāmihi wa-marmāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["عَطِّرِ اللَّهُمَّ قَبْرَهُ الْكَرِيمَ بِعَرْفٍ شَذِيٍّ مِنْ صَلَاةٍ وَتَسْلِيمٍ ❁","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَيْهِ ❁"],"transliteration":["ʿAṭṭiri Llāhumma qabrahu l-karīma bi-ʿarfin shadhiyyin min ṣalātin wa-taslīmin. Allāhumma ṣalli wa-sallim wa-bārik ʿalayhi.",""],"translation":["O Allah, perfume his noble grave with a fragrant scent of prayers and peace. O Allah, send prayers, peace, and blessings upon him.",""],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: The Concluding Supplication","englishTitle":"Mawlid al-Barzanji: The Concluding Supplication","couplets":[{"arabic":["اللَّهُمَّ يَا بَاسِطَ الْيَدَيْنِ بِالْعَطِيَّةْ ❁","يَا مَنْ إِذَا رُفِعَتْ إِلَيْهِ أَكُفُّ الْعَبْدِ كَفَاهْ ❁"],"transliteration":["Allāhumma yā bāsiṭa l-yadayni bi-l-ʿaṭiyyah","yā man idhā rufiʿat ilayhi akuffu l-ʿabdi kafāh"],"translation":["O Allah, O You who extend both hands in giving, O You who, when the servant raises his hands to You, suffice him. O You who, in Your Essence and Attributes of Oneness, are exalted beyond all likeness and comparison. O You who alone possess everlastingness, beginninglessness, and eternality. O You besides whom none is hoped in and upon none besides whom reliance is placed.",""],"isRefrain":false},{"arabic":["يَا مَنْ تَنَزَّهَ فِي ذَاتِهِ وَصِفَاتِهِ الْأَحَدِيَّةْ ❁","عَنْ أَنْ يَكُونَ لَهُ فِيهَا نَظَائِرُ وَأَشْبَاهْ ❁"],"transliteration":["yā man tanazzaha fī dhātihi wa-ṣifātihi l-aḥadiyyah","ʿan an yakūna lahu fīhā naẓā'iru wa-ashbāh"],"translation":["",""],"isRefrain":false},{"arabic":["يَا مَنْ تَفَرَّدَ بِالْبَقَاءِ وَالْقِدَمِ وَالْأَزَلِيَّةْ ❁","يَا مَنْ لَا يُرْجَى غَيْرُهُ وَلَا يُعَوَّلُ عَلَى سِوَاهْ ❁"],"transliteration":["yā man tafarrada bi-l-baqā'i wa-l-qidami wa-l-azaliyyah","yā man lā yurjā ghayruhu wa-lā yuʿawwalu ʿalā siwāh."],"translation":["",""],"isRefrain":false},{"arabic":["يَا مَنِ اسْتَنَدَ الْأَنَامُ إِلَى قُدْرَتِهِ الْقَيُّومِيَّةْ ❁","وَأَرْشَدَ بِفَضْلِهِ مَنِ اسْتَرْشَدَهُ وَاسْتَهْدَاهْ ❁"],"transliteration":["Yā mani-stanada l-anāmu ilā qudratihi l-qayyūmiyyah","wa-arshada bi-faḍlihi mani-starshadahu wa-s-tahdāh"],"translation":["O You upon whose sustaining power all creation depends, and who by Your grace guide those who seek guidance and direction from You. We ask You by Your sacred lights, which dispelled the deep darkness of doubt, and we seek a means of approach to You through the honour of the Muhammadan Essence, he who is the last of the prophets in outward form and the first of them in meaning, and through his family, the stars of safety for creation and the ship of safety and salvation.",""],"isRefrain":false},{"arabic":["نَسْأَلُكَ بِأَنْوَارِكَ الْقُدْسِيَّةِ ❁","الَّتِي أَزَاحَتْ مِنْ ظُلُمَاتِ الشَّكِّ دُجَاهْ ❁"],"transliteration":["nas'aluka bi-anwārika l-qudsiyyah","allatī azāḥat min ẓulumāti sh-shakki dujāh"],"translation":["",""],"isRefrain":false},{"arabic":["وَنَتَوَسَّلُ إِلَيْكَ بِشَرَفِ الذَّاتِ الْمُحَمَّدِيَّةْ ❁","وَمَنْ هُوَ آخِرُ الْأَنْبِيَاءِ بِصُورَتِهِ وَأَوَّلُهُمْ بِمَعْنَاهْ ❁"],"transliteration":["wa-natawassalu ilayka bi-sharafi dh-dhāti l-Muḥammadiyyah","wa-man huwa ākhiru l-anbiyā'i bi-ṣūratihi wa-awwaluhum bi-maʿnāh"],"translation":["",""],"isRefrain":false},{"arabic":["وَبِآلِهِ كَواكِبِ أَمْنِ الْبَرِيَّةْ ❁","وَسَفِينَةِ السَّلَامَةِ وَالنَّجَاةْ ❁"],"transliteration":["wa-bi-ālihi kawākibi amni l-bariyyah","wa-safīnati s-salāmati wa-n-najāh."],"translation":["",""],"isRefrain":false},{"arabic":["وَبِأَصْحَابِهِ أُولِي الْهِدَايَةِ وَالْأَفْضَلِيَّةْ ❁","الَّذِينَ بَذَلُوا نُفُوسَهُمْ لِلَّهِ يَبْتَغُونَ فَضْلًا مِنَ اللَّهْ ❁"],"transliteration":["Wa-bi-aṣḥābihi ūli l-hidāyati wa-l-afḍaliyyah","alladhīna badhalū nufūsahum li-Llāhi yabtaghūna faḍlan mina Llāh"],"translation":["And through his Companions, possessors of guidance and excellence, who devoted themselves to Allah, seeking bounty from Allah, and through the bearers of his Sacred Law, possessors of virtues and distinction, who rejoiced in blessing and bounty from Allah, we ask You to grant us success in making our intentions sincere in all our words and deeds.",""],"isRefrain":false},{"arabic":["وَبِحَمَلَةِ شَرِيعَتِهِ أُولِي الْمَنَاقِبِ وَالْخُصُوصِيَّةْ ❁","الَّذِينَ اسْتَبْشَرُوا بِنِعْمَةٍ وَفَضْلٍ مِنَ اللَّهْ ❁"],"transliteration":["wa-bi-ḥamalati sharīʿatihi ūli l-manāqibi wa-l-khuṣūṣiyyah","alladhīna-s-tabsharū bi-niʿmatin wa-faḍlin mina Llāh"],"translation":["",""],"isRefrain":false},{"arabic":["أَنْ تُوَفِّقَنَا فِي الْأَقْوَالِ وَالْأَعْمَالِ لِإِخْلَاصِ النِّيَّةْ ❁"],"transliteration":["an tuwaffiqanā fī l-aqwāli wa-l-aʿmāli li-ikhlāṣi n-niyyah.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَتُنْجِحَ لِكُلٍّ مِنَ الْحَاضِرِينَ مَطْلَبَهُ وَمُنَاهْ ❁","وَتُخَلِّصَنَا مِنْ أَسْرِ الشَّهَوَاتِ وَالْأَدْوَاءِ الْقَلْبِيَّةْ ❁"],"transliteration":["Wa-tunjiḥa li-kullin mina l-ḥāḍirīna maṭlabahu wa-munāh","wa-tukhalliṣanā min asri sh-shahawāti wa-l-adwā'i l-qalbiyyah"],"translation":["And fulfil for each of those present his request and desire, and free us from the bondage of passions and the diseases of the heart. And fulfil for us the hopes we have placed in You, and suffice us against every overwhelming adversity and calamity. And do not make us among those whom their own desires have led astray. And bring within our reach the ripe and abundant fruits of true certainty, and erase from us every sin we have committed.",""],"isRefrain":false},{"arabic":["وَتُحَقِّقَ لَنَا مِنَ الْآمَالِ مَا بِكَ ظَنَنَّاهْ ❁","وَتَكْفِيَنَا كُلَّ مُدْلَهِمَّةٍ وَبَلِيَّةْ ❁"],"transliteration":["wa-tuḥaqqiqa lanā mina l-āmāli mā bika ẓanannāh","wa-takfiyanā kulla mudlahimmatin wa-baliyyah"],"translation":["",""],"isRefrain":false},{"arabic":["وَلَا تَجْعَلْنَا مِمَّنْ أَهْوَاهُ هَوَاهْ ❁","وَتُدْنِيَ لَنَا مِنْ حُسْنِ الْيَقِينِ قُطُوفًا دَانِيَةً جَنِيَّةْ ❁"],"transliteration":["wa-lā tajʿalnā mimman ahwāhu hawāh","wa-tudniya lanā min ḥusni l-yaqīni quṭūfan dāniyatan janiyyah"],"translation":["",""],"isRefrain":false},{"arabic":["وَتَمْحُوَ عَنَّا كُلَّ ذَنْبٍ جَنَيْنَاهْ ❁"],"transliteration":["wa-tamḥuwa ʿannā kulla dhanbin janaynāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَتَسْتُرَ لِكُلٍّ مِنَّا عَيْبَهُ وَعَجْزَهُ وَحَصْرَهُ وَعِيَّهْ ❁","وَتُسَهِّلَ لَنَا مِنْ صَالِحِ الْأَعْمَالِ مَا عَزَّ ذُرَاهْ ❁"],"transliteration":["Wa-tastura li-kullin minnā ʿaybahu wa-ʿajzahu wa-ḥaṣrahu wa-ʿiyyah wa-tusahhila lanā min ṣāliḥi l-aʿmāli mā ʿazza dhurāh allāhumma innaka jaʿalta li-kulli sā'ilin maqāman wa-maziyyah wa-li-kulli rājin mā ammalahu fīka wa-rajāh wa-qad sa'alnāka rājīna mawāhibaka l-laduniyyah, fa-ḥaqqiq lanā mā minka rajawnāh wa-taʿumma jamʿanā hādhā min khazā'ini minaḥika s-saniyyah.",""],"translation":["And conceal for each of us his faults, his weakness, his inability, and his inarticulateness, and make easy for us those righteous deeds whose heights are difficult to attain. O Allah, You have appointed for every seeker a station and distinction, and for everyone who hopes in You that which he hopes for and seeks from You. And we have asked You, hoping for Your divine gifts, so fulfil for us what we have hoped for from You, and encompass this gathering of ours with the treasures of Your sublime gifts.",""],"isRefrain":false},{"arabic":["اللَّهُمَّ إِنَّكَ جَعَلْتَ لِكُلِّ سَائِلٍ مَقَامًا وَمَزِيَّةْ ❁","وَلِكُلِّ رَاجٍ مَا أَمَّلَهُ فِيكَ وَرَجَاهْ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["وَقَدْ سَأَلْنَاكَ رَاجِينَ مَوَاهِبَكَ اللَّدُنِيَّةْ ❁","فَحَقِّقْ لَنَا مَا مِنْكَ رَجَوْنَاهْ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["وَتَعُمَّ جَمْعَنَا هَذَا مِنْ خَزَائِنِ مِنَحِكَ السَّنِيَّةْ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["بِرَحْمَةٍ وَمَغْفِرَةٍ وَتُدِيمَ عَمَّنْ سِوَاكَ غِنَاهْ ❁","اللَّهُمَّ آمِنِ الرَّوْعَاتِ وَأَصْلِحِ الرُّعَاةَ وَالرَّعِيَّةْ ❁"],"transliteration":["Bi-raḥmatin wa-maghfiratin wa-tudīma ʿamman siwāka ghināh","Allāhumma āmini r-rawʿāti wa-aṣliḥi r-ruʿāta wa-r-raʿiyyah"],"translation":["With mercy and forgiveness, and grant us lasting independence from all besides You. O Allah, grant safety from all fears, and set right the leaders and the people. And magnify the reward of the one who caused this good to take place on this day and brought it about. O Allah, make this land and all the lands of Islam secure and prosperous, and grant us abundant rain whose flowing bounty spreads across the plains and their hills.",""],"isRefrain":false},{"arabic":["وَأَعْظِمِ الْأَجْرَ لِمَنْ جَعَلَ هَذَا الْخَيْرَ فِي هَذَا الْيَوْمِ وَأَجْرَاهْ ❁","اللَّهُمَّ اجْعَلْ هَذِهِ الْبَلْدَةَ وَسَائِرَ بِلَادِ الْإِسْلَامِ آمِنَةً رَخِيَّةْ ❁"],"transliteration":["wa-aʿẓimi l-ajra li-man jaʿala hādhā l-khayra fī hādhā l-yawmi wa-ajrāh","Allāhumma-jʿal hādhihi l-baldata wa-sā'ira bilādi al-islāmi āminatan rakhiyyah"],"translation":["",""],"isRefrain":false},{"arabic":["وَاسْقِنَا غَيْثًا يَعُمُّ انْسِيَابُ سَيْبِهِ السَّبْسَبَ وَرُبَاهْ ❁"],"transliteration":["wa-s-qinā ghaythan yaʿummu nsiyābu saybihi s-sabsaba wa-rubāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَاغْفِرْ لِنَاسِخِ هَذِهِ الْبُرُودِ الْمُحْبَّرَةِ الْمَوْلِدِيَّةْ ❁","جَعْفَرِ مَنْ إِلَى الْبَرْزَنْجِيِّ نِسْبَتُهُ وَمُنْتَمَاهْ ❁"],"transliteration":["Wa-ghfir li-nāsikhi hādhihi l-burūdi l-muḥabbarati l-mawlidiyyah","Jaʿfar man ilā l-barzanjiyyi nisbatuhu wa-muntamāh"],"translation":["And forgive the author of this beautifully adorned Mawlid, Ja'far, whose lineage and affiliation are to al-Barzanji. Grant him the triumph of nearness to You and the fulfilment of his hopes and aspirations. Make his resting place and abode among those brought near to You. Conceal his faults, his weakness, his limitations, and his inability to express himself.",""],"isRefrain":false},{"arabic":["وَحَقِّقْ لَهُ الْفَوْزَ بِقُرْبِكَ وَالرَّجَاءَ وَالْأُمْنِيَّةْ ❁","وَاجْعَلْ مَعَ الْمُقَرَّبِينَ مَقِيلَهُ وَسُكْنَاهْ ❁"],"transliteration":["wa-ḥaqqiq lahu l-fawza bi-qurbika wa-r-rajā'a wa-l-umniyyah","wa-jʿal maʿa l-muqarrabīna maqīlahu wa-suknāh"],"translation":["",""],"isRefrain":false},{"arabic":["وَاسْتُرْ لَهُ عَيْبَهُ وَعَجْزَهُ وَحَصْرَهُ وَعِيَّهْ ❁"],"transliteration":["wa-s-tur lahu ʿaybahu wa-ʿajzahu wa-ḥaṣrahu wa-ʿiyyah.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَلِكَاتِبِهَا وَقَارِئِهَا وَمَنْ أَصَاخَ إِلَيْهَا سَمْعَهُ وَأَصْغَاهْ ❁","وَصَلِّ اللَّهُمَّ عَلَى أَوَّلِ قَابِلٍ لِلتَّجَلِّي مِنَ الْحَقِيقَةِ الْكُلِّيَّةْ ❁"],"transliteration":["Wa-li-kātibihā wa-qāri'ihā wa-man aṣākha ilayhā samʿahu wa-aṣghāh","wa-ṣalli Llāhumma ʿalā awwali qābilin li-t-tajallī mina l-ḥaqīqati l-kulliyyah"],"translation":["And forgive its writer, its reader, and whoever lends his ear to it and listens attentively. O Allah, send prayers upon the first to receive the manifestation from the Universal Reality, and upon his family, his Companions, and all who supported him and showed him loyalty, for as long as ears are adorned with jewelled earrings fashioned from his pearl-like description, and the foremost places of noble gatherings are adorned with necklaces of his beautiful qualities.",""],"isRefrain":false},{"arabic":["وَعَلَى آلِهِ وَصَحْبِهِ وَمَنْ نَصَرَهُ وَوَالَاهْ ❁","مَا شُنِّفَتِ الْآذَانُ مِنْ وَصْفِهِ الدُّرِّيِّ بِأَقْرَاطٍ جَوْهَرِيَّةْ ❁"],"transliteration":["wa-ʿalā ālihi wa-ṣaḥbihi wa-man naṣarahu wa-wālāh","mā shunnifati l-ādhānu min waṣfihi d-durriyyi bi-aqrāṭin jawhariyyah"],"translation":["",""],"isRefrain":false},{"arabic":["وَتَحَلَّتْ صُدُورُ الْمَحَافِلِ الْمُنِيفَةِ بِعُقُودِ حُلَاهْ ❁"],"transliteration":["wa-taḥallat ṣudūru l-maḥāfili l-munīfati bi-ʿuqūdi ḥulāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَأَفْضَلُ الصَّلَاةِ وَأَتَمُّ التَّسْلِيمِ عَلَى سَيِّدِنَا وَمَوْلَانَا مُحَمَّدٍ خَاتَمِ الْأَنْبِيَاءِ وَالْمُرْسَلِينَ ❁","وَعَلَى آلِهِ وَصَحْبِهِ أَجْمَعِينَ ❁"],"transliteration":["Wa-afḍalu ṣ-ṣalāti wa-atammu t-taslīmi ʿalā sayyidinā wa-mawlānā Muḥammadin khātami l-anbiyā'i wa-l-mursalīna, wa-ʿalā ālihi wa-ṣaḥbihi ajmaʿīna, ﴾subḥāna Rabbika Rabbi l-ʿizzati ʿammā yaṣifūna, wa-salāmun ʿalā l-mursalīna wa-l-ḥamdu li-Llāhi Rabbi l-ʿālamīn.﴿",""],"translation":["And the finest prayers and most complete peace be upon our master and patron Muhammad, the Seal of the Prophets and Messengers, and upon all his family and Companions. “Glory be to your Lord, the Lord of Might, above what they ascribe. And peace be upon the Messengers. And all praise is for Allah, Lord of the Worlds.” (al-Saffat, 37:180–182)",""],"isRefrain":false},{"arabic":["﴿سُبْحَـٰنَ رَبِّكَ رَبِّ ٱلْعِزَّةِ عَمَّا يَصِفُونَ ❁","وَسَلَـٰمٌ عَلَى ٱلْمُرْسَلِينَ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["وَٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَـٰلَمِينَ ❁","﴾ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false}]}];

const mawlidRef = ref(db, 'mawlid');
let currentQasidahIndex = -1;

const prevQasidahBtn = document.getElementById('prevQasidah');
const nextQasidahBtn = document.getElementById('nextQasidah');
const clearScreenBtn = document.getElementById('clearScreen');
const qasidahList = document.getElementById('qasidahList');
const preview = document.getElementById('preview');
const statusValue = document.getElementById('statusValue');

function updatePreview(qIdx) {
  if (qIdx < 0 || qIdx >= qasidahs.length) {
    preview.innerHTML = '<div class="preview-empty">No content selected</div>';
    statusValue.textContent = '—';
    return;
  }

  const qasidah = qasidahs[qIdx];
  const firstCouplet = qasidah.couplets[0];

  // Show title and first couplet as preview
  let html = `
    <div class="preview-title">${qasidah.title}</div>
    <div class="preview-subtitle">${qasidah.englishTitle}</div>
  `;

  if (firstCouplet) {
    html += `
    <div class="preview-arabic">${firstCouplet.arabic[0]}</div>
    ${firstCouplet.arabic[1] ? `<div class="preview-arabic">${firstCouplet.arabic[1]}</div>` : ''}
    <div class="preview-text"><strong>Translation:</strong></div>
    <div class="preview-text">${firstCouplet.translation.join(' ')}</div>
    `;
  }

  preview.innerHTML = html;
  statusValue.textContent = `Qasidah ${qIdx + 1} of ${qasidahs.length}`;
}

async function updateFirebase(qIdx) {
  currentQasidahIndex = qIdx;
  await set(mawlidRef, { qasidahIndex: qIdx, coupletIndex: 0 });
  updatePreview(qIdx);
}

prevQasidahBtn.addEventListener('click', () => {
  if (currentQasidahIndex > 0) {
    updateFirebase(currentQasidahIndex - 1);
  }
});

nextQasidahBtn.addEventListener('click', () => {
  if (currentQasidahIndex < qasidahs.length - 1) {
    updateFirebase(currentQasidahIndex + 1);
  }
});

clearScreenBtn.addEventListener('click', () => {
  updateFirebase(-1);
});

// Populate qasidah list
qasidahs.forEach((q, idx) => {
  const btn = document.createElement('button');
  btn.className = 'qasidah-btn';
  btn.textContent = `${idx + 1}. ${q.title}`;
  btn.addEventListener('click', () => updateFirebase(idx));
  qasidahList.appendChild(btn);
});

// Listen for changes from Firebase
onValue(ref(db, 'mawlid/qasidahIndex'), (snap) => {
  const qIdx = snap.val() ?? -1;

  currentQasidahIndex = qIdx;
  updatePreview(qIdx);

  // Update active qasidah button
  document.querySelectorAll('.qasidah-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === qIdx);
  });
});
</script>
</body>
</html>
