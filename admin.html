<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Control — Darul Ahbaab Live</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --green-950:#081310;--green-900:#0B1C15;--green-800:#0F2A1F;--green-700:#164034;
  --green-600:#1F5942;--green-500:#2E7D57;
  --gold-500:#D4A93E;--gold-400:#E3C265;--gold-300:#F0D68C;
  --cream:#F4EFE2;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Manrope',system-ui,sans-serif;color:var(--cream);
  background:linear-gradient(160deg,#081310,#164034);
  min-height:100vh;padding:2rem;
}
.admin-container{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:3rem}
.panel{background:rgba(255,255,255,.035);border:1px solid rgba(212,169,62,.14);border-radius:18px;padding:2rem;backdrop-filter:blur(10px)}
.panel h2{font-family:'Cormorant',serif;font-size:2rem;color:var(--gold-400);margin-bottom:1.5rem;font-weight:600}
.button-group{display:flex;flex-direction:column;gap:1rem;margin-bottom:2rem}
.button-row{display:flex;gap:1rem}
.btn{padding:14px 24px;border-radius:12px;border:none;font-family:'Manrope';font-size:1rem;font-weight:600;cursor:pointer;transition:all .3s var(--ease);flex:1}
.btn-primary{background:var(--gold-500);color:var(--green-950);box-shadow:0 4px 12px rgba(212,169,62,.3)}
.btn-primary:hover{background:var(--gold-400);transform:translateY(-2px);box-shadow:0 6px 16px rgba(212,169,62,.4)}
.btn-secondary{background:rgba(212,169,62,.15);color:var(--cream);border:1px solid rgba(212,169,62,.35)}
.btn-secondary:hover{background:rgba(212,169,62,.28);border-color:rgba(212,169,62,.55)}
.btn-danger{background:rgba(200,80,80,.6);color:var(--cream);border:1px solid rgba(200,80,80,.8)}
.btn-danger:hover{background:rgba(200,80,80,.8)}
.label{display:block;font-size:.9rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(244,239,226,.6);margin-bottom:.5rem;font-weight:600}
.qasidah-list{display:flex;flex-direction:column;gap:.5rem;margin-bottom:2rem}
.qasidah-btn{padding:12px 16px;border-radius:10px;border:1px solid rgba(212,169,62,.2);background:rgba(212,169,62,.08);color:var(--cream);text-align:left;cursor:pointer;transition:all .3s var(--ease);font-family:'Manrope';font-size:1rem}
.qasidah-btn:hover{background:rgba(212,169,62,.15);border-color:rgba(212,169,62,.4)}
.qasidah-btn.active{background:var(--gold-500);color:var(--green-950);border-color:var(--gold-500);font-weight:600}
.preview{background:rgba(8,19,16,.5);border:1px solid rgba(212,169,62,.2);border-radius:12px;padding:2rem;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:1.5rem}
.preview-empty{color:rgba(244,239,226,.5);font-style:italic}
.preview-title{font-family:'Cormorant',serif;font-size:1.8rem;color:var(--gold-300);font-weight:600}
.preview-subtitle{font-size:.95rem;color:rgba(244,239,226,.7)}
.preview-arabic{font-family:'Amiri',serif;font-size:1.6rem;color:var(--cream);line-height:1.4;margin:1rem 0}
.preview-text{font-size:1rem;color:rgba(244,239,226,.75);line-height:1.6}
.status{background:rgba(46,125,87,.15);border:1px solid rgba(46,125,87,.3);border-radius:10px;padding:1rem;margin-top:1.5rem}
.status-label{font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(244,239,226,.6);display:block;margin-bottom:.5rem}
.status-value{font-family:'Cormorant',serif;font-size:1.3rem;color:var(--gold-400);font-weight:600}
@media(max-width:1000px){
  .admin-container{grid-template-columns:1fr;gap:2rem}
}
</style>
</head>
<body>
<div class="admin-container">
  <div class="panel">
    <h2>Controls</h2>

    <div class="button-group">
      <div>
        <div class="label">Qasidah Navigation</div>
        <div class="button-row">
          <button class="btn btn-secondary" id="prevQasidah">← Previous</button>
          <button class="btn btn-secondary" id="nextQasidah">Next →</button>
        </div>
      </div>
      <button class="btn btn-danger" id="clearScreen" style="margin-top:1rem">Clear Screen</button>
    </div>

    <div>
      <div class="label">Jump to Qasidah</div>
      <div class="qasidah-list" id="qasidahList"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Live Preview</h2>
    <div class="preview" id="preview">
      <div class="preview-empty">No content selected</div>
    </div>
    <div class="status">
      <div class="status-label">Current Position</div>
      <div class="status-value" id="statusValue">—</div>
    </div>
  </div>
</div>

// Data: same qasidahs array as in live.html
const qasidahs = [{"title":"قَمَرٌ","englishTitle":"Moon","couplets":[{"arabic":["قَمَرٌ قَمَرٌ قَمَرٌ سِيدْنَا النَّبِي قَمَرٌ","وَجَمِيلْ وَجَمِيلْ وَجَمِيلْ سِيدْنَا النَّبِي وَجَمِيلْ"],"transliteration":["qamarun qamarun qamarun sīdnan nabī qamarun","wajamīl wajamīl wajamīl sīdnan nabī wajamīl"],"translation":["The Moon, The likeness of our Prophet is like the moon","Beautiful, Our master is truly beautiful"],"isRefrain":true},{"arabic":["وَأَجْمَلُ مِنْكَ لَمْ تَرَ قَطُّ عَيْنٍ [ الله الله ]","وَأَطْيَبُ مِنْكَ لَمْ تَلِدِ النِّسَآءُ [ الله الله ]"],"transliteration":["wa ajmalu minka lam tara qaṭṭu ʿaynin Allah Allah","wa aṭyabu minka lam talidin nisaā’u Allah Allah"],"translation":["More beautiful than you no eye has ever seen","And purer than you no woman ever givi birth to"],"isRefrain":false},{"arabic":["خُلِقْتَ مُبَرَّأً مِنْ كُلِّ عَيْبٍ","كَأَنْكَ قَدْ خُلِقْتَ كَمَا تَشَآءُ"],"transliteration":["khuliqta mubarra’an min kulli ʿaybin","ka anka qad khuliqta kamā tashaā’u"],"translation":["You were created free from any flaw whatsoever","As if you were created just the way you wanted"],"isRefrain":false},{"arabic":["قَمَرٌ قَمَرٌ قَمَرٌ سِيدْنَا النَّبِي قَمَرٌ","وَجَمِيلْ وَجَمِيلْ وَجَمِيلْ سِيدْنَا النَّبِي وَجَمِيلْ"],"transliteration":["qamarun qamarun qamarun sīdnan nabī qamarun","wajamīl wajamīl wajamīl sīdnan nabī wajamīl"],"translation":["The Moon, The likeness of our Prophet is like the moon","Beautiful, Our master is truly beautiful"],"isRefrain":true},{"arabic":["وَكَفُّ الْمُصْطَفَى كَالْوَرْدِ نَادِي [ الله الله ]","وَعِطْرُهَا يَبْقَى اِذَا مَسَّتْ أَيَادِي [ الله الله ]"],"transliteration":["wakafful muṣṭafā kal wardi nādī Allah Allah","waʿiṭruhā yabqā idhā massat ayādī Allah Allah"],"translation":["The palm of the Chosen One is like a rose-petal, silken and dewy","Its fragrant scent lingers upon the hands' brushing touch"],"isRefrain":false},{"arabic":["وَعَمَّ نَوَالُهَا كُلَّ العِبَادِ","حَبِيبُ اللهِ يَا خَيْرَ البَرَايَا"],"transliteration":["waʿamma nawāluhā kullal ʿibādi","ḥabību Allahi yā khayral barāyā"],"translation":["Its great favor has encompassed all of humanity, and is widespread.","[Such is] the beloved of Allah. O very best of creation!"],"isRefrain":false},{"arabic":["قَمَرٌ قَمَرٌ قَمَرٌ سِيدْنَا النَّبِي قَمَرٌ","وَجَمِيلْ وَجَمِيلْ وَجَمِيلْ سِيدْنَا النَّبِي وَجَمِيلْ"],"transliteration":["qamarun qamarun qamarun sīdnan nabī qamarun","wajamīl wajamīl wajamīl sīdnan nabī wajamīl"],"translation":["The Moon, The likeness of our Prophet is like the moon","Beautiful, Our master is truly beautiful"],"isRefrain":true},{"arabic":["كَحِيلُ الطَّرْفِ حَبِيبِي لَوْ تَرَاهُ [ الله الله ]","ضَحُوكُ السِّنَّ لِلْعَاشِقْ رَمَاهُ [ الله الله ]"],"transliteration":["kaḥīluṭ ṭarfi ḥabībī law tarāhu Allah Allah","ḍaḥūkus sinna lilʿāshiq ramāhu Allah Allah"],"translation":["Kohl-eyed is my beloved, were you to see him","Cheerful and smiling, leaving his admirers utterly love-struck"],"isRefrain":false},{"arabic":["بَهِيُّ الطَّلْعَةْ فَالْمَوْلَى اصْطَفَاهُ","وَكُلُّ الخَلْقِ مِن أَنْوَارِ طَهَ"],"transliteration":["bahiyyuṭ ṭalʿah fal mawlāṣ ṭafāhu","wakullul khalqi min anwāri ṭaha"],"translation":["Magnificent of appearance, for the Lord did choose him","While all of creation is lit up from the light of Ta-Ha"],"isRefrain":false},{"arabic":["قَمَرٌ قَمَرٌ قَمَرٌ سِيدْنَا النَّبِي قَمَرٌ","وَجَمِيلْ وَجَمِيلْ وَجَمِيلْ سِيدْنَا النَّبِي وَجَمِيلْ"],"transliteration":["qamarun qamarun qamarun sīdnan nabī qamarun","wajamīl wajamīl wajamīl sīdnan nabī wajamīl"],"translation":["The Moon, The likeness of our Prophet is like the moon","Beautiful, Our master is truly beautiful"],"isRefrain":true},{"arabic":["وَلَا ظِلُّ لَهُ بَلْ كَانَ نُورَا [ الله الله ]","تَنَالُ الشَّمْسَ مِنْهُ وَالْبُدُورَا [ الله الله ]"],"transliteration":["walā ẓillu lahu bal kāna nūrā Allah Allah","tanālush shamsa minhu wal budūrā Allah Allah"],"translation":["He had no taint of shadow, rather he was light","The moon and sun both benefited from him"],"isRefrain":false},{"arabic":["وَلَمْ يَكُنِ الْهُدَى لَوْلَا ظُهُورَهْ","وَكُلُّ الْكَوْنِ أَنَارَ بِنُورِ طَهَ"],"transliteration":["walam yakunil hudā lawlā ẓuhūrah","wakullul kawni anāra binūri ṭaha"],"translation":["There would have been no guidance without his appearance","The whole universe became illuminated through the light of Ta-Ha"],"isRefrain":false},{"arabic":["قَمَرٌ قَمَرٌ قَمَرٌ سِيدْنَا النَّبِي قَمَرٌ","وَجَمِيلْ وَجَمِيلْ وَجَمِيلْ سِيدْنَا النَّبِي وَجَمِيلْ"],"transliteration":["qamarun qamarun qamarun sīdnan nabī qamarun","wajamīl wajamīl wajamīl sīdnan nabī wajamīl"],"translation":["The Moon, The likeness of our Prophet is like the moon","Beautiful, Our master is truly beautiful"],"isRefrain":true},{"arabic":["وَرِيقُ المُصْطَفَى يَشْفِي العَلِيلَ [ الله الله ]","وَعَيْنُ قَتَادَةَ خُذْهَا دَلِيلَا [ الله الله ]"],"transliteration":["warīqul muṣṭafā yashfīl ʿalīla Allah Allah","waʿaynu qatādata khudhhā dalīlā Allah Allah"],"translation":["The saliva of the Chosen One heals the ailing, the sick.","Take the eye of Qatada as evidence [of this]"],"isRefrain":false},{"arabic":["تَفَلْ فِي الْبِئْرِ أَضْحَتْ سَلْسَبِيلًا","وَصَارَ لِصَحْبِهِ شَهْدًا مُدَامَا"],"transliteration":["tafal fīl bi’ri aḍḥat salsabīlan","waṣāra liṣaḥbihi shahdan mudāmā"],"translation":["He spat in the well and it became a flowing spring","And it became like honey for his companions."],"isRefrain":false}]},{"title":"Diya'ul Lami: Introduction","englishTitle":"Introduction","couplets":[{"arabic":["يَارَبِّ صَلِّ عَلَى مُحَمَّدْ","يَارَبِّ صَلِّ عَلَيْهِ وَسَلِّمْ"],"transliteration":["yārabbi ṣalli ʿalā muḥammad","yārabbi ṣalli ʿalayhi wasallim"],"translation":["O Lord, send Your mercy upon Muhammad","O Lord, send Your mercy and peace upon Muhammad."],"isRefrain":false},{"arabic":["يَارَبِّ صَلِّ عَلَى مُحَمَّدْ","حَبِيبِكَ الشَّافِعِ المُشَفَّعْ"],"transliteration":["yārabbi ṣalli ʿalā muḥammad","ḥabībikash shāfiʿil mushaffaʿ"],"translation":["O Lord, send Your mercy upon Muhammad","Your Beloved One, the Intercessor, whose intercession is accepted"],"isRefrain":false},{"arabic":["يَارَبِّ صَلِّ عَلَى مُحَمَّدْ","أَعْلَى الوَرَى رُتْبَةً وَ أَرْفَعْ"],"transliteration":["yārabbi ṣalli ʿalā muḥammad","aʿlal warā rutbatan wa arfaʿ"],"translation":["O Lord, send Your mercy upon Muhammad","Most lofty of mankind in station and most exalted"],"isRefrain":false},{"arabic":["يَارَبِّ صَلِّ عَلَى مُحَمَّدْ","أَسْمَى البَرَايَا جَاهَاً وَ أَوْسَعْ"],"transliteration":["yārabbi ṣalli ʿalā muḥammad","asmal barāyā jāhāan wa awsaʿ"],"translation":["O Lord, send Your mercy upon Muhammad","Highest and most vast of creation in rank"],"isRefrain":false},{"arabic":["يَارَبِّ صَلِّ عَلَى مُحَمَّدْ","وَ اسْلُكْ بِنَا رَبِّ خَيْرَ مَهْيَعْ"],"transliteration":["yārabbi ṣalli ʿalā muḥammad","was luk binā rabbi khayra mahyaʿ"],"translation":["O Lord, send Your mercy upon Muhammad","Lead us, my Lord, upon the most virtuous of paths"],"isRefrain":false},{"arabic":["يَارَبِّ صَلِّ عَلَى مُحَمَّدْ","وَ عَافِنَا وَ اشْفِ كُلَّ مُوجَعْ"],"transliteration":["yārabbi ṣalli ʿalā muḥammad","wa ʿāfinā wash fi kulla mūjaʿ"],"translation":["O Lord, send Your mercy upon Muhammad","Give us us well-being and cure every suffering one"],"isRefrain":false},{"arabic":["يَارَبِّ صَلِّ عَلَى مُحَمَّدْ","وَ أَصلِحِ القَلْبَ وَ اعْفُ وَ انْفَعْ"],"transliteration":["yārabbi ṣalli ʿalā muḥammad","wa aṣliḥil qalba waʿ fu wan faʿ"],"translation":["O Lord, send Your mercy upon Muhammad","Rectify hearts, pardon us and benefit us"],"isRefrain":false},{"arabic":["يَارَبِّ صَلِّ عَلَى مُحَمَّدْ","وَ اكْفِ المُعَادِي وَ اصْرِفْهُ وَ ارْدَعْ"],"transliteration":["yārabbi ṣalli ʿalā muḥammad","wak fil muʿādī waṣ rifhu war daʿ"],"translation":["O Lord, send Your mercy upon Muhammad","Restrain, divert and deter every aggressor"],"isRefrain":false},{"arabic":["يَارَبِّ صَلِّ عَلَى مُحَمَّدْ","نَحِلُّ فِي حِصْنِكَ المُمَنَّعْ"],"transliteration":["yārabbi ṣalli ʿalā muḥammad","naḥillu fī ḥiṣnikal mumannaʿ"],"translation":["O Lord, send Your mercy upon Muhammad","Allow us to dwell in Your impenetrable fortress"],"isRefrain":false},{"arabic":["يَارَبِّ صَلِّ عَلَى مُحَمَّدْ","رَبِّ ارْضَ عَنَّا رِضَاكَ الأَرْفَعْ"],"transliteration":["yārabbi ṣalli ʿalā muḥammad","rabbir ḍa ʿannā riḍākal arfaʿ"],"translation":["O Lord, send Your mercy upon Muhammad","Lord, be pleased with us with Your Most Exalted Pleasure"],"isRefrain":false},{"arabic":["يَارَبِّ صَلِّ عَلَى مُحَمَّدْ","وَ اجْعَلْ لَنَا فِي الجِنَانِ مَجْمَعْ"],"transliteration":["yārabbi ṣalli ʿalā muḥammad","waj ʿal lanā fīl jināni majmaʿ"],"translation":["O Lord, send Your mercy upon Muhammad","And make the Gardens of Paradise our place of gathering"],"isRefrain":false},{"arabic":["يَارَبِّ صَلِّ عَلَى مُحَمَّدْ","رَافِقْ بِنَا خَيْرَ خَلْقِكَ اجْمَعْ"],"transliteration":["yārabbi ṣalli ʿalā muḥammad","rāfiq binā khayra khalqikaj maʿ"],"translation":["O Lord, send Your mercy upon Muhammad","Grant us all the company of the best of Your creation"],"isRefrain":false},{"arabic":["يَارَبِّ صَلِّ عَلَى مُحَمَّدْ","يَارَبِّ صَلِّ عَلَيْهِ وَسَلِّم"],"transliteration":["yārabbi ṣalli ʿalā muḥammad","yārabbi ṣalli ʿalayhi wasallim"],"translation":["O Lord, send Your mercy upon Muhammad","Oh Allah, send Your mercy, peace and blessings upon him and his Family"],"isRefrain":false}]},{"title":"Diya'ul Lami: Chapter 1","englishTitle":"Chapter 1","couplets":[{"arabic":["الحَمْدُ لِلّهِ الَّذِي هَدَانَا","بِعَبْدِهِ المُخْتَارِ مَن دَعَانَا"],"transliteration":["alḥamdu lillāhil ladhī hadānā","biʿabdihil mukhtāri man daʿānā"],"translation":["Praise be to the One who guided us","Through His chosen slave, who summoned us"],"isRefrain":false},{"arabic":["إِلَيْهِ بِالإِذْنِ وَ قَدْ نَادَانَا","لَبَّيْكَ يَا مَنْ دَلَّنَا وَحَدَانَا"],"transliteration":["ilayhi bil idhni wa qad nādānā","labbayka yā man dallanā waḥadānā"],"translation":["To HIm, by (His) permission, indeed he invited us","At your service [O Prophet], O one who guided and urged us forward"],"isRefrain":false},{"arabic":["صَلَّى عَلَيْكَ اللهُ بَارِئُكَ الَّذِي","بِكَ يَا مُشَفَّعُ خَصَّنَا وَ حَبَانَا"],"transliteration":["ṣallā ʿalayka Allahu bāri’ukal ladhī","bika yā mushaffaʿu khaṣṣanā wa ḥabānā"],"translation":["Allāh - your creator - has sent mercy upon you","Through you, O Possessor of Intercession, He distinguished and favoured us"],"isRefrain":false},{"arabic":["مَعَ آلِكَ الأَطْهَارِ مَعْدِنِ سِرِّكَ الــ","أَسْمَى فَهُمْ سُفُنُ النَّجَاةِ حِمَانَا"],"transliteration":["maʿa ālikal aṭhāri maʿdini sirrikal","asmā fahum sufunun najāti ḥimānā"],"translation":["Together with your pure Family, the treasure trove of your highest secret,","For they are the ships of salvation, our sanctuary"],"isRefrain":false},{"arabic":["وَ عَلَى صَحَابَتِكَ الكِرَامِ حُمَاةِ دِينِكَ","أَصْبَحُوا لِوَلَائِهِ عُنْوَانَا"],"transliteration":["wa ʿalā ṣaḥābatikal kirāmi ḥumāti dīnika","aṣbaḥū liwalā’ihi ʿunwānā"],"translation":["And upon your noble Companions, the defenders of your religion","They are models of loyalty to him"],"isRefrain":false},{"arabic":["وَ التَّابِعِينَ لَهُمْ بِصِدْقٍ مَا حَدَا","حَادِي المَوَدَّةِ هَيَّجَ الأَشْجَانَا"],"transliteration":["wat tābiʿīna lahum biṣidqin mā ḥadā","ḥādīl mawaddati hayyajal ashjānā"],"translation":["And upon those who follow them with truthfulness, as long as","The camel singer urges on the caravan of love, igniting the fires of yearning"],"isRefrain":false},{"arabic":["وَ اللهِ مَا ذُكِرَ الحَبِيبُ لَدَى المُحِبّ","إِلَّا وَ أَضْحَى وَالِهَاً نَشْوَانَا"],"transliteration":["wa Allahi mā dhukiral ḥabību ladal muḥibb","illā wa aḍḥā wālihāan nashwānā"],"translation":["By Allāh, never is the Beloved mentioned in the presence of the lover","Except that he becomes passionately overwhelmed with joy"],"isRefrain":false},{"arabic":["أَيْنَ المُحِبُّونَ الَّذِينَ عَلَيْهِمُ","بَذْلُ النُّفُوسِ مَعَ النَّفَائِسِ هَانَا؟"],"transliteration":["aynal muḥibbūnal ladhīna ʿalayhimu","badhlun nufūsi maʿan nafā’isi hānā"],"translation":["Where are the lovers who find ease","In sacrificing their souls and every precious thing [for their beloved]?"],"isRefrain":false},{"arabic":["لَا يَسْمَعُونَ بِذِكْرِ طَهَ المُصْطَفَى","إِلَّا بِهِ انْتَعَشُوا وَ أَذْهَبَ رَانَا"],"transliteration":["lā yasmaʿūna bidhikri ṭahal muṣṭafā","illā bihin taʿashū wa adhhaba rānā"],"translation":["Never do they hear a mention of Ṭaha, the Chosen one,","Except that by it they are revived and the rust [upon their heart] vanishes"],"isRefrain":false},{"arabic":["فَاهْتَاجَتِ الأَرْوَاحُ تَشْتَاقُ اللِّقَا","وَ تَحِنُّ تَسأَلُ رَبَّهَا الرِّضْوَانَا"],"transliteration":["fah tājatil arwāḥu tashtāqul liqā","wa taḥinnu tasalu rabbahar riḍwānā"],"translation":["Their souls have become aroused, yearning for the encounter,","Longing and asking their Lord for His Good Pleasure"],"isRefrain":false},{"arabic":["حَالُ المُحِبِّينَ كَذَا فَاسْمَعْ إِلى","سِيَرِ المُشَفَّعِ وَ ارْهِفِ الآذَانَا"],"transliteration":["ḥālul muḥibbīna kadhā fas maʿ ilā","siyaril mushaffaʿi war hifil ādhānā"],"translation":["This is the state of the lovers, so listen closely","To the life story of the one whose intercession is accepted"],"isRefrain":false},{"arabic":["وَ انْصِتْ إِلَى أَوْصَافِ طَهَ المُجْتَبَى","وَ احْضِرْ لِقَلْبِكَ يَمْتَلِئْ وِجْدَانَا"],"transliteration":["wan ṣit ilā awṣāfi ṭahal mujtabā","waḥ ḍir liqalbika yamtali’ wijdānā"],"translation":["And lend an ear to the description of Ṭaha, the Elected One,","Make your heart present, and it will be filled with ecstasy"],"isRefrain":false},{"arabic":["يَارَبَّنَا صَلِّ وَ سَلِّم دَائِماً","عَلَى حَبِيبِكَ مَن إِلَيكَ دَعَانَا"],"transliteration":["yārabbanā ṣalli wa sallim dā’iman","ʿalā ḥabībika man ilaīka daʿānā"],"translation":["Our Lord, send Your mercy and peace perpetually","Upon Your Beloved, the one who invited us to You,"],"isRefrain":false}]},{"title":"Diya'ul Lami: Chapter 2","englishTitle":"Chapter 2","couplets":[{"arabic":["نَبَّأَنَا اللهُ فَقَالَ \"جَاءَكُمْ","نُورٌ\" فَسُبْحَانَ الَّذِي أَنْبَانَا"],"transliteration":["nabba’ana Allahu faqāla jā’akum","nūrun fasubḥānal ladhī anbānā"],"translation":["Allāh has announced to us [in the Qur'an], saying, 'Indeed, there has come to you...","A light'. So glory be to the One who informed us!"],"isRefrain":false},{"arabic":["وَ النُّورُ طَهَ عَبْدُهُ مَنَّ بِهِ","فِي ذِكْرِهِ, أَعْظِمْ بِهِ مَنَّانَا"],"transliteration":["wan nūru ṭaha ʿabduhu manna bihi","fī dhikrihi aʿẓim bihi mannānā"],"translation":["And the light is Ṭaha, His servant, He has bestowed [great] favor through him","As mentioned in His reminder, so declare the magnificence of the Bestower of Gifts!"],"isRefrain":false},{"arabic":["هُوَ رَحْمَةُ المَولَى تَأَمَّلْ قَوْلَهُ","فَلْيَفْرَحُوا، وَ اغْدُ بِهِ فَرْحَانَا"],"transliteration":["huwa raḥmatul mawlā ta’ammal qawlahu","falyafraḥūā wagh du bihi farḥānā"],"translation":["He is the mercy of our Master. Reflect upon His words:","'Rejoice' and through him go forth in utter happiness"],"isRefrain":false},{"arabic":["مُسْتَمْسِكَاً بِالعُرْوَةِ الوُثْقَى","وَ مُعْتَصِمَاً بِحَبْلِ اللهِ مَنْ أَنْشَانَا"],"transliteration":["mustamsikāan bil ʿurwatil wuthqā","wa muʿtaṣimāan biḥablillāhi man anshānā"],"translation":["While taking hold of the firmest handhold,","And clinging to the rope of Allāh, our Originator"],"isRefrain":false},{"arabic":["وَ اسْتَشْعِرَنْ أَنْوَارَ مَنْ قِيلَ : مَتَى","كُنْتَ نَبِيَّاً؟ قَالَ : آدَمُ كَانَا"],"transliteration":["was tashʿiran anwāra man qīla matā","kunta nabiyyāan qāla ādamu kānā"],"translation":["Experience the lights of the one, who when asked,","'When were you a prophet?' replied, 'When Adam was..."],"isRefrain":false},{"arabic":["بَيْنَ التُّرَابِ وَ بَيْنَ مَاءٍ فَاسْتَفِقْ","مِنْ غَفْلَةٍ عَنْ ذَا وَ كُنْ يَقْظَانَا"],"transliteration":["baynat turābi wa bayna mā’in fas tafiq","min ghaflatin ʿan dhā wa kun yaqẓānā"],"translation":["...between earth and water! So awaken","From your heedlessness concerning this and become enlightened!"],"isRefrain":false},{"arabic":["وَ اعْبُرْ إِلَى أَسْرَارِ رَبِّي لَمْ يَزَلْ","يَنْقُلُنِي بَيْنَ الخِيَارِ مُصَانَا"],"transliteration":["waʿ bur ilā asrāri rabbī lam yazal","yanqulunī baynal khiyāri muṣānā"],"translation":["Contemplate the secrets of 'My Lord continued","To transport me safely through the best [of loins]."],"isRefrain":false},{"arabic":["لَمْ تَفْتَرِقْ مِن شُعْبَتَيِنِ إِلَّا أَنَا","فِي خَيْرِهَا حَتَّى بُرُوزِيَ آنَا"],"transliteration":["lam taftariq min shuʿbatayini illā anā","fī khayrihā ḥattā burūziya ānā"],"translation":["'Never did two lineages branch out except that I was","in the better half until the time came for my emergence,"],"isRefrain":false},{"arabic":["فَأَنَا خِيَارٌ مِنْ خِيَارٍ قَدْ خَرَجْتُ","مِنْ نِكَاحٍ لِي إِلَهِيَ صَانَا"],"transliteration":["fa anā khiyārun min khiyārin qad kharajtu","min nikāḥin lī ilahiya ṣānā"],"translation":["'For I am the best of the best, I have come into existence","Through pure unions [alone]; my Lord has protected this for me'."],"isRefrain":false},{"arabic":["طَهَّرَهُ اللهُ حَمَاهُ اخْتَارَهُ","وَمَا بَرَى كَمِثْلِهِ إِنْسَانَا"],"transliteration":["ṭahharahu Allahu ḥamāhukh tārahu","wamā barā kamithlihi insānā"],"translation":["Allāh has purified him, protected him and chosen him,","Never has any human being been created like him!"],"isRefrain":false},{"arabic":["وَ بِحُبِّهِ وَ بِذِكْرِهِ وَ النَّصْرِ وَ التَّوْقِيرِ","رَبُّ العَرْشِ قَدْ أَوْصَانَا"],"transliteration":["wa biḥubbihi wa bidhikrihi wan naṣri wat tawqīri","rabbul ʿarshi qad awṣānā"],"translation":["To love him, to mention him, to give him victory and to respect him,","Thus we are directed by the Lord of the Throne"],"isRefrain":false},{"arabic":["يَا رَبَّنَا صَلِّ وَ سَلِّمْ دَائِماً","عَلَى حَبِيبِكَ مَنْ إِلَيْكَ دَعَانَا"],"transliteration":["yā rabbanā ṣalli wa sallim dā’iman","ʿalā ḥabībika man ilayka daʿānā"],"translation":["Our Lord, send Your Mercy and Peace perpetually","Upon Your Beloved, the one who invited us to You."],"isRefrain":false}]},{"title":"Diya'ul Lami: Chapter 3","englishTitle":"Chapter 3","couplets":[{"arabic":["هَذَا وَ قَدْ نَشَرَ الإِلَهُ نُعُوتَهُ","فِي الكُتْبِ بَيَّنَهَا لَنَا تِبْيَانَا"],"transliteration":["hadhā wa qad nasharal ilahu nuʿūtahu","fīl kutbi bayyanahā lanā tibyānā"],"translation":["So indeed the Divine has spread mention of His attributes","In the revealed books, announcing them to us clearly"],"isRefrain":false},{"arabic":["أَخَذَ مِيثَاقَ النَّبِيِّينَ لَمَا","آتيْتُكُمْ مِنْ حِكْمَةٍ إِحْسَانَا"],"transliteration":["akhadha mīthāqan nabiyyīna lamā","ātytukum min ḥikmatin iḥsānā"],"translation":["He took the covenant from the Prophets","When [He said] 'I have given you of wisdom, the most excellent,"],"isRefrain":false},{"arabic":["وَ جَاءَكُمْ رَسُولُنَا لَتُؤْمِنُنَّ","وَ تَنْصُرُونَ وَ تُصْبِحُونَ أَعْوَانَا"],"transliteration":["wa jā’akum rasūlunā latu’minunna","wa tanṣurūna wa tuṣbiḥūna aʿwānā"],"translation":["'And [when] Our Messenger comes to you, Then you must believe in him,","give victory to him, And become his helpers.'"],"isRefrain":false},{"arabic":["قَدْ بَشَّرُوا أَقْوَامَهُمْ بِالمُصْطَفَى","أَعْظِمْ بِذَلِكَ رُتْبَةً وَ مَكَانَا"],"transliteration":["qad bashsharū aqwāmahum bil muṣṭafā","aʿẓim bidhalika rutbatan wa makānā"],"translation":["They gave their people the good news of the coming of the Chosen One,","Oh how great is that station and rank!"],"isRefrain":false},{"arabic":["فَهُوَ وَ إِنْ جَاءَ الأَخِيرُ مُقَدَّمٌ","يَمْشُونَ تَحْتَ لِوَاءِ مَن نَادَانَا"],"transliteration":["fahuwa wa in jā’al akhīru muqaddamun","yamshūna taḥta liwā’i man nādānā"],"translation":["Although he was the last to be sent, he will be the foremost,","[All the Prophets] will walk under the banner of the one who called us."],"isRefrain":false},{"arabic":["يَا أُمَّةَ الإِسْلَامِ أَوَّلُ شَافِعٍ","وَ مُشَفَّعٍ أَنَا قَطُّ لَا أَتَوَانَى"],"transliteration":["yā ummatal islāmi awwalu shāfiʿin","wa mushaffaʿin anā qaṭṭu lā atawānā"],"translation":["'O Ummah of Islam! I am the first intercessor","and my intercession will be accepted, I will not hold back in any way whatsoever"],"isRefrain":false},{"arabic":["حَتَّى أُنَادَى ارْفَعْ وَ سَلْ تُعْطَ وَ قُلْ","يُسْمَعْ لِقَوْلِكَ نَجْمُ فَخْرِكَ بَانَا"],"transliteration":["ḥattā unādār faʿ wa sal tuʿṭa wa qul","yusmaʿ liqawlika najmu fakhrika bānā"],"translation":["'Until it will be said, “Rise [from prostration]; ask and you will be given;","speak and you will be heard, for the star of your glory has become manifest.\""],"isRefrain":false},{"arabic":["وَ لِوَاءُ حَمْدِ اللهِ جَلَّ بِيَدِي","وَ لَأَوَّلاً آتِي أَنَا الجِنَانَا"],"transliteration":["wa liwā’u ḥamdillāhi jalla biyadī","wa la’awwalan ātī anal jinānā"],"translation":["\"The banner of the praise of Allāh Most High will be in my hand,","And indeed I will be the first to enter Paradise!"],"isRefrain":false},{"arabic":["وَ أَكْرَمُ الخَلْقِ عَلَى اللهِ أَنَا","فَلَقَدْ حَبَاكَ اللهُ مِنْهُ حَنَانَا"],"transliteration":["wa akramul khalqi ʿala Allahi anā","falaqad ḥabāka Allahu minhu ḥanānā"],"translation":["'I am the most honorable of creation with Allāh.'","Indeed Allāh has granted you compassion from himself"],"isRefrain":false},{"arabic":["وَ لَسَوْفَ يُعْطِيكَ فَتَرضَى، جَلَّ مِنْ","مُعْطٍ تَقَاصَرَ عَن عَطَاهُ نُهَانَا"],"transliteration":["wa lasawfa yuʿṭīka fatarḍā jalla min","muʿṭin taqāṣara ʿan ʿaṭāhu nuhānā"],"translation":["'And [your Lord] will give to you so that you are pleased' - Exalted is the Giver!","Our intellects are incapable of grasping His bounty!"],"isRefrain":false},{"arabic":["بِاللّهِ كَرِّرْ ذِكْرَ وَصْفِ مُحَمَّدٍ","كَيْمَا تُزِيحَ عَنِ القُلُوبِ الرَّانَا"],"transliteration":["billāhi karrir dhikra waṣfi muḥammadin","kaymā tuzīḥa ʿanil qulūbir rānā"],"translation":["By Allāh, mention the attributes of Muḥammad time and time again","In order to remove the rust from [our] hearts."],"isRefrain":false},{"arabic":["يَا رَبَّنَا صَلِّ وَ سَلِّمْ دَائِماً","عَلَى حَبِيبِكَ مَنْ إِلَيْكَ دَعَانَا"],"transliteration":["yā rabbanā ṣalli wa sallim dā’iman","ʿalā ḥabībika man ilayka daʿānā"],"translation":["Our Lord, send Your Mercy and Peace perpetually","Upon Your Beloved, the one who invited us to You."],"isRefrain":false}]},{"title":"Diya'ul Lami: Chapter 4","englishTitle":"Chapter 4","couplets":[{"arabic":["لَمَّا دَنَا وَقْتُ البُرُوزِ لأَحْمَدٍ","عَنْ إِذْنِ مَنْ مَا شَاءَهُ قَدْ كَانَا"],"transliteration":["lammā danā waqtul burūzi laḥmadin","ʿan idhni man mā shā’ahu qad kānā"],"translation":["When the time drew near for the emergence of Aḥmad","He came into being by the permission of the One who willed it so."],"isRefrain":false},{"arabic":["حَمَلَتْ بِهِ الأُمُّ الأَمِينَةُ بِنْتُ وَهْبٍ","مَن لَهَا أَعْلَى الإِلَهُ مَكَانَا"],"transliteration":["ḥamalat bihil ummul amīnatu bintu wahbin","man lahā aʿlal ilahu makānā"],"translation":["The trustworthy mother, the daughter of Wahb,","She whose station had been elevated by God, became pregnant with him,"],"isRefrain":false},{"arabic":["مِن وَالِدِ المُخْتَارِ عَبْدِ اللهِ بِنْ","عَبْدٍ لِمُطَّلِبٍ رَأَى البُرْهَانَا"],"transliteration":["min wālidil mukhtāri ʿabdillāhi bin","ʿabdin limuṭṭalibin ra’al burhānā"],"translation":["From the chosen father 'Abd-Allāh, the son of 'Abd al-Muttalib","who saw the evident proof"],"isRefrain":false},{"arabic":["قَدْ كَانَ يَغْمُرُ نُورُ طَهَ وَجْهَهُ","وَ سَرَى إِلَى الإِبْنِ المَصُونِ عِيَانَا"],"transliteration":["qad kāna yaghmuru nūru ṭaha wajhahu","wa sarā ilal ibnil maṣūni ʿiyānā"],"translation":["His face overflowed with the light of Ṭaha","Then it was transferred to the protected son ['Abd-Allāh] for all to see"],"isRefrain":false},{"arabic":["وَ هُوَ ابْنُ هَاشِمٍ الكَرِيمِ الشَّهْمِ بِنْ","عَبْدِ مَنَافٍ ابْنِ قُصَيٍّ كَانَا"],"transliteration":["wa huwab nu hāshiminal karīmish shahmi bin","ʿabdi manāfinb ni quṣayyin kānā"],"translation":["And he ['Abd al-Muttalib] was the son of Hāshim, the generous and noble [Who] was","The son of 'Abdu Manāf, the son of Qusayy"],"isRefrain":false},{"arabic":["وَالِدُهُ يُدْعَى حَكِيمًا شَأْنُهُ","قَدِ اعْتَلَى أَعْزِزْ بِذَلِكَ شَانَا"],"transliteration":["wāliduhu yudʿā ḥakīman sha’nuhu","qadiʿ talā aʿziz bidhalika shānā"],"translation":["And [Qusayy's] father was named 'The Wise', his status has been elevated,","Indeed by them the lineage was strengthened"],"isRefrain":false},{"arabic":["وَاحْفَظْ أُصُولَ المُصْطَفَى حَتَّى تَرَى","فِي سِلْسِلَاتِ أُصُولِهِ عَدْنَانَا"],"transliteration":["waḥ faẓ uṣūlal muṣṭafā ḥattā tarā","fī silsilāti uṣūlihi ʿadnānā"],"translation":["Commit to memory the lineage of the Chosen One","Until you see ʿAdnān in the line of his ancestors"],"isRefrain":false},{"arabic":["فَهُنَاكَ قِفْ وَ اعْلَمْ بِرَفْعِهِ إِلَى اسْمَاعِيلَ","كَانَ لِلأَبِ مِعْوَانَا"],"transliteration":["fahunāka qif waʿ lam birafʿihi ilās māʿīla","kāna lilabi miʿwānā"],"translation":["At that point, stop and realize that the lineage is traced back to Ismaīl,","who was a loyal helper to his father"],"isRefrain":false},{"arabic":["وَ حِينَمَا حَمَلَتْ بِهِ آمِنَةٌ","لَمْ تَشْكُ شَيْئاً يَأْخُذُ النِّسْوَانَا"],"transliteration":["wa ḥīnamā ḥamalat bihi āminatun","lam tashku shay’an ya’khudhun niswānā"],"translation":["And while Āmina was carrying him,","She did not complain of anything that befalls [pregnant] women"],"isRefrain":false},{"arabic":["وَ بِهَا أَحَاطَ اللُّطْفُ مِنْ رَبِّ السَّمَا","أَقْصَى الأَذَى وَ الهَمَّ وَ الأَحْزَانَا"],"transliteration":["wa bihā aḥāṭal luṭfu min rabbis samā","aqṣal adhā wal hamma wal aḥzānā"],"translation":["Gentleness from the Lord of Heaven encompassed her","And drove away from her all harm, worry and sadness"],"isRefrain":false},{"arabic":["وَ رَأَتْ كَمَا قَدْ جَاءَ مَا عَلِمَتْ بِهِ","أَنَّ المُهَيْمِنَ شَرَّفَ الأَكْوَانَا"],"transliteration":["wa ra’at kamā qad jā’a mā ʿalimat bihi","annal muhaymina sharrafal akwānā"],"translation":["And she saw [in a vision], as is narrated what she had come to know","That the Guardian (Allāh) had honored the universe"],"isRefrain":false},{"arabic":["بِالطُّهْرِ مَنْ فِي بَطْنِهَا فَاسْتَبْشَرَتْ","وَ دَنَا المَخَاضُ فَأُتْرِعَتْ رِضْوَانَا"],"transliteration":["biṭ ṭuhri man fī baṭnihā fas tabsharat","wa danal makhāḍu fa utriʿat riḍwānā"],"translation":["Through the pure one who was in her womb, so she rejoiced,","As the time for labour drew near, she was filled with happiness"],"isRefrain":false},{"arabic":["وَ تَجَلَّتِ الأَنْوَارُ مِنْ كُلِّ الجِهَاتِ","فَوَقْتُ مِيلَادِ المُشَفَّعِ حَانَا"],"transliteration":["wa tajallatil anwāru min kullil jihāti","fawaqtu mīlādil mushaffaʿi ḥānā"],"translation":["The lights emanated from all directions","For the moment of birth of the one given intercession had come"],"isRefrain":false},{"arabic":["وَ قُبَيْلَ فَجْرٍ أَبْرَزَتْ شَمْسَ الهُدَى","ظَهَرَ الحَبِيبُ مُكَرَّماً وَ مُصَانَا"],"transliteration":["wa qubayla fajrin abrazat shamsal hudā","ẓaharal ḥabību mukarraman wa muṣānā"],"translation":["And shortly before dawn, the Sun of Guidance was made manifest,","The Beloved appeared, honored and protected"],"isRefrain":false}]},{"title":"Diya'ul Lami: Place of Standing","englishTitle":"Place of Standing","couplets":[{"arabic":["صَلَّى الله عَلَى مُحَمَّدْ","صَلَّى الله عَلَيْهِ وَ سَلَّمْ"],"transliteration":["ṣalla Allah ʿalā muḥammad","ṣalla Allah ʿalayhi wa sallam"],"translation":["O Allāh, send Your Mercy upon Muḥammad","O Allāh, send your Mercy and Peace upon him"],"isRefrain":false},{"arabic":["يَا نَبِيّ سَلَامْ عَلَيْكَ","يَا رَسُولْ سَلَامْ عَلَيْكَ"],"transliteration":["yā nabiyy salām ʿalayka","yā rasūl salām ʿalayka"],"translation":["O Prophet, peace be upon you","O Messenger, peace be upon you."],"isRefrain":false},{"arabic":["يَا حَبِيبْ سَلَامْ عَلَيْكَ","صَلَوَاتُ اللهْ عَلَيْكَ"],"transliteration":["yā ḥabīb salām ʿalayka","ṣalawātu Allah ʿalayka"],"translation":["O Beloved, peace be upon you (O Messenger of Allāh)","The blessings of Allāh be upon you"],"isRefrain":false},{"arabic":["أَبْرَزَ اللهُ المُشَفَّعْ","صَاحِبَ القَدْرِ المُرَفَّعْ"],"transliteration":["abraza Allahul mushaffaʿ","ṣāḥibal qadril muraffaʿ"],"translation":["Allāh has manifested the Intercessor","Possessor of the elevated station"],"isRefrain":false},{"arabic":["فَمَلَا النُّورُ النَّوَاحِي","عَمَّ كُلَّ الكَوْنِ أَجْمَعْ"],"transliteration":["famalan nūrun nawāḥī","ʿamma kullal kawni ajmaʿ"],"translation":["And his light has filled the horizons (by the virtue of the Messenger of Allāh)","It has encompassed the entire universe"],"isRefrain":false},{"arabic":["نُكِسَتْ أَصْنَامُ شِرْكٍ","وَ بِنَا الشِّرْكِ تَصَدَّعْ"],"transliteration":["nukisat aṣnāmu shirkin","wa binash shirki taṣaddaʿ"],"translation":["Torn down are the icons of idolatry","The edifice of idolatry has crumbled"],"isRefrain":false},{"arabic":["وَ دَنَا وَقْتُ الهِدَايَةْ","وَ حِمَى الكُفْرِ تَزَعْزَعْ"],"transliteration":["wa danā waqtul hidāyah","wa ḥimal kufri tazaʿzaʿ"],"translation":["The time of guidance has drawn near (by the virtue of the Messenger of Allāh)","And the fortress of disbelief has been shaken"],"isRefrain":false},{"arabic":["مَرْحَباً أَهْلاً وَ سَهْلاً","بِكَ يَا ذَا القَدْرِ الأَرْفَعْ"],"transliteration":["marḥaban ahlan wa sahlan","bika yā dhal qadril arfaʿ"],"translation":["Greetings and welcome","To you, O possessor of the lofty rank"],"isRefrain":false},{"arabic":["يَا إِمَامَ أَهْلِ الرِّسَالَةْ","مَنْ بِهِ الآفَاتُ تُدْفَعْ"],"transliteration":["yā imāma ahlir risālah","man bihil āfātu tudfaʿ"],"translation":["O Master of the people of revelation (O Messenger of Allāh)","By whom evil is repelled"],"isRefrain":false},{"arabic":["أَنْتَ فِي الحَشْرِ مَلَاذٌ","لَكَ كُلُّ الخَلْقِ تَفْزَعْ"],"transliteration":["anta fīl ḥashri malādhun","laka kullul khalqi tafzaʿ"],"translation":["You will be a refuge on the Day of Gathering","All of creation will flee to you"],"isRefrain":false},{"arabic":["ويُنَادُونَ تَرَى مَا","قَدْ دَهَا مِنْ هَوْلٍ أَفْظَعْ"],"transliteration":["wyunādūna tarā mā","qad dahā min hawlin afẓaʿ"],"translation":["And they will cry out, saying, 'Look (O Messenger of Allāh)","What dreadful terrors have afflicted us!'"],"isRefrain":false},{"arabic":["مَرْحَبًا مَرْحَبًا يا نُورَ عَينِي","مَرْحَبًا مَرْحَبًا جَدَّ الحُسَيْنِي"],"transliteration":["marḥaban marḥaban īā nūra ʿaīnī","marḥaban marḥaban jaddal ḥusaynī"],"translation":["Welcome, a warm and joyful welcome to the Messenger! (Welcome, O welcome!)","Welcome to nearness unto him and to his arrival ﷺ (Welcome, O welcome!)"],"isRefrain":false},{"arabic":["فَلَهَا أَنْتَ فَتَسْجُد (مَرْحَبًا)","وَتُنَادَى اشْفَعْ تُشَفَّعْ (مَرْحَبًا)"],"transliteration":["falahā anta fatasjud marḥaban","watunādāsh faʿ tushaffaʿ marḥaban"],"translation":["And for (the intercession) you will prostrate (Welcome!)","And be addressed, 'Intercede, for your intercession is accepted', (Welcome!)"],"isRefrain":false},{"arabic":["فَعَلَيْكَ اللهُ صَلَّى (مَرْحَبًا)","مَا بَدَا النُّورُ وَ شَعْشَعْ (مَرْحَبًا)"],"transliteration":["faʿalayka Allahu ṣallā marḥaban","mā badan nūru wa shaʿshaʿ marḥaban"],"translation":["For Allāh has sent mercy upon you (Welcome!)","As long as the light shines and radiates (Welcome!)"],"isRefrain":false},{"arabic":["وَ بِكَ الرَّحْمَنَ نَسْأَلْ (يا الله)","وَ إِلَهُ العَرْشِ يَسْمَعْ (يا الله)"],"transliteration":["wa bikar raḥmana nasal īa Allah","wa ilahul ʿarshi yasmaʿ īa Allah"],"translation":["By you, we ask the Most Merciful (O Allāh)","and the Lord of the Throne hears (O Allāh)"],"isRefrain":false},{"arabic":["يَا عَظِيمَ المَنِّ يَا رَبّ \"يَا الله\"","شَمْلَنَا بِالمُصْطَفَى اجْمَعْ \"يَا الله\""],"transliteration":["yā ʿaẓīmal manni yā rabb ya Allah","shamlanā bil muṣṭafāj maʿ ya Allah"],"translation":["O Bestower of Great Bounties, O Lord! (O Allāh)","Gather us all with the Chosen One (O Allāh)"],"isRefrain":false},{"arabic":["وَ بِهِ فَانْظُرْ إِلَيْنَا \"يَا الله\"","وَ اعْطِنَا بِهْ كُلَّ مَطْمَعْ \"يَا الله\""],"transliteration":["wa bihi fan ẓur ilaynā ya Allah","waʿ ṭinā bih kulla maṭmaʿ ya Allah"],"translation":["And by him, gaze upon us (O Allāh)","And by him, grant us all we long for (O Allāh)"],"isRefrain":false},{"arabic":["وَ اكْفِنَا كُلَّ البَلَايَا \"يَا الله\"","وَ ادْفَعِ الآفَاتِ وَ ارْفَع \"يَا الله\""],"transliteration":["wak finā kullal balāyā ya Allah","wad faʿil āfāti war faʿ ya Allah"],"translation":["Protect us from all calamities (O Allāh)","Divert and lift all afflictions (O Allāh)"],"isRefrain":false},{"arabic":["وَ اسْقِنَا يَا رَبّ أَغِثْنَا","بِحَياً هَطَّالِ يَهْمَعْ"],"transliteration":["was qinā yā rabb aghithnā","biḥaīan haṭṭāli yahmaʿ"],"translation":["Give us to drink, O Lord! And come to our aid","With a life-giving rain pouring down"],"isRefrain":false},{"arabic":["وَ اخْتِمِ العُمْرَ بِحُسْنَى","وَ احْسِنِ العُقْبَى وَ مَرْجَعْ"],"transliteration":["wakh timil ʿumra biḥusnā","waḥ sinil ʿuqbā wa marjaʿ"],"translation":["Seal our lives with excellence","Make beautiful our final end and our return"],"isRefrain":false},{"arabic":["وَ صَلاةُ اللهِ تَغْشَى","مَن لَهُ الحُسْنُ تَجَمَّعْ"],"transliteration":["wa ṣalātu Allahi taghshā","man lahul ḥusnu tajammaʿ"],"translation":["And may the mercy of Allāh envelop","The one in whom all beauty has gathered"],"isRefrain":false},{"arabic":["أَحْمَدَ الطُّهْرَ وَ آلِهْ","وَ الصَّحَابَةْ مَا السَّنَا شَعْ"],"transliteration":["aḥmadaṭ ṭuhra wa ālih","waṣ ṣaḥābah mas sanā shaʿ"],"translation":["Aḥmad the Pure, and his Family","And the Companions, as long as light shines"],"isRefrain":false}]},{"title":"Diya'ul Lami: Supplication","englishTitle":"Supplication","couplets":[{"arabic":["وَ لَقَدْ أَشَرْتُ لِنَعْتِ مَنْ أَوْصَافُهُ","تُحْيِي القُلُوبَ تُهَيِّجُ الأَشْجَانَا"],"transliteration":["wa laqad ashartu linaʿti man awṣāfuhu","tuḥyīl qulūba tuhayyijul ashjānā"],"translation":["Indeed I have drawn attention to the attributes of the one","Whose qualities revive the heart, and ignite the fires of yearning"],"isRefrain":false},{"arabic":["وَ اللهُ قَدْ أَثْنَى عَلَيْهِ فَمَا يُسَاوِي","القَوْلُ مِنَّا أَو يَكُونُ ثَنَانَا"],"transliteration":["wa Allahu qad athnā ʿalayhi famā yusāwī","alqawlu minnā aw yakūnu thanāna"],"translation":["Allāh Himself has praised him, so how can our words compare","Or even be considered praise?"],"isRefrain":false},{"arabic":["لَكِنَّ حُبّاً فِي السَّرَائِرِ قَدْ دَعَا","لِمَدِيحِ صَفْوَةِ رَبِّنَا وَ حَدَانَا"],"transliteration":["lakinna ḥubban fīs sarā’iri qad daʿā","limadīḥi ṣafwati rabbinā wa ḥadānā"],"translation":["However it is a love established deep in the heart, which called to us and urged us","To praise the purest of our Lord's (creation)"],"isRefrain":false},{"arabic":["وَ إِذِ امْتَزَجْنَا بِالمَوَدَّةِ هٰهُنَا","نَرْفَعُ أَيْدِي فَقْرِنَا وَ رَجَانَا"],"transliteration":["wa idhim tazajnā bil mawaddati hāhunā","narfaʿu aydī faqrinā wa rajānā"],"translation":["And now that we have become infused with the love [of Muhammad] here,","we raise the hands of our poverty and hope"],"isRefrain":false},{"arabic":["لِلوَاحِدِ الأَحَدِ العَلِيِّ إِلَهِنَا","مُتَوَسِّلِينَ بِمَنْ إِلَيْهِ دَعَانَا"],"transliteration":["lilwāḥidil aḥadil ʿaliyyi ilahinā","mutawassilīna biman ilayhi daʿānā"],"translation":["To our Lord, the One, the Unique, the Most High,","Interceding by the one who called us to Him"],"isRefrain":false},{"arabic":["مُخْتَارِهِ وَ حَبِيبِهِ وَ صَفِيِّهِ","زَيْنِ الوُجُودِ بِهِ الإِلَهُ حَبَانَا"],"transliteration":["mukhtārihi wa ḥabībihi wa ṣafiyyihi","zaynil wujūdi bihil ilahu ḥabānā"],"translation":["His Chosen one, His Beloved, His Purest,","The beauty of existence, by him the Lord has favored us"],"isRefrain":false},{"arabic":["يَا رَبَّنَا يَا رَبَّنَا يَا رَبَّنَا","بِالمُصْطَفَى اقْبَلْنَا أَجِبْ دَعْوَانَا"],"transliteration":["yā rabbanā yā rabbanā yā rabbanā","bil muṣṭafāq balnā ajib daʿwānā"],"translation":["Our Lord! Our Lord! Our Lord!","By the Chosen one, accept us and answer our supplications"],"isRefrain":false},{"arabic":["أَنْتَ لَنَا أَنْتَ لَنَا يَا ذُخْرَنَا","فِي هَذِهِ الدُّنيَا وَ فِي أُخْرَانَا"],"transliteration":["anta lanā anta lanā yā dhukhranā","fī hadhihid dunyā wa fī ukhrānā"],"translation":["You are sufficient for us! You are sufficient for us!","You are our security in this world and in the hereafter"],"isRefrain":false},{"arabic":["أَصْلِحْ لَنَا الأَحْوَالَ وَ اغْفِرْ ذَنْبَنَا","وَ لَا تُؤَاخِذْ رَبِّي إِنْ أَخْطَانَا"],"transliteration":["aṣliḥ lanal aḥwāla wagh fir dhanbanā","wa lā tuākhidh rabbī in akhṭānā"],"translation":["Rectify our states for us and forgive us our sins","And do not hold us accountable, O Lord, if we err"],"isRefrain":false},{"arabic":["وَ اسْلُكْ بِنَا فِي نَهْجِ طَهَ المُصطَفَى","ثَبِّتْ عَلَى قَدَمِ الحَبِيبِ خُطَانَا"],"transliteration":["was luk binā fī nahji ṭahal muṣṭafā","thabbit ʿalā qadamil ḥabībi khuṭānā"],"translation":["Lead us down the path of Ṭaha, the Chosen one,","And make firm our footsteps in the steps of the Beloved"],"isRefrain":false},{"arabic":["أَرِنَا بِفَضْلٍ مِنْكَ طَلْعَةَ أَحْمَدٍ","فِي بَهْجَةٍ عَيْنُ الرِّضَا تَرْعَانَا"],"transliteration":["arinā bifaḍlin minka ṭalʿata aḥmadin","fī bahjatin ʿaynur riḍā tarʿānā"],"translation":["Show us, through Your grace, the manifestation of Aḥmad, in his splendor,","As the eye of Your good pleasure watches over us"],"isRefrain":false},{"arabic":["وَ ارْبُطْ بِهِ فِي كُلِّ حَالٍ حَبْلَنَا","وَ حِبَالَ مَنْ وَدَّ وَ مَنْ وَالَانَا"],"transliteration":["war buṭ bihi fī kulli ḥālin ḥablanā","wa ḥibāla man wadda wa man wālānā"],"translation":["Strengthen our bond with him (Muhammad) in every state","And the bond of those who love and support us"],"isRefrain":false},{"arabic":["وَ المُحْسِنِينَ وَ مَنْ أَجَابَ نِدَاءَنَا","وَ ذَوِي الحُقُوقِ وَ طَالِبَاً أَوْصَانَا"],"transliteration":["wal muḥsinīna wa man ajāba nidā’anā","wa dhawīl ḥuqūqi wa ṭālibāan awṣānā"],"translation":["And those who do good and those answered our call,","Those who have rights [over us] and those who have requested our prayers"],"isRefrain":false},{"arabic":["وَ الحَاضِرِينَ وَ سَاعِيَاً فِي جَمْعِنَا","هَا نَحْنُ بَيْنَ يَدَيْكَ أَنْتَ تَرَانَا"],"transliteration":["wal ḥāḍirīna wa sāʿiyāan fī jamʿinā","hā naḥnu bayna yadayka anta tarānā"],"translation":["Those who are present and those who assist in our gatherings","Here we are, before You (O Allāh), truly You see us"],"isRefrain":false},{"arabic":["وَ لَقَدْ رَجَوْنَاكَ فَحَقِّقْ سُؤْلَنَا","وَ اسْمَعْ بِفَضْلِكَ يَا سَمِيعُ دُعَانَا"],"transliteration":["wa laqad rajawnāka faḥaqqiq su’lanā","was maʿ bifaḍlika yā samīʿu duʿānā"],"translation":["Indeed we have placed our hopes in You, that You might answer our request","Hear us, by Your grace, O Hearer of our prayer"],"isRefrain":false},{"arabic":["وَ انْصُرْ بِنَا سُنَّةَ طَهَ فِي بِقَاعِ","الأَرْضِ وَ اقْمَعْ كُلَّ مَنْ عَادَانَا"],"transliteration":["wan ṣur binā sunnata ṭaha fī biqāʿi","alarḍi waq maʿ kulla man ʿādāna"],"translation":["By means of us, give victory to the sunnah of Taha, throughout the earth,","Throughout the earth, and restrain all those who show enmity to us"],"isRefrain":false},{"arabic":["وَ انْظُرْ إِلَيْنَا وَ اسْقِنَا كَأْسَ الهَنَا","وَ اشْفِ وَ عَافِ عَاجِلاً مَرْضَانَا"],"transliteration":["wan ẓur ilaynā was qinā ka sal hanā","wash fi wa ʿāfi ʿājilan marḍānā"],"translation":["Gaze upon us, give us to drink from a cup of felicity","Nd swiftly cure and gran good health to our sick ones"],"isRefrain":false},{"arabic":["وَ اقْضِ لَنَا الحَاجَاتِ وَ احْسِنْ خَتْمَنَا","عِنْدَ المَمَاتِ وَ أَصْلِحَنْ عُقْبَانَا"],"transliteration":["waq ḍi lanal ḥājāti waḥ sin khatmanā","ʿindal mamāti wa aṣliḥan ʿuqbānā"],"translation":["Take care of our affairs and beautify our last moments","At the time of death, and make good our final end"],"isRefrain":false},{"arabic":["يَا رَبِّ وَ اجْمَعْنَا وَ أَحْبَاباً لَنَا","فِي دَارِكَ الفِرْدَوْسِ يَا رَجْوَانَا"],"transliteration":["yā rabbi waj maʿnā wa aḥbāban lanā","fī dārikal firdawsi yā rajwānā"],"translation":["O Lord, gather us and those beloved to us","In Your abode of Firdaus, O our [only] Hope,"],"isRefrain":false},{"arabic":["بِالمُصْطَفَى صَلِّ عَلَيْهِ وَ آلِهِ","مَا حَرَّكَتْ رِيحُ الصَّبَا أَغْصَانَا"],"transliteration":["bil muṣṭafā ṣalli ʿalayhi wa ālihi","mā ḥarrakat rīḥuṣ ṣabā aghṣānā"],"translation":["Through the Chosen One, and send Your mercy upon him and his Family","So long as the easterly breezes sway the branches"],"isRefrain":false}]},{"title":"صلاة ربّي مدّ الزّمانِ","englishTitle":"Prayer of the Lord Extended Through Time","couplets":[{"arabic":["صلاة ربّي مدّ الزّمانِ","على النّبيّ طاهرِ الجنانِ"],"transliteration":["Ṣalātu rabbī madda z-zamānī","ʿala n-nabiyyi ṭāhiri l-janānī"],"translation":["May my Lord's blessing, for all the length of time,","be upon the Prophet, pure of heart"],"isRefrain":false},{"arabic":["مَا لاحَ برقٌ وسحَّ رعدٌ","ودامَ ذكرُكَ باللّسانِ"],"transliteration":["Mā lāḥa barqun wa saḥḥa raʿdun","wa dāma dhikruka bi-l-lisānī"],"translation":["as long as lightning gleams and thunder pours,","and as long as your remembrance lives on the tongue."],"isRefrain":false},{"arabic":["نسيمُ نجدٍ سرى سُحَيرًا","فجدَّدَ الشوقَ والمَبانِي"],"transliteration":["Nasīmu najdin sarā suḥayrā","fa-jaddada sh-shawqa wa-l-mabānī"],"translation":["The breeze of Najd travelled in the last dark of night","and made longing — and its old dwellings — new again."],"isRefrain":false},{"arabic":["وهبَّ ريحُ الصَّبا بِرَوحٍ","مُخبِرًا عن عُرَيبِ بانِ"],"transliteration":["Wa habba rīḥu ṣ-ṣabā bi-rawḥin","mukhbiran ʿan ʿuraybi bānī"],"translation":["The east wind blew with sweet relief,","bearing news of the dear Arab folk who have gone."],"isRefrain":false},{"arabic":["يا أهلَ نجدٍ حياةَ روحي","رعاكمُ اللهُ بالأمانِ"],"transliteration":["Yā ahla najdin ḥayāta rūḥī","raʿākumu llāhu bi-l-amānī"],"translation":["O people of Najd, O life of my soul,","may God keep you in safety."],"isRefrain":false},{"arabic":["أخذتمُ العقلَ بل فؤادي","جمالُكم سادتي سبانِي"],"transliteration":["Akhadhtumu l-ʿaqla bal fuʾādī","jamālukum sādatī sabānī"],"translation":["You took my reason, my heart as well;","your beauty, my masters, has taken me captive."],"isRefrain":false},{"arabic":["وعاذلي رامَ لي سُلُوًّا","فكيف ذا والهوى رمانِي"],"transliteration":["Wa ʿādhilī rāma lī sulūwan","fa-kayfa dhā wa-l-hawā ramānī"],"translation":["My reproacher wished forgetfulness for me","how could that be, when love has already struck me down?"],"isRefrain":false},{"arabic":["وحبُّكم في الحشا مقيمٌ","وزدتُ شوقًا وصرتُ فانِي"],"transliteration":["Wa ḥubbukum fi l-ḥashā muqīmun","wa zidtu shawqan wa ṣirtu fānī"],"translation":["Your love dwells settled in my depths;","my longing only grew, until I passed away in it."],"isRefrain":false},{"arabic":["وفي رُباكم حبيبُ قلبي","جميلُ ذاتٍ جليلُ شانِي"],"transliteration":["Wa fī rubākum ḥabību qalbī","jamīlu dhātin jalīlu shānī"],"translation":["In your hills is the beloved of my heart,","beautiful in essence, exalted in rank."],"isRefrain":false},{"arabic":["من حازَ حُسنَ الصّفاتِ طُرًّا","وسادَ في سائرِ المعانِي"],"transliteration":["Man ḥāza ḥusna ṣ-ṣifāti ṭurran","wa sāda fī sāʾiri l-maʿānī"],"translation":["He who gathered every excellent quality without exception,","and surpassed all others in every respect."],"isRefrain":false},{"arabic":["وفاقَ ظبيًا كحيلَ عينٍ","وخصَّهُ اللهُ بالمَثانِي"],"transliteration":["Wa fāqa ẓabyan kaḥīla ʿaynin","wa khaṣṣahu llāhu bi-l-mathānī"],"translation":["He outshone the kohl-eyed gazelle,","and God singled him out with al-Mathānī (the oft-repeated verses)."],"isRefrain":false},{"arabic":["وعمَّ كلَّ الأنامِ جودًا","ونالَ ما لم ينلْهُ ثانِي"],"transliteration":["Wa ʿamma kulla l-anāmi jūdan","wa nāla mā lam yanalhu thānī"],"translation":["His generosity encompassed all mankind,","and he attained what no second soul has attained."],"isRefrain":false},{"arabic":["أثنى عليه الإلهُ مدحًا","فما ثنائي وما بيانِي"],"transliteration":["Athnā ʿalayhi l-ilāhu madḥan","fa-mā thanāʾī wa mā bayānī"],"translation":["God Himself has praised him,","so what is my praise worth, what is my eloquence?"],"isRefrain":false},{"arabic":["وذكرُهُ في الكتابِ يُتلى","فأعجزَ العَدَّ بالبَنانِ"],"transliteration":["Wa dhikruhu fi l-kitābi yutlā","fa-aʿjaza l-ʿadda bi-l-banānī"],"translation":["His mention is recited in the Book,","past all counting on the fingers."],"isRefrain":false},{"arabic":["طوبى لمن قد رآكَ حقًّا","ليتي رأيتُكَ في المنامِ"],"transliteration":["Ṭūbā li-man qad raʾāka ḥaqqan","laytī raʾaytuka fi l-manāmī"],"translation":["Blessed is the one who has truly seen you,","would that I might see you in a dream."],"isRefrain":false},{"arabic":["وفي مديحِكَ لستُ أهلًا","لكن صبانِي ذوو الغرامِ"],"transliteration":["Wa fī madīḥika lastu ahlan","lākin ṣabānī dhawu l-gharāmī"],"translation":["I am no fit man to praise you,","yet the passionate lovers have drawn me to it."],"isRefrain":false},{"arabic":["وعندما سفرٌ طويلٌ","أرجوكَ يا منتهى المرامِ"],"transliteration":["Wa ʿindamā safarun ṭawīlun","arjūka yā muntaha l-marāmī"],"translation":["And when the long journey comes,","it is you I hope in, O utmost goal of every desire."],"isRefrain":false}]},{"title":"مُحَمَّدٌ بَشَرٌ لَا كَالبَشَرْ","englishTitle":"Muhammad: A Man, But Not Like Other Men","couplets":[{"arabic":["مُحَمَّدٌ بَشَرٌ لَا كَالبَشَرْ","بَلْ هُوَ يَاقُوتٌ بَيْنَ الحَجَرْ"],"transliteration":["Muḥammadun basharun lā ka-l-bashar","bal huwa yāqūtun bayna l-ḥajar"],"translation":["Muhammad is a man, but not like other men,","rather he is a ruby among ordinary stones."],"isRefrain":false},{"arabic":["مُحَمَّدٌ مِفْتَاحُهُ بِسْمِ اللهِ","وَيَحْمَدُ اللهَ مَعَ الخَبَرْ"],"transliteration":["Muḥammadun miftāḥuhu bismi llāhi","wa yaḥmadu llāha maʿa l-khabar"],"translation":["Muhammad — his opening key is Bismillāh,","and he praises God along with the tidings he brings."],"isRefrain":false},{"arabic":["مُحَمَّدٌ رَسُولٌ لِرَبِّ العُلَى","لِكَافَّةِ الخَلْقِ بِلَا نُكُرْ"],"transliteration":["Muḥammadun rasūlun li-rabbi l-ʿulā","li-kāffati l-khalqi bi-lā nukur"],"translation":["Muhammad is the Messenger of the Lord of the heights,","sent to all creation without exception."],"isRefrain":false},{"arabic":["مُحَمَّدٌ بَعْثُهُ عَامَّةً","عَلَى العَالَمِينَ حَتَّى الشَّجَرْ"],"transliteration":["Muḥammadun baʿthuhu ʿāmmatan","ʿala l-ʿālamīna ḥatta sh-shajar"],"translation":["Muhammad's mission is universal,","over all the worlds — even the trees."],"isRefrain":false},{"arabic":["مُحَمَّدٌ مَوْلِدُهُ مَكَّةُ","وَهِجْرَتُهُ طَيْبَةُ الغُرَرْ"],"transliteration":["Muḥammadun mawliduhu makkatu","wa hijratuhu ṭaybatu l-ghurar"],"translation":["Muhammad — his birthplace is Makkah,","and his emigration was to radiant Ṭaybah."],"isRefrain":false},{"arabic":["مُحَمَّدٌ أَسْرَى مِنْ حَرَمٍ","إِلَى الأَيْلِيَاءِ مَأْوَى الحَرَرْ"],"transliteration":["Muḥammadun asrā min ḥaramin","ila l-ayliyāʾi maʾwa l-ḥarar"],"translation":["Muhammad journeyed by night from the Sanctuary","to Īliyāʾ, refuge of the noble and free."],"isRefrain":false},{"arabic":["مُحَمَّدٌ مِعْرَاجُهُ ثَابِتٌ","بِنَصِّ الحَدِيثِ مَعَ العِبَرْ"],"transliteration":["Muḥammadun miʿrājuhu thābitun","bi-naṣṣi l-ḥadīthi maʿa l-ʿibar"],"translation":["Muhammad's ascension is firmly established","by the text of ḥadīth, along with its lessons."],"isRefrain":false},{"arabic":["مُحَمَّدٌ فَاقَ جَمِيعَ الوَرَى","حَتَّى المُرْسَلِينَ ذَوِي الفَخَرْ"],"transliteration":["Muḥammadun fāqa jamīʿa l-warā","ḥatta l-mursalīna dhawi l-fakhar"],"translation":["Muhammad surpassed all creation,","even the messengers, possessors of glory."],"isRefrain":false},{"arabic":["مُحَمَّدٌ مِنْ آدَمَ دُونَهُ","وَمَنْ بَعْدَهُ فَاعْجَبْ لِلْخَبَرْ"],"transliteration":["Muḥammadun min ādama dūnahu","wa man baʿdahu fa-ʿjab li-l-khabar"],"translation":["Muhammad — from Adam onward, all are beneath him,","and all who came after: marvel at this report."],"isRefrain":false},{"arabic":["مُحَمَّدٌ أُمَّتُهُ خِيَرَةٌ","لِكُلِّ القُرُونِ مَعَ الزُّمَرْ"],"transliteration":["Muḥammadun ummatuhu khiyaratun","li-kulli l-qurūni maʿa z-zumar"],"translation":["Muhammad — his community is the chosen best","of all ages and all throngs."],"isRefrain":false},{"arabic":["فَمِنْهُمْ شُمُوسٌ كَأَصْحَابِهِ","وَكَالغَوْثِ الجِيلِيِّ عَبْدِ القَادِرْ"],"transliteration":["Fa-minhum shumūsun ka-aṣḥābihi","wa ka-l-ghawthi l-jīliyyi ʿabdi l-qādir"],"translation":["Among them are suns like his Companions,","and like the Ghawth al-Jīlī, ʿAbd al-Qādir."],"isRefrain":false},{"arabic":["مُحَمَّدٌ عِصْمَتُهُ مُحَتَّمٌ","صَغِيرًا كَبِيرًا بِلَا نُكُرْ"],"transliteration":["Muḥammadun ʿiṣmatuhu muḥattamun","ṣaghīran kabīran bi-lā nukur"],"translation":["Muhammad's protection from sin is certain,","in youth and in age, beyond all denial."],"isRefrain":false},{"arabic":["مُحَمَّدٌ مَحَبَّتُهُ وَاجِبٌ","مِنَ المُؤْمِنِينَ عَلَى البَشَرْ"],"transliteration":["Muḥammadun maḥabbatuhu wājibun","mina l-muʾminīna ʿala l-bashar"],"translation":["Muhammad — love of him is an obligation binding","on the believers among mankind."],"isRefrain":false},{"arabic":["مُحَمَّدٌ بَاغِضُهُ كَافِرٌ","يُعَذَّبُ دَوْمًا عَلَى الجَمَرْ"],"transliteration":["Muḥammadun bāghiḍuhu kāfirun","yuʿadhdhabu dawman ʿala l-jamar"],"translation":["Muhammad — whoever hates him is a disbeliever,","punished forever upon the embers."],"isRefrain":false},{"arabic":["مُحَمَّدٌ قَاسِمٌ خَيْرُ المَلَا","وَمُعْطِي الحَقِيقَةِ ذُو الكِبَرْ"],"transliteration":["Muḥammadun qāsimun khayru l-malā","wa muʿṭi l-ḥaqīqati dhu l-kibar"],"translation":["Muhammad is the distributor, the best of the assembly,","while the true Giver is the One of Greatness."],"isRefrain":false},{"arabic":["مُحَمَّدٌ وَاصِفُهُ رَبُّهُ","فَمَا لِضَعِيفٍ مِنَ الغُمَرْ"],"transliteration":["Muḥammadun wāṣifuhu rabbuhu","fa-mā li-ḍaʿīfin mina l-ghumar"],"translation":["Muhammad — his describer is his own Lord;","so what has a weak nobody of the common crowd to add?"],"isRefrain":false},{"arabic":["مِقْدَارُ مَا مِثْلُ ذَرٍّ","صِفَةُ عَرْشِ رَبِّي أَعْلَى الكِبَرْ"],"transliteration":["Miqdāru mā mithlu dharrin","ṣifatu ʿarshi rabbī aʿla l-kibar"],"translation":["Whatever measure I could give is like a mote","beside the description of my Lord's Throne, highest in greatness."],"isRefrain":false},{"arabic":["مُحَمَّدٌ رَأَى رَبَّهُ جَهْرَةً","بِيَقْظَةٍ مَعَ جِسْمِهِ الأَنْوَرْ"],"transliteration":["Muḥammadun raʾā rabbahu jahratan","bi-yaqẓatin maʿa jismihi l-anwar"],"translation":["Muhammad saw his Lord openly,","while awake, together with his luminous body."],"isRefrain":false},{"arabic":["مُحَمَّدٌ يَجْزِي إِلَهُ الوَرَى","لِعَبْدٍ صَلَّى مَرَّةً عَشَرْ"],"transliteration":["Muḥammadun yajzī ilāhu l-warā","li-ʿabdin ṣallā marratan ʿashar"],"translation":["Muhammad — the God of creation rewards the servant","who sends blessings once with tenfold."],"isRefrain":false},{"arabic":["كَعَبْدٍ صَلَّى عَشَرَةً مِائَةً","إِلَى أَلْفِ أَلْفٍ مَعَ الحُرَرْ"],"transliteration":["Ka-ʿabdin ṣallā ʿasharatan miʾatan","ilā alfi alfin maʿa l-ḥurar"],"translation":["And the servant who sends ten receives a hundred,","on up to a thousand thousand, together with noble gifts."],"isRefrain":false},{"arabic":["وَمَنْ حَبَّهُ نَالَ مَا رَامَهُ","وَبُحْبُوحَ فِرْدَوْسٍ كَالدُّرَرْ"],"transliteration":["Wa man ḥabbahu nāla mā rāmahu","wa buḥbūḥa firdawsin ka-d-durar"],"translation":["Whoever loves him attains what he sought,","and the very heart of Firdaws, gleaming like pearls."],"isRefrain":false},{"arabic":["اللَّهُمَّ صَلِّ عَلَى الهَاشِمِيِّ","بِأَلْفِ أُلُوفٍ بِلَا حَصَرْ"],"transliteration":["Allāhumma ṣalli ʿala l-hāshimiyy","bi-alfi ulūfin bi-lā ḥaṣar"],"translation":["O God, bless the Hāshimī,","by a thousand thousands, beyond all counting."],"isRefrain":false},{"arabic":["اللَّهُمَّ صَلِّ عَلَى المُصْطَفَى","بِعَدِّ النُّجُومِ مَعَ الشَّجَرْ"],"transliteration":["Allāhumma ṣalli ʿala l-muṣṭafā","bi-ʿaddi n-nujūmi maʿa sh-shajar"],"translation":["O God, bless the Chosen One,","by the number of the stars and the trees."],"isRefrain":false},{"arabic":["اللَّهُمَّ صَلِّ عَلَى الكَامِلِ","بِعَدِّ النِّسَاءِ مَعَ الذَّكَرْ"],"transliteration":["Allāhumma ṣalli ʿala l-kāmil","bi-ʿaddi n-nisāʾi maʿa dh-dhakar"],"translation":["O God, bless the Perfect One,","by the number of all women and men."],"isRefrain":false},{"arabic":["اللَّهُمَّ صَلِّ عَلَى الأَنْوَرِ","بِعَدِّ رِضَاكَ مَعَ القَدَرْ"],"transliteration":["Allāhumma ṣalli ʿala l-anwar","bi-ʿaddi riḍāka maʿa l-qadar"],"translation":["O God, bless the Most Radiant,","by the measure of Your good pleasure and Your decree."],"isRefrain":false},{"arabic":["اللَّهُمَّ صَلِّ عَلَى الأَمْجَدِ","بِعَدِّ الحَصَاةِ مَعَ المَدَرْ"],"transliteration":["Allāhumma ṣalli ʿala l-amjad","bi-ʿaddi l-ḥaṣāti maʿa l-madar"],"translation":["O God, bless the Most Glorious,","by the number of the pebbles and the clods of earth."],"isRefrain":false},{"arabic":["اللَّهُمَّ صَلِّ عَلَى العَاقِبِ","بِعَدِّ مَعْلُومَاتِكَ الغُرَرْ"],"transliteration":["Allāhumma ṣalli ʿala l-ʿāqib","bi-ʿaddi maʿlūmātika l-ghurar"],"translation":["O God, bless the Last-Coming One,","by the number of all the shining things You know."],"isRefrain":false},{"arabic":["اللَّهُمَّ صَلِّ عَلَى الحَاشِرِ","بِأَنْفَاسِ خَلْقِكَ مَعَ نَظَرْ"],"transliteration":["Allāhumma ṣalli ʿala l-ḥāshir","bi-anfāsi khalqika maʿa naẓar"],"translation":["O God, bless the Gatherer,","by the breaths of Your creation and every glance of their eyes."],"isRefrain":false},{"arabic":["اللَّهُمَّ صَلِّ عَلَى الشَّافِعِ","بِعَدِّ العُصَاةِ مَعَ البَرَرْ"],"transliteration":["Allāhumma ṣalli ʿala sh-shāfiʿ","bi-ʿaddi l-ʿuṣāti maʿa l-barar"],"translation":["O God, bless the Intercessor,","by the number of the sinful and the righteous alike."],"isRefrain":false},{"arabic":["اللَّهُمَّ صَلِّ عَلَى الخَاتِمِ","بِعَدِّ مَلَائِكَةٍ الغُرَرْ"],"transliteration":["Allāhumma ṣalli ʿala l-khātim","bi-ʿaddi malāʾikatin l-ghurar"],"translation":["O God, bless the Seal,","by the number of the resplendent angels."],"isRefrain":false},{"arabic":["وَسَلِّمْ بِأَضْعَافِ مَا قَدْ مَضَى","مَتَى حُبُّهُ ضَاءَ كَالقَمَرْ"],"transliteration":["Wa sallim bi-aḍʿāfi mā qad maḍā","matā ḥubbuhu ḍāʾa ka-l-qamar"],"translation":["And grant peace many times over all that has passed,","so long as love of him shines like the moon."],"isRefrain":false},{"arabic":["وَآلٍ وَصَحْبٍ وَأَتْبَاعِهِ","إِلَى يَوْمِ يُحْشَرُ لِلْبَشَرْ"],"transliteration":["Wa ālin wa ṣaḥbin wa atbāʿihi","ilā yawmi yuḥsharu li-l-bashar"],"translation":["And upon his family, his companions, and his followers,","until the Day when mankind is gathered."],"isRefrain":false},{"arabic":["وَارْضَ عَنْ أَبِي بَكْرٍ مَعَ عُمَرْ","وَعُثْمَانَ مَعَ عَلِيٍّ المُضَرْ"],"transliteration":["Wa-rḍa ʿan abī bakrin maʿa ʿumar","wa ʿuthmāna maʿa ʿaliyyin il-muḍar"],"translation":["And be pleased with Abū Bakr and ʿUmar,","and ʿUthmān and ʿAlī of Muḍar."],"isRefrain":false},{"arabic":["وَارْحَمْ يَا إِلَهِي لِنَاظِمِهَا","كَذَا المُنْشِدِينَ مَعَ الحُضَرْ"],"transliteration":["Wa-rḥam yā ilāhī li-nāẓimihā","kadha l-munshidīna maʿa l-ḥuḍar"],"translation":["And have mercy, O my God, on the one who composed it,","likewise on those who chant it and those present."],"isRefrain":false}]},{"title":"صَلِّ يَا رَبِّ عَلَى عَالِي ذُرَى","englishTitle":"Bless, O Lord, the One at the Summit of Heights","couplets":[{"arabic":["صَلِّ يَا رَبِّ عَلَى عَالِي ذُرَى","سُودَدِ أَفْضَلِ مَنْ دَاسَ الثَّرَى"],"transliteration":["Ṣalli yā rabbi ʿalā ʿālī dhurā","sūdadi afḍali man dāsa th-tharā"],"translation":["Bless, O my Lord, the one who stands atop the heights of sovereignty,","the best of all who ever trod the earth."],"isRefrain":false},{"arabic":["يَا حَبِيبَ اللهِ يَا خَيْرَ الوَرَى","يَا رَفِيعَ القَدْرِ أَسْمَى مَنْ سَرَى"],"transliteration":["Yā ḥabība llāhi yā khayra l-warā","yā rafīʿa l-qadri asmā man sarā"],"translation":["O Beloved of God, O best of creation,","O you of lofty worth, highest of all who journeyed by night."],"isRefrain":false},{"arabic":["فِيكَ قَدْ عَزَّ وَضِيعُ القَدْرِ يَا","سَيِّدَ السَّادَاتِ يَا ذُخْرَ الوَرَى"],"transliteration":["Fīka qad ʿazza waḍīʿu l-qadri yā","sayyida s-sādāti yā dhukhra l-warā"],"translation":["Through you the man of lowly standing is made honourable,","O master of masters, O treasure of creation."],"isRefrain":false},{"arabic":["وَاعْتَلَا ذِرْوَةَ مَجْدٍ وَارْتَقَى","مُرْتَقَى مَنْ كَانَ ذَا رُشْدٍ دَرَى"],"transliteration":["Wa-ʿtalā dhirwata majdin wa-rtaqā","murtaqā man kāna dhā rushdin darā"],"translation":["He climbed to the summit of glory and ascended","the ascent of one rightly guided and knowing."],"isRefrain":false},{"arabic":["وَاكْتَسَى فِي ظَاهِرٍ ثَوْبَ العُلَا","مِثْلَ وَالٍ وَأَمِيرٍ أُمِّرَا"],"transliteration":["Wa-ktasā fī ẓāhirin thawba l-ʿulā","mithla wālin wa-amīrin ummirā"],"translation":["Outwardly he was clothed in the garment of eminence,","like a governor, or a prince given command."],"isRefrain":false},{"arabic":["وَارْتَدَى بِالجَاهِ ثُمَّ السُّودَدِ","وَوَقَارٍ مِثْلَ مَا مِنْ عَبْقَرَا"],"transliteration":["Wa-rtadā bi-l-jāhi thumma s-sūdadi","wa waqārin mithla mā min ʿabqarā"],"translation":["He wrapped himself in high standing, then in mastery,","and in a gravity like something out of ʿAbqar."],"isRefrain":false},{"arabic":["كَعَظِيمٍ أَوْ حَبِيبٍ حَبَّهُ","أَهْلُ فَضْلٍ وَاحْتِرَامٍ وَائْتَرَى"],"transliteration":["Ka-ʿaẓīmin aw ḥabībin ḥabbahu","ahlu faḍlin wa-ḥtirāmin wa-ʾtarā"],"translation":["Like some great one, or a beloved whom the people of virtue","and reverence have loved and chosen for themselves."],"isRefrain":false},{"arabic":["وَبِأَصْلٍ ثُمَّ فَرْعٍ مُؤْمِنٍ","وَبِمَنْ أَوْصَى لَنَا وَالفُقَرَا"],"transliteration":["Wa bi-aṣlin thumma farʿin muʾminin","wa bi-man awṣā lanā wa-l-fuqarā"],"translation":["And by a believing root and branch alike,","and by the one who left his counsel to us and to the poor."],"isRefrain":false},{"arabic":["فَعَلَيْكَ اللهُ صَلَّى دَائِمًا","مَا دَجَا لَيْلٌ وَمَا سَارٌ سَرَى"],"transliteration":["Fa-ʿalayka llāhu ṣallā dāʾiman","mā dajā laylun wa mā sārin sarā"],"translation":["So may God bless you perpetually,","as long as night falls dark and as long as any traveller journeys on."],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: Preface","englishTitle":"Mawlid al-Barzanji: Preface","couplets":[{"arabic":["أَبْتَدِئُ الْإِمْلَاءَ بِاسْمِ الذَّاتِ الْعَلِيَّةْ ❁","مُسْتَدِرًّا فَيْضَ الْبَرَكَاتِ عَلَى مَا أَنَالَهُ وَأَوْلَاهْ ❁"],"transliteration":["Abtadi'u l-imlā'a bi-smi dh-dhāti l-ʿaliyyah","mustadirran fayḍa l-barakāti ʿalā mā anālahu wa-awlāh"],"translation":["I begin this composition in the Name of the Most Exalted Essence, seeking the abundant outpouring of blessings through what He has bestowed and graciously conferred. I follow this with praise whose streams are sweet and pleasant to drink, mounting the steeds of beautiful gratitude. And I send prayers and peace upon the Light described by precedence and primacy.",""],"isRefrain":false},{"arabic":["وَأُثَنِّي بِحَمْدٍ مَوَارِدُهُ سَائِغَةٌ هَنِيَّةْ ❁","مُمْتَطِيًا مِنَ الشُّكْرِ الْجَمِيلِ مَطَايَاهْ ❁"],"transliteration":["wa-uthannī bi-ḥamdin mawāriduhu sā'ighatun haniyyah","mumtaṭīyan mina sh-shukri l-jamīli maṭāyāh"],"translation":["",""],"isRefrain":false},{"arabic":["وَأُصَلِّي وَأُسَلِّمُ عَلَى النُّورِ الْمَوْصُوفِ بِالتَّقَدُّمِ وَالْأَوَّلِيَّةْ ❁"],"transliteration":["wa-uṣallī wa-usallimu ʿalā n-nūri l-mawṣūfi bi-t-taqaddumi wa-l-awwaliyyah.",""],"translation":["",""],"isRefrain":false},{"arabic":["الْمُنْتَقِلِ فِي الْغُرَرِ الْكَرِيمَةِ وَالْجِبَاهْ ❁","وَأَسْتَمْنِحُ اللَّهَ تَعَالَى رِضْوَانًا يَخُصُّ الْعِتْرَةَ الطَّاهِرَةَ النَّبَوِيَّةْ ❁"],"transliteration":["Al-muntaqili fī l-ghurari l-karīmati wa-l-jibāh","wa-astamniḥu Llāha taʿālā riḍwānan yakhuṣṣu l-ʿitrata ṭ-ṭāhirata n-nabawiyyah"],"translation":["Who passed through noble countenances and radiant brows. I beseech Allah Most High for a special pleasure bestowed upon the pure Prophetic Household, and extended to all the Companions, the Followers, and those who are devoted to him. I implore Him for guidance to tread the clear and manifest paths, and for protection from straying into the ways and footsteps of error.",""],"isRefrain":false},{"arabic":["وَيَعُمُّ الصَّحَابَةَ وَالْأَتْبَاعَ وَمَنْ وَالَاهْ ❁","وَأَسْتَجْدِيهِ هِدَايَةً لِسُلُوكِ السُّبُلِ الْوَاضِحَةِ الْجَلِيَّةْ ❁"],"transliteration":["wa-yaʿummu ṣ-ṣaḥābata wa-l-atbāʿa wa-man wālāh","wa-astajdīhi hidāyatan li-sulūki s-subuli l-wāḍiḥati l-jaliyyah"],"translation":["",""],"isRefrain":false},{"arabic":["وَحِفْظًا مِنَ الْغَوَايَةِ فِي خِطَطِ الْخَطَأِ وَخُطَاهْ ❁"],"transliteration":["wa-ḥifẓan mina l-ghawāyati fī khiṭaṭi l-khaṭa'i wa-khuṭāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَأَنْشُرُ مِنْ قِصَّةِ الْمَوْلِدِ النَّبَوِيِّ الشَّرِيفِ بُرُودًا حِسَانًا عَبْقَرِيَّةْ ❁","نَاظِمًا مِنَ النَّسَبِ الشَّرِيفِ عِقْدًا تُحَلَّى الْمَسَامِعُ بِحُلَاهْ ❁"],"transliteration":["Wa-anshuru min qiṣṣati l-mawlidi n-nabawiyyi sh-sharīfi burūdan ḥisānan ʿabqariyyah","nāẓiman mina n-nasabi sh-sharīfi ʿiqdan tuḥalla l-masāmiʿu bi-ḥulāh"],"translation":["And I unfold from the account of the noble Prophetic birth splendid and exquisite robes, stringing from the noble lineage a necklace whose ornaments adorn the ears. I seek aid through the might of Allah Most High and His mighty power, for there is no might and no power except through Allah.",""],"isRefrain":false},{"arabic":["وَأَسْتَعِينُ بِحَوْلِ اللَّهِ تَعَالَى وَقُوَّتِهِ الْقَوِيَّةْ ❁","فَإِنَّهُ لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهْ ❁"],"transliteration":["wa-astaʿīnu bi-ḥawli Llāhi taʿālā wa-quwwatihi l-qawiyyah","fa-innahu lā ḥawla wa-lā quwwata illā bi-Llāh."],"translation":["",""],"isRefrain":false},{"arabic":["عَطِّرِ اللَّهُمَّ قَبْرَهُ الْكَرِيمَ بِعَرْفٍ شَذِيٍّ مِنْ صَلَاةٍ وَتَسْلِيمٍ ❁","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَيْهِ ❁"],"transliteration":["ʿAṭṭiri Llāhumma qabrahu l-karīma bi-ʿarfin shadhiyyin min ṣalātin wa-taslīmin. Allāhumma ṣalli wa-sallim wa-bārik ʿalayhi.",""],"translation":["O Allah, perfume his noble grave with a fragrant scent of prayers and peace. O Allah, send prayers, peace, and blessings upon him.",""],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: The Prophet's Lineage ﷺ","englishTitle":"Mawlid al-Barzanji: The Prophet's Lineage ﷺ","couplets":[{"arabic":["وَبَعْدُ فَأَقُولُ: هُوَ سَيِّدُنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ عَبْدِ الْمُطَّلِبِ وَاسْمُهُ شَيْبَةُ الْحَمْدِ حُمِدَتْ خِصَالُهُ السَّنِيَّةْ ❁","ابْنِ هَاشِمٍ وَاسْمُهُ عَمْرٌو ابْنِ عَبْدِ مَنَافٍ وَاسْمُهُ الْمُغِيرَةُ الَّذِي يَنْتَمِي الْإِرْتِقَاءُ لِعُلْيَاهْ ❁"],"transliteration":["Wa-baʿdu fa-aqūlu: huwa sayyidunā Muḥammadu bnu ʿabdi Llāhi-bni ʿabdi l-Muṭṭalibi wa-smuhu Shaybatu l-ḥamdi ḥumidat khiṣāluhu s-saniyyah, Ibni Hāshmin, wa-smuhu ʿAmrun ibni ʿabdi Manāfin wa-smuhu l-Mughīratu lladhī yantami l-irtiqā'u li-ʿulyāh.",""],"translation":["Thereafter, I say: He is our master Muhammad, son of Abd Allah, son of Abd al-Muttalib, whose name was Shaybat al-Hamd and whose noble qualities were praised, son of Hashim, whose name was Amr, son of Abd Manaf, whose name was al-Mughirah, to whose lofty rank all heights aspire.",""],"isRefrain":false},{"arabic":["ابْنِ قُصَيٍّ وَاسْمُهُ مُجَمِّعٌ سُمِّيَ بِقُصَيِّ لِتَقَاصِيهِ فِي بِلَادِ قُضَاعَةَ الْقَصِيَّةْ ❁","إِلَى أَنْ أَعَادَهُ اللَّهُ تَعَالَى إِلَى الْحَرَمِ الْمُحْتَرَمِ فَحَمَى حِمَاهْ ❁"],"transliteration":["Ibni Quṣayyin wa-smuhu Mujammiʿun summiya bi-Quṣayyin li-taqāṣīhi fī bilādi Quḍāʿata l-qaṣiyyah","ilā an aʿādahu Llāhu taʿālā ilā l-ḥarami l-muḥtarami fa-ḥamā ḥimāh"],"translation":["He is the son of Qusayy, whose name was Mujammi, and he was called Qusayy because of his being far away in the distant lands of Quda'ah, until Allah Most High returned him to the Sacred Sanctuary, where he protected its precincts. He is the son of Kilab, whose name was Hakim, son of Murrah, son of Kab, son of Luayy, son of Ghalib, son of Fihr, whose name was Quraysh, to whom the Qurashite clans trace their lineage.",""],"isRefrain":false},{"arabic":["ابْنِ كِلَابٍ وَاسْمُهُ حَكِيمٌ ابْنِ مُرَّةَ بْنِ كَعْبِ بْنِ لُؤَيِّ بْنِ غَالِبِ بْنِ فِهْرٍ وَاسْمُهُ قُرَيْشٌ وَإِلَيْهِ تُنْسَبُ الْبُطُونُ الْقُرَشِيَّةْ ❁"],"transliteration":["ibni Kilābin wa-smuhu Ḥakīmun ibni Murrata-bni Kaʿbi-bni Lu'ayyi-bni Ghālibi-bni Fihrin wa-smuhu Qurayshun wa-ilayhi tunsabu l-buṭūnu l-Qurashiyyah.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَمَا فَوْقَهُ كِنَانِيٌّ كَمَا جَنَحَ إِلَيْهِ الْكَثِيرُ وَارْتَضَاهْ ❁","ابْنِ مَالِكِ بْنِ النَّضْرِ بْنِ كِنَانَةَ بْنِ خُزَيْمَةَ بْنِ مُدْرِكَةَ بْنِ إِلْيَاسَ وَهُوَ أَوَّلُ مَنْ أَهْدَى البُدْنَ إِلَى الْرِّحَابِ الْحَرَمِيَّةْ ❁"],"transliteration":["Wa-mā fawqahu Kināniyyun kamā janaḥa ilayhi l-kathīru wa-rtaḍāh, ibni Māliki-bni n-Naḍri-bni Kinānata-bni Khuzaymata-bni Mudrikata-bni Ilyāsa wa-huwa awwalu man ahda l-budna ilā r-riḥābi l-ḥaramiyyah, wa-sumiʿa fī ṣulbihi n-Nabiyyu ṣalla Llāhu taʿālā ʿalayhi wa-sallama dhakara Llāha taʿālā wa-labbāh, ibni Muḍara-bni Nizāri-bni Maʿaddi-bni ʿAdnāna wa-hādhā silkun naẓamat farā'idahu banānu s-sunnati s-saniyyah.",""],"translation":["Those above him are of Kinanah, according to the view favoured and accepted by many. He is the son of Malik, son of al-Nadr, son of Kinanah, son of Khuzaymah, son of Mudrikah, son of Ilyas, who was the first to offer sacrificial camels in the Sacred Precinct. From his loins, the Prophet ﷺ was heard remembering Allah Most High and answering His call. He is the son of Mudar, son of Nizar, son of Maadd, son of Adnan. This is a strand whose precious pearls were threaded by the fingers of the exalted Sunnah.",""],"isRefrain":false},{"arabic":["وَسُمِعَ فِي صُلْبِهِ النَّبِيُّ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ ذَكَرَ اللَّهَ تَعَالَى وَلَبًّاهْ ❁","ابْنِ مُضَرَ بْنِ نِزَارِ بْنِ مَعَدِّ بْنِ عَدْنَانَ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["وَهَذَا سِلْكٌ نَظَمَتْ فَرَائِدَهُ بَنَانُ السُّنَّةِ السَّنِيَّةْ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["وَرَفْعُهُ إِلَى الْخَلِيلِ إِبْرَاهِيمَ عَلَيْهِ السَّلَامُ أَمْسَكَ عَنْهُ الشَّارِعَ وَأَبَاهْ ❁","وَعَدْنَانُ بِلَا رَيْبٍ عِنْدَ ذَوِي الْعُلُومِ النَّسَبِيَّةْ ❁"],"transliteration":["Wa-rafʿuhu ilā l-khalīli Ibrāhīma ʿalayhi s-salāmu amsaka ʿanhu sh-shāriʿu wa-abāh, wa-ʿAdnānu bilā raybin ʿinda dhawī l-ʿulūmi n-nasabiyyah, ilā dh-dhabīḥi Ismāʿīla nisbatuhu wa-muntamāhu wa-muntahāh fa-aʿẓim bihi min ʿiqdin ta'allaqat kawākibuhu d-durriyyah, wa-kayfa lā wa-s-sayyidu l-akramu ṣalla Llāhu taʿālā ʿalayhi wa-sallama wāsiṭatuhu l-muntaqāh.",""],"translation":["As for tracing the lineage back to the Friend of Allah, Ibrahim, peace be upon him, the Lawgiver refrained from doing so and declined it. Yet there is no doubt among the scholars of genealogy that Adnan's lineage, ancestry, and ultimate descent reach back to the Sacrificed One, Ismail. How magnificent is this necklace, whose radiant stars shine brilliantly. And how could it be otherwise, when the Most Noble Master ﷺ is its chosen central jewel?",""],"isRefrain":false},{"arabic":["إِلَى الذَّبِيحِ إِسْمَاعِيلَ نِسْبَتُهُ وَمُنْتَمَاهُ ومُنْتَهَاهْ ❁","فَأَعْظِمْ بِهِ مِنْ عِقْدٍ تَأَلَّقَتْ كَوَاكِبُهُ الدُّرِّيَّةْ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["وَكَيْفَ لَا وَالسَّيِّدُ الْأَكْرَمُ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ وَاسِطَتُهُ الْمُنْتَقَاةْ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["نَسَبٌ تَحْسَبُ الْعُلَا بِحُلَاهُ ❁","قَلَّدَتْهَا نُجُومَهَا الْجَوْزَاءُ ❁"],"transliteration":["Nasabun taḥsabu l-ʿulā bi-ḥulāhu","qalladat-hā nujūmaha l-jawzā'u"],"translation":["A lineage by whose ornaments you would think the heights of glory had adorned themselves with the stars of Gemini. How splendid is this necklace of nobility and honour, in which you are the peerless and flawless pearl. How noble is this lineage, which Allah Most High purified from the unlawful unions of the Age of Ignorance. Zayn al-Iraqi cited and narrated this account in his delightful work.",""],"isRefrain":false},{"arabic":["حَبَّذَا عِقْدُ سُؤْدَدٍ وَفَخَارٍ ❁","أَنْتَ فِيهِ الْيَتِيمَةُ الْعَصْمَاءُ ❁"],"transliteration":["ḥabbadhā ʿiqdu su'dadin wa-fakhārin","anta fīhi l-yatīmatu l-ʿaṣmā'u"],"translation":["",""],"isRefrain":false},{"arabic":["أَكْرِمْ بِهِ مِنْ نَسَبٍ طَهَّرَهُ اللَّهُ تَعَالَى مِنْ سِفَاحِ الْجَاهِلِيَّةْ ❁","أَوْرَدَ الزَّيْنُ الْعِرَاقِيُّ وَارِدَهُ فِي مَوْرِدِهِ الْهَنِيِّ وَرَوَاهْ ❁"],"transliteration":["akrim bihi min nasabin ṭahharahu Llāhu taʿālā min sifāḥi l-jāhiliyyah","awrada z-zaynu l-ʿirāqiyyu wāridahu fī mawridihi l-haniyyi wa-rawāh."],"translation":["",""],"isRefrain":false},{"arabic":["حَفِظَ الْإِلَـٰهُ كَرَامَةً لِمُحَمَّدٍ ❁","آبَاءَهُ الْأَمْجَادَ صَوْنًا لِاسْمِهِ ❁"],"transliteration":["Ḥafiẓa Llāhu karāmatan li-Muḥammadin","ābā'ahu l-amjāda ṣawnan li-smihi"],"translation":["Allah, in honour of Muhammad, safeguarded his noble forefathers, preserving them for the sake of his name. They abstained from unlawful unions, and no shame from them touched his lineage, from Adam down to his father and mother. They were noble men through whose radiant countenances the light of Prophethood passed, and its full moon shone forth upon the brow of his grandfather Abd al-Muttalib and his son Abd Allah.",""],"isRefrain":false},{"arabic":["تَرَكُوا السِّفَاحَ فَلَمْ يُصِبْهُمْ ❁","عَارُهُ مِنْ آدَمٍ وَإِلَى أَبِيهِ وَأُمِّهِ ❁"],"transliteration":["taraku s-sifāḥa fa-lam yuṣibhum","ʿāruhu min Ādamin wa-ilā abīhi wa-ummihi"],"translation":["",""],"isRefrain":false},{"arabic":["سَرَاةٌ سَرَى نُورُ النُّبُوَّةِ فِي أَسَارِيرِ غُرَرِهِمُ الْبَهِيَّةْ ❁","وَبَدَرَ بَدْرُهُ فِي جَبِينِ جَدِّهِ عَبْدِ الْمُطَّلِبِ وَابْنِهِ عَبْدِ اللَّهْ ❁"],"transliteration":["sarātun sarā nūru n-Nubuwwati fī asārīri ghurarihimu l-bahiyyah","wa-badara badruhu fī jabīni jaddihi ʿabdi l-Muṭṭalibi wa-bnihi ʿabdi Llāh."],"translation":["",""],"isRefrain":false},{"arabic":["عَطِّرِ اللَّهُمَّ قَبْرَهُ الْكَرِيمَ بِعَرْفٍ شَذِيٍّ مِنْ صَلَاةٍ وَتَسْلِيمٍ ❁","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَيْهِ ❁"],"transliteration":["ʿAṭṭiri Llāhumma qabrahu l-karīma bi-ʿarfin shadhiyyin min ṣalātin wa-taslīmin. Allāhumma ṣalli wa-sallim wa-bārik ʿalayhi.",""],"translation":["O Allah, perfume his noble grave with a fragrant scent of prayers and peace. O Allah, send prayers, peace, and blessings upon him.",""],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: The Events Leading to the Prophet's Birth ﷺ","englishTitle":"Mawlid al-Barzanji: The Events Leading to the Prophet's Birth ﷺ","couplets":[{"arabic":["وَلَمَّا أَرَادَ اللَّهُ تَعَالَى إِبْرَازَ حَقِيقَتِهِ الْمُحَمَّدِيَّةْ ❁","وَإِظْهَارَهُ جِسْمًا وَرُوحًا بِصُورَتِهِ وَمَعْنَاهْ ❁"],"transliteration":["Wa-lammā arāda Llāhu taʿālā ibrāza ḥaqīqatihi l-Muḥammadiyyah","wa-iẓhārahu jisman wa-rūḥan bi-ṣūratihi wa-maʿnāh"],"translation":["When Allah Most High willed to bring forth the Muhammadan Reality and manifest him in body and spirit, in his outward form and inward meaning, He transferred him to his dwelling within the shell of Aminah al-Zuhriyyah. The Near, the Responsive, specially chose her to be the mother of His Chosen One. Then it was proclaimed throughout the heavens and the earth that she was carrying his essential lights.",""],"isRefrain":false},{"arabic":["نَقَلَهُ إِلَى مَقَرِّهِ مِنْ صَدَفَةِ آمِنَةَ الزُّهْرِيَّةْ ❁","وَخَصَّهَا الْقَرِيبُ الْمُجِيب بِأَنْ تَكُونَ أُمًّا لِمُصْطَفَاهْ ❁"],"transliteration":["naqalahu ilā maqarrihi min ṣadafati Āminata z-zuhriyyah","wa-khaṣṣaha l-qarību l-mujību bi-an takūna umman li-muṣṭafāh"],"translation":["",""],"isRefrain":false},{"arabic":["وَنُودِيَ فِي السَّمَاوَاتِ وَالْأَرْضِ بِحَمْلِهَا لِأَنْوَارِهِ الذّاتِيَّةْ ❁"],"transliteration":["wa-nūdiya fī s-samāwāti wa-l-arḍi bi-ḥamlihā li-anwārihi dh-dhātiyyah.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَصَبَا كُلُّ صَبٍّ لِهُبُوبِ نَسِيمِ صَبَاهْ ❁","وَكُسِيَتِ الْأَرْضُ بَعْدَ طُولِ جَدْبِهَا مِنَ النَّبَاتِ حُلَلًا سُنْدُسِيَّةْ ❁"],"transliteration":["Wa-ṣabā kullu ṣabbin li-hubūbi nasīmi ṣabāh","wa-kusiyati l-arḍu baʿda ṭūli jadbihā mina n-nabāti ḥulalan sundusiyyah"],"translation":["Every yearning soul longed for the blowing of the gentle breeze of his coming. After its long barrenness, the earth was clothed with garments of silken green vegetation. The fruits ripened, and the trees brought their produce within reach of those who would gather it. Every beast belonging to Quraysh spoke of her bearing him in eloquent Arabic. Couches and idols fell upon their faces and mouths.",""],"isRefrain":false},{"arabic":["وَأَيْنَعَتِ الثِّمَارُ وَأَدْنَى الشَّجَرُ لِلْجَانِي جَنَاهْ ❁","وَنَطَقَتْ بِحَمْلِهِ كُلُّ دَابَّةٍ لِقُرَيْشٍ بِفِصَاحِ الْأَلْسُنِ الْعَرَبِيَّةْ ❁"],"transliteration":["wa-aynaʿati th-thimāru wa-adnā sh-shajaru li-l-jānī janāh","wa-naṭaqat bi-ḥamlihi kullu dābbatin li-Qurayshin bi-fiṣāḥi l-alsuni l-ʿarabiyyah"],"translation":["",""],"isRefrain":false},{"arabic":["وَخَرَّتِ الْأَسِرَّةُ وَالْأَصْنَامُ عَلَى الْوُجُوهِ وَالْأَفْوَاهْ ❁"],"transliteration":["wa-kharrati l-asirratu wa-l-aṣnāmu ʿalā l-wujūhi wa-l-afwāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَتَبَاشَرَتْ وُحُوشُ الْمَشَارِقِ وَالْمَغَارِبِ وَدَوَابُّهَا الْبَحْرِيَّةْ ❁","وَاحْتَسَتِ الْعَوَالِمُ مِنَ السُّرُورِ كَأْسَ حُمَيَّاهْ ❁"],"transliteration":["Wa-tabāsharat wuḥūshu l-mashāriqi wa-l-maghāribi wa-dawābbuha l-baḥriyyah","wa-ḥtasati l-ʿawālimu mina s-surūri ka'sa ḥumayyāh"],"translation":["The beasts of the East and West rejoiced with one another, as did the creatures of the seas. The worlds drank deeply from the intoxicating cup of joy. The jinn were given glad tidings of the approaching shadow of his time, soothsaying was brought to ruin, and monasticism was struck with
