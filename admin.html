<style>
:root{

  --cream:#F4EFE2;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{

  background:linear-gradient(160deg,#081310,#164034);
  min-height:100vh;padding:2rem;
}
.admin-container{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:3rem}
.panel{background:rgba(255,255,255,.035);border:1px solid rgba(212,169,62,.14);border-radius:18px;padding:2rem;backdrop-filter:blur(10px)}
.panel h2{font-family:'Cormorant',serif;font-size:2rem;color:var(--gold-400);margin-bottom:1.5rem;font-weight:600}
.button-group{display:flex;flex-direction:column;gap:1rem;margin-bottom:2rem}
.button-row{display:flex;gap:1rem}
.btn{padding:14px 24px;border-radius:12px;border:none;font-family:'Manrope';font-size:1rem;font-weight:600;cursor:pointer;transition:all .3s var(--ease);flex:1}
.btn-primary{background:var(--gold-500);color:var(--green-950);box-shadow:0 4px 12px rgba(212,169,62,.3)}
.btn-primary:hover{background:var(--gold-400);transform:translateY(-2px);box-shadow:0 6px 16px rgba(212,169,62,.4)}
.btn-secondary{background:rgba(212,169,62,.15);color:var(--cream);border:1px solid rgba(212,169,62,.35)}
.btn-secondary:hover{background:rgba(212,169,62,.28);border-color:rgba(212,169,62,.55)}
.btn-danger{background:rgba(200,80,80,.6);color:var(--cream);border:1px solid rgba(200,80,80,.8)}
.btn-danger:hover{background:rgba(200,80,80,.8)}
.label{display:block;font-size:.9rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(244,239,226,.6);margin-bottom:.5rem;font-weight:600}
.qasidah-list{display:flex;flex-direction:column;gap:.5rem;margin-bottom:2rem}
.qasidah-btn{padding:12px 16px;border-radius:10px;border:1px solid rgba(212,169,62,.2);background:rgba(212,169,62,.08);color:var(--cream);text-align:left;cursor:pointer;transition:all .3s var(--ease);font-family:'Manrope';font-size:1rem}
.qasidah-btn:hover{background:rgba(212,169,62,.15);border-color:rgba(212,169,62,.4)}
.qasidah-btn.active{background:var(--gold-500);color:var(--green-950);border-color:var(--gold-500);font-weight:600}
.preview{background:rgba(8,19,16,.5);border:1px solid rgba(212,169,62,.2);border-radius:12px;padding:2rem;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:1.5rem}
.preview-empty{color:rgba(244,239,226,.5);font-style:italic}
.preview-title{font-family:'Cormorant',serif;font-size:1.8rem;color:var(--gold-300);font-weight:600}
.preview-subtitle{font-size:.95rem;color:rgba(244,239,226,.7)}
.preview-arabic{font-family:'Amiri',serif;font-size:1.6rem;color:var(--cream);line-height:1.4;margin:1rem 0}
.preview-text{font-size:1rem;color:rgba(244,239,226,.75);line-height:1.6}
.status{background:rgba(46,125,87,.15);border:1px solid rgba(46,125,87,.3);border-radius:10px;padding:1rem;margin-top:1.5rem}
.status-label{font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(244,239,226,.6);display:block;margin-bottom:.5rem}
.status-value{font-family:'Cormorant',serif;font-size:1.3rem;color:var(--gold-400);font-weight:600}
@media(max-width:1000px){
  .admin-container{grid-template-columns:1fr;gap:2rem}
}
</style>

    <div class="status">

    </div>
  </div>
</div>

const mawlidRef = ref(db, 'mawlid');
let currentQasidahIndex = -1;
let currentCoupletIndex = -1;

const prevCoupletBtn = document.getElementById('prevCouplet');
const nextCoupletBtn = document.getElementById('nextCouplet');
const prevQasidahBtn = document.getElementById('prevQasidah');
const nextQasidahBtn = document.getElementById('nextQasidah');
const clearScreenBtn = document.getElementById('clearScreen');
const qasidahList = document.getElementById('qasidahList');
const preview = document.getElementById('preview');
const statusValue = document.getElementById('statusValue');

function updatePreview(qIdx, cIdx) {
  if (qIdx < 0 || qIdx >= qasidahs.length) {
    preview.innerHTML = '<div class="preview-empty">No content selected</div>';
    statusValue.textContent = '—';
    return;
  }

  const qasidah = qasidahs[qIdx];
  if (cIdx < 0 || cIdx >= qasidah.couplets.length) {
    preview.innerHTML = '<div class="preview-empty">Invalid couplet</div>';
    statusValue.textContent = `Qasidah ${qIdx + 1}`;
    return;
  }

  const couplet = qasidah.couplets[cIdx];
  preview.innerHTML = `
    <div class="preview-title">${qasidah.title}</div>
    <div class="preview-subtitle">${qasidah.englishTitle}</div>
    <div class="preview-arabic">${couplet.arabic[0]}</div>
    <div class="preview-arabic">${couplet.arabic[1]}</div>
    <div class="preview-text"><strong>Translation:</strong></div>
    <div class="preview-text">${couplet.translation.join(' ')}</div>
  `;
  statusValue.textContent = `Qasidah ${qIdx + 1} • Couplet ${cIdx + 1}`;
}

async function updateFirebase(qIdx, cIdx) {
  currentQasidahIndex = qIdx;
  currentCoupletIndex = cIdx;
  await set(mawlidRef, { qasidahIndex: qIdx, coupletIndex: cIdx });
  updatePreview(qIdx, cIdx);
}

prevCoupletBtn.addEventListener('click', () => {
  if (currentCoupletIndex > 0) {
    updateFirebase(currentQasidahIndex, currentCoupletIndex - 1);
  }
});

nextCoupletBtn.addEventListener('click', () => {
  if (currentQasidahIndex >= 0 && currentCoupletIndex < qasidahs[currentQasidahIndex].couplets.length - 1) {
    updateFirebase(currentQasidahIndex, currentCoupletIndex + 1);
  }
});

prevQasidahBtn.addEventListener('click', () => {
  if (currentQasidahIndex > 0) {
    updateFirebase(currentQasidahIndex - 1, 0);
  }
});

nextQasidahBtn.addEventListener('click', () => {
  if (currentQasidahIndex < qasidahs.length - 1) {
    updateFirebase(currentQasidahIndex + 1, 0);
  }
});

clearScreenBtn.addEventListener('click', () => {
  updateFirebase(-1, -1);
});

// Populate qasidah list
qasidahs.forEach((q, idx) => {
  const btn = document.createElement('button');
  btn.className = 'qasidah-btn';
  btn.textContent = `${idx + 1}. ${q.title}`;
  btn.addEventListener('click', () => updateFirebase(idx, 0));
  qasidahList.appendChild(btn);
});

// Listen for changes from Firebase
onValue(mawlidRef, (snap) => {
  const data = snap.val() || {};
  const qIdx = data.qasidahIndex ?? -1;
  const cIdx = data.coupletIndex ?? -1;

  currentQasidahIndex = qIdx;
  currentCoupletIndex = cIdx;
  updatePreview(qIdx, cIdx);

  // Update active qasidah button
  document.querySelectorAll('.qasidah-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === qIdx);
  });
});
</script>
