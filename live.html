specially favoured with His pleasure. The following year, twelve men from among them came for Hajj and gave him a true pledge of allegiance. Then they returned, and Islam spread in al-Madinah, which became his stronghold and refuge.",""],"isRefrain":false},{"arabic":["وَحَجَّ مِنْهُمْ فِي الْقَابِلِ اثْنَا عَشَرَ رَجُلًا وَبَايَعُوهُ بَيْعَةً حَقِّيَّةْ ❁","ثُمَّ انْصَرَفُوا فَظَهَرَ الْإِسْلَامُ بِالْمَدِينَةِ فَكَانَتْ مَعْقِلَهُ وَمَأْوَاهْ ❁"],"transliteration":["wa-ḥajja minhum fī l-qābili thnā ʿashara rajulan wa-bāyaʿūhu bayʿatan ḥaqqiyyah","thumma-n-ṣarafū fa-ẓahara l-islāmu bi-l-Madīnati fa-kānat maʿqilahu wa-ma'wāh."],"translation":["",""],"isRefrain":false},{"arabic":["وَقَدِمَ عَلَيْهِ فِي الْعَامِ الثَّالِثِ سَبْعُونَ وَخَمْسَةٌ أَوْ وَثَلَاثَةٌ وَامْرَأَتَانِ مِنَ الْقَبَائِلِ الْأَوْسِيَّةِ وَالْخَزْرَجِيَّةْ ❁","فَبَايَعُوهُ وَأَمَّرَ عَلَيْهِمْ اثْنَيْ عَشَرَ نَقِيبًا جَحَاجِحَةً سَرَاةْ ❁"],"transliteration":["Wa-qadima ʿalayhi fī l-ʿāmi th-thālithi sabʿūna wa-khamsatun aw wa-thalathatun wa-mra'atāni mina l-qabā'ili l-awsiyyati wa-l-khazrajiyyah","fa-bāyaʿūhu wa-ammara ʿalayhim-thnay ʿashara naqīban jaḥājiḥatan sarāh"],"translation":["And in the third year, seventy-five, or according to another account seventy-three, together with two women from the tribes of Aws and Khazraj, came to him and pledged allegiance to him. He appointed over them twelve leaders, noble chiefs of high standing. Then the people of the Islamic faith migrated from Makkah to join them, leaving their homelands behind out of longing for what had been prepared for those who forsook disbelief and opposed it.",""],"isRefrain":false},{"arabic":["فَهَاجَرَ إِلَيْهِمْ مِنْ مَكَّةَ ذَوُو الْمِلَّةِ الْإِسْلَامِيَّةْ ❁","وَفَارَقُوا الْأَوْطَانَ رَغْبَةً فِيمَا أُعِدَّ لِمَنْ هَجَرَ الْكُفْرَ وَنَاوَاهْ ❁"],"transliteration":["fa-hājara ilayhim min Makkata dhawu l-millati l-islāmiyyah","wa-fāraqu l-awṭāna raghbatan fīmā uʿidda li-man hajara l-kufra wa-nāwāh."],"translation":["",""],"isRefrain":false},{"arabic":["وَخَافَتْ قُرَيْشٌ أَنْ يَلْحَقَ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ بِأَصْحَابِهِ عَلَى الْفَوْرِيَّةْ ❁","فَأْتَمَرُوا بِقَتْلِهِ فَحَفِظَهُ اللَّهُ تَعَالَى مِنْ كَيْدِهِمْ وَنَجَّاهْ ❁"],"transliteration":["Wa-khāfat Qurayshun an yalḥaqa ṣalla Llāhu taʿālā ʿalayhi wa-sallama bi-aṣḥābihi ʿalā l-fawriyyah","fa-'tamarū bi-qatlihi fa-ḥafiẓahu Llāhu taʿālā min kaydihim wa-najjāh."],"translation":["Quraysh feared that he, may Allah Most High send prayers and peace upon him, would immediately join his companions, so they conspired to kill him. But Allah Most High protected him from their plot and delivered him safely.",""],"isRefrain":false},{"arabic":["وَقَدْ أُذِنَ لَهُ فِي الْهِجْرَةِ فَرَقَبَهُ الْمُشْرِكُونَ لِيُورِدُوهُ بِزَعْمِهِمْ حِيَاضَ الْمَنِيَّةْ ❁","فَخَرَجَ عَلَيْهِمْ وَنَثَرَ عَلَى رُؤُوسِهِمُ التُّرَابَ وَحَثَاهْ ❁"],"transliteration":["Wa-qad udhina lahu fī l-hijrati fa-raqabahu l-mushrikūna li-yūridūhu bi-zaʿmihim ḥiyāḍa l-maniyyah. Fa-kharaja ʿalayhim wa-nathara ʿalā ru'ūsihimu t-turāba wa-ḥathāh, wa-amma ghāra thawrin wa-fāza ṣ-ṣiddīqu bi-l-maʿiyyah, wa-aqāmā fīhi thalāthan taḥmi l-ḥamā'imu wa-l-ʿanākibu ḥimāh, thumma kharajā minhu laylata l-ithnayni wa-huwa ṣalla Llāhu taʿālā ʿalayhi wa-sallama ʿalā khayri maṭiyyah.",""],"translation":["Permission was then granted to him, may Allah Most High send prayers and peace upon him, to migrate, and the idolaters watched for him, intending, as they supposed, to bring him to the pools of death. But he went forth among them, scattering dust upon their heads. He made his way to the Cave of Thawr, and al-Siddiq attained the honour of accompanying him. They remained there for three nights, while the doves and spiders protected their refuge. Then they departed from it on Monday night, with him, may Allah Most High send prayers and peace upon him, riding the finest of mounts.",""],"isRefrain":false},{"arabic":["وَأَمَّ غَارَ ثَوْرٍ وَفَازَ الصِّدِّيقُ بِالْمَعِيَّةْ ❁","وَأَقَامَا فِيهِ ثَلَاثًا تَحْمِي الْحَمَائِمُ وَالْعَنَاكِبُ حِمَاهْ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["ثُمَّ خَرَجَا مِنْهُ لَيْلَةَ الْإِثْنَيْنِ وَهُوَ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ عَلَى خَيْرِ مَطِيَّةْ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["وَتَعَرَّضَ لَهُ سُرَاقَةُ فَابْتَهَلَ فِيهِ إِلَى اللَّهِ تَعَالَى وَدَعَاهْ ❁","فَسَاخَتْ قَوَائِمُ يَعْبُوبِهِ فِي الْأَرْضِ الصُّلْبَةِ الْقَوِيَّةْ ❁"],"transliteration":["Wa-taʿarraḍa lahu Surāqatu fa-btahala fīhi ilā Llāhi taʿālā wa-daʿāh","fa-sākhat qawā'imu yaʿbūbihi fī l-arḍi ṣ-ṣulbati l-qawiyyah"],"translation":["Suraqah pursued him, so the Prophet, may Allah Most High send prayers and peace upon him, supplicated to Allah against him, and the legs of Suraqah’s horse sank into the hard, solid ground. Suraqah then asked him for safety, and he granted it to him.",""],"isRefrain":false},{"arabic":["وَسَأَلَهُ الْأَمَانَ فَمَنَحَهُ إِيَّاهْ ❁"],"transliteration":["wa-sa'alahu l-amāna fa-manaḥahu iyyāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["عَطِّرِ اللَّهُمَّ قَبْرَهُ الْكَرِيمَ بِعَرْفٍ شَذِيٍّ مِنْ صَلَاةٍ وَتَسْلِيمٍ ❁","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَيْهِ ❁"],"transliteration":["ʿAṭṭiri Llāhumma qabrahu l-karīma bi-ʿarfin shadhiyyin min ṣalātin wa-taslīmin. Allāhumma ṣalli wa-sallim wa-bārik ʿalayhi.",""],"translation":["O Allah, perfume his noble grave with a fragrant scent of prayers and peace. O Allah, send prayers, peace, and blessings upon him.",""],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: Umm Ma'bad and Abu Ma'bad","englishTitle":"Mawlid al-Barzanji: Umm Ma'bad and Abu Ma'bad","couplets":[{"arabic":["ثُمَّ مَرَّ بِقُدَيْدٍ عَلَى أُمِّ مَعْبَدٍ الْخُزَاعِيَّةْ ❁","وَأَرَادَ ابْتِيَاعَ لَحْمٍ أَوْ لَبَنٍ مِنْهَا فَلَمْ يَكُنْ شَيْءٌ مِنْ ذَلِكَ خِبَاؤُهَا قَدْ حَوَاهْ ❁"],"transliteration":["Thumma marra bi-Qudaydin ʿalā Ummi Maʿbadin l-Khuzāʿiyyah","wa-arāda-btiyāʿa laḥmin aw labanin minhā fa-lam yakun shay'un min dhālika khibā'uhā qad ḥawāh"],"translation":["Then, passing through Qudayd, he came upon Umm Ma'bad al-Khuza'iyyah and wished to purchase some meat or milk from her, but her tent contained none of either. He then noticed an ewe by the tent that weakness had kept behind from the grazing flock. He asked her permission to milk it, and she consented, saying, “Had there been any milk in it, we would have found it.” He then stroked its udder and supplicated to Allah, his Lord and Protector.",""],"isRefrain":false},{"arabic":["فَنَظَرَ إِلَى شَاةٍ فِي الْبَيْتِ خَلَّفَهَا الْجَهْدُ عَنِ الرَّعِيَّةْ ❁","فَاسْتَأْذَنَهَا فِي حَلْبِهَا فَأَذِنَتْ وَقَالَتْ لَوْ كَانَ بِهَا حَلْبٌ لَأَصَبْنَاهْ ❁"],"transliteration":["fa-naẓara ilā shātin fī l-bayti khallafaha l-jahdu ʿani r-raʿiyyah","fa-s-ta'dhanahā fī ḥalbihā fa-adhinat wa-qālat law kāna bihā ḥalbun la-aṣabnāh"],"translation":["",""],"isRefrain":false},{"arabic":["فَمَسَحَ الضَّرْعَ مِنْهَا وَدَعَا اللَّهَ مَوْلَاهُ وَوَلِيَّهْ ❁"],"transliteration":["fa-masaḥa ḍ-ḍarʿa minhā wa-daʿā Llāha mawlāhu wa-waliyyah.",""],"translation":["",""],"isRefrain":false},{"arabic":["فَدَرَّتْ فَحَلَبَ وَسَقَى كُلًّا مِنَ الْقَوْمِ وَأَرْوَاهْ ❁","ثُمَّ حَلَبَ وَمَلَأَ الْإِنَاءَ وَغَادَرَهُ لَدَيْهَا آيَةً جَلِيَّةْ ❁"],"transliteration":["Fa-darrat fa-ḥalaba wa-saqā kullan mina l-qawmi wa-arwāh, thumma ḥalaba wa-mala'a l-inā'a wa-ghādarahu ladayhā āyatan jaliyyah, fa-jā'a Abū Maʿbadin wa-ra'ā l-labana fa-dhahaba bihi l-ʿajabu ilā aqṣāh, wa-qāla annā laki hādhā wa-lā ḥalūba fī l-bayti tabiḍḍu bi-qaṭratin labaniyyah, fa-qālat marra bi-nā rajulun mubārakun kadhā wa-kadhā juthmānuhu wa-maʿnāh. Fa-qāla lahā hādhā ṣāḥibu Qurayshin wa-aqsama bi-kulli aliyyah, bi-annahu law ra'āhu la-āmana bihi wa-ttabaʿahu wa-adnāh.",""],"translation":["And its milk flowed abundantly, so he milked it and gave everyone among the group to drink until their thirst was quenched. Then he milked it again, filled the vessel, and left it with her as a manifest sign. And when Abu Ma'bad returned and saw the milk, his astonishment reached its utmost. He said, “Where did you get this when there is no milk-giving animal in the tent that could yield even a single drop of milk?” She replied, “A blessed man passed by us,” and proceeded to describe his physical appearance and his qualities. He said to her, “This is the man of Quraysh,” and swore with every solemn oath that, had he seen him, he would have believed in him, followed him, and remained close to him.",""],"isRefrain":false},{"arabic":["فَجَاءَ أَبُو مَعْبَدٍ وَرَأَى اللَّبَنَ فَذَهَبَ بِهِ الْعَجَبُ إِلَى أَقْصَاهْ ❁","وَقَالَ أَنَّى لَكِ هَذَا وَلَا حَلُوبَ فِي الْبَيْتِ تَبِضُّ بِقَطْرَةٍ لَبَنِيَّةْ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["فَقَالَتْ مَرَّ بِنَا رَجُلٌ مُبَارَكٌ كَذَا وَكَذَا جُثْمَانُهُ وَمَعْنَاهْ ❁","فَقَالَ لَهَا هَذَا صَاحِبُ قُرَيْشٍ وَأَقْسَمَ بِكُلِّ أَلِيَّةْ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["بِأَنَّهُ لَوْ رَآهُ لَآمَنَ بِهِ وَاتَّبَعَهُ وَأَدْنَاهْ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["وَقَدِمَ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ الْمَدِينَةَ يَوْمَ الْإِثْنَيْنِ ثَانِيَ عَشْرَ رَبِيعٍ الْأَوَّلِ وَأَشْرَقَتْ بِهِ أَرْجَاؤُهَا الزَّكِيَّةْ ❁","وَتَلَقَّاهُ الْأَنْصَارُ وَنَزَلَ بِقُبَاءَ وَأَسَّسَ مَسْجِدَهَا عَلَى تَقْوَاهْ ❁"],"transliteration":["Wa-qadima ṣalla Llāhu taʿālā ʿalayhi wa-sallama l-Madīnata yawma l-ithnayni thāniya ʿashra rabīʿin l-awwali wa-ashraqat bihi arjā'uha z-zakiyyah","wa-talaqqāhu l-anṣāru wa-nazala bi-Qubā'a wa-assasa masjidahā ʿalā taqwāh."],"translation":["The Prophet, may Allah Most High send prayers and peace upon him, arrived in al-Madinah on Monday, the twelfth of Rabi al-Awwal, and its pure horizons were illuminated by his presence. And the Ansar welcomed him, and he settled in Quba, where he founded its mosque upon piety.",""],"isRefrain":false},{"arabic":["عَطِّرِ اللَّهُمَّ قَبْرَهُ الْكَرِيمَ بِعَرْفٍ شَذِيٍّ مِنْ صَلَاةٍ وَتَسْلِيمٍ ❁","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَيْهِ ❁"],"transliteration":["ʿAṭṭiri Llāhumma qabrahu l-karīma bi-ʿarfin shadhiyyin min ṣalātin wa-taslīmin. Allāhumma ṣalli wa-sallim wa-bārik ʿalayhi.",""],"translation":["O Allah, perfume his noble grave with a fragrant scent of prayers and peace. O Allah, send prayers, peace, and blessings upon him.",""],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: The Noble Qualities of the Prophet ﷺ","englishTitle":"Mawlid al-Barzanji: The Noble Qualities of the Prophet ﷺ","couplets":[{"arabic":["وَكَانَ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ أَكْمَلَ النَّاسِ خَلْقًا وَخُلُقًا ذَا ذَاتٍ وَصِفَاتٍ سَنِيَّةْ ❁","مَرْبُوعَ الْقَامَةِ أَبْيَضَ اللَّوْنِ مُشْرَبًا بِحُمْرَةٍ وَاسِعَ الْعَيْنَيْنِ أَكْحَلَهُمَا أَهْدَبَ الْأَشْفَارِ قَدْ مُنِحَ الزَّجَجَ حَاجِبَاهْ ❁"],"transliteration":["Wa-kāna ṣalla Llāhu taʿālā ʿalayhi wa-sallama akmala n-nāsi khalqan wa-khuluqan dhā dhātin wa-ṣifātin saniyyah","marbūʿa l-qāmati abyaḍa l-lawni mushraban bi-ḥumratin wāsiʿa l-ʿaynayni akḥalahumā ahdaba l-ashfāri qad muniḥa z-zajaja ḥājibāh"],"translation":["He, may Allah Most High send prayers and peace upon him, was the most perfect of all people in form and character, possessing a noble being and sublime attributes. He was of medium stature, fair in complexion with a tinge of redness, with wide eyes that appeared naturally lined with kohl, long eyelashes, and fine, arched eyebrows. His teeth were slightly spaced, his mouth broad and handsome, and his forehead wide and crescent-shaped.",""],"isRefrain":false},{"arabic":["مُفَلَّجَ الْأَسْنَانِ وَاسِعَ الْفَمِ حَسَنَهُ وَاسِعَ الْجَبِينِ ذَا جَبْهَةٍ هِلَالِيَّةْ ❁"],"transliteration":["mufallaja l-asnāni wāsiʿa l-fami ḥasanahu wāsiʿa l-jabīni dhā jabhatin hilāliyyah.",""],"translation":["",""],"isRefrain":false},{"arabic":["سَهْلَ الْخَدَّيْنِ يُرَى فِي أَنْفِهِ بَعْضُ احْدِيدَابٍ حَسَنَ الْعِرْنِيْنِ أَقْنَاهْ ❁","بَعِيدَ مَا بَيْنَ الْمَنْكِبَيْنِ سَبْطَ الْكَفَّيْنِ ضَخْمَ الْكَرَادِيسِ قَلِيلَ لَحْمِ الْعَقِبِ كَثَّ اللِّحْيَةِ عَظِيمَ الرَّأْسِ شَعْرُهُ إِلَى الشَّحْمَةِ الْأُذُنِيَّةْ ❁"],"transliteration":["Sahla l-khaddayni yurā fī anfihi baʿḍu ḥdīdābin ḥasana l-ʿirnīni aqnāh","baʿīda mā bayna l-mankibayni sabṭa l-kaffayni ḍakhma l-karādīsi qalīla laḥmi l-ʿaqibi kaththa l-liḥyati ʿaẓīma r-ra'si shaʿruhu ilā sh-shaḥmati l-udhuniyyah"],"translation":["His cheeks were smooth, and a slight curve could be seen in his nose, which was handsome and aquiline. His shoulders were broad, his palms smooth, his joints large, and there was little flesh upon his heels. His beard was full, his head large, and his hair reached his earlobes. And between his shoulders was the Seal of Prophethood, encompassed and covered by light.",""],"isRefrain":false},{"arabic":["وَبَيْنَ كَتِفَيْهِ خَاتَمُ النُّبُوَّةِ قَدْ عَمَّهُ النُّورُ وَعَلَاهْ ❁"],"transliteration":["wa-bayna katifayhi khātamu n-nubuwwati qad ʿammahu n-nūru wa-ʿalāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَعَرَقُهُ كَاللُّؤْلُؤِ وَعَرْفُهُ أَطْيَبُ مِنَ النَّفَحَاتِ الْمِسْكِيَّةْ ❁","وَيَتَكَفَّأُ فِي مِشْيَتِهِ كَأَنَّمَا يَنْحَطُّ مِنْ صَبَبٍ ارْتَقَاهْ ❁"],"transliteration":["Wa-ʿaraquhu ka-l-lu'lu'i wa-ʿarfuhu aṭyabu mina n-nafaḥāti l-miskiyyah","wa-yatakaffa'u fī mishyatihi ka-annamā yanḥaṭṭu min ṣababin irtaqāh"],"translation":["His perspiration was like pearls, and his fragrance was sweeter than musky breezes. And when he walked, he moved with a forward-leaning stride, as though descending from a height. And when he shook someone’s hand with his noble hand, that person would find its exquisite fragrance lingering throughout the rest of the day.",""],"isRefrain":false},{"arabic":["وَكَانَ يُصَافِحُ الْمُصَافِحَ بِيَدِهِ الشَّرِيفَةِ فَيَجِدُ مِنْهَا سَائِرَ الْيَوْمِ رَائِحَةً عَبْهَرِيَّةْ ❁"],"transliteration":["wa-kāna yuṣāfiḥu l-muṣāfiḥa bi-yadihi sh-sharīfati fa-yajidu minhā sā'ira l-yawmi rā'iḥatan ʿabhariyyah.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَيَضَعُهَا عَلَى رَأْسِ الصَّبِيِّ فَيُعْرَفُ مَسُّهُ لَهُ مِنْ بَيْنِ الصِّبْيَةِ وَيُدْرَاهْ ❁","يَتَلَأْلَأُ وَجْهُهُ الشَّرِيفُ تَلَأْلُؤَ الْقَمَرِ فِي اللَّيْلَةِ الْبَدْرِيَّةْ ❁"],"transliteration":["Wa-yaḍaʿuhā ʿalā ra'si ṣ-ṣabiyyi fa-yuʿrafu massuhu lahu min bayni ṣ-ṣibyati wa-yudrāh","yatala'la'u wajhuhu sh-sharīfu tala'lu'a l-qamari fī l-laylati l-badriyyah"],"translation":["And when he placed his noble hand upon a child’s head, the child could be distinguished from among the other children by the fragrance left by his touch. His noble face shone with the radiance of the moon on a full-moon night. And one who described him said, “I have never seen anyone like him, before him or after him, nor will any human being ever see his like.”",""],"isRefrain":false},{"arabic":["يَقُولُ نَاعِتُهُ لَمْ أَرَ قَبْلَهُ وَلَا بَعْدَهُ مِثْلَهُ وَلَا بَشَرٌ يَرَاهْ ❁"],"transliteration":["yaqūlu nāʿituhu lam ara qablahu wa-lā baʿdahu mithlahu wa-lā basharun yarāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["عَطِّرِ اللَّهُمَّ قَبْرَهُ الْكَرِيمَ بِعَرْفٍ شَذِيٍّ مِنْ صَلَاةٍ وَتَسْلِيمٍ ❁","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَيْهِ ❁"],"transliteration":["ʿAṭṭiri Llāhumma qabrahu l-karīma bi-ʿarfin shadhiyyin min ṣalātin wa-taslīmin. Allāhumma ṣalli wa-sallim wa-bārik ʿalayhi.",""],"translation":["O Allah, perfume his noble grave with a fragrant scent of prayers and peace. O Allah, send prayers, peace, and blessings upon him.",""],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: The Character and Conduct of the Prophet ﷺ","englishTitle":"Mawlid al-Barzanji: The Character and Conduct of the Prophet ﷺ","couplets":[{"arabic":["وَكَانَ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ شَدِيدَ الْحَيَاءِ وَالتَّوَاضُعِ يَخْصِفُ نَعْلَهُ وَيَرْقَعُ ثَوْبَهُ وَيَحْلُبُ شَاتَهُ وَيَسِيرُ فِي خِدْمَةِ أَهْلِهِ بِسِيرَةٍ سَرِيَّةْ ❁","وَيُحِبُّ الْفُقَرَاءَ وَالْمَسَاكِينَ وَيَجْلِسُ مَعَهُمْ وَيَعُودُ مَرْضَاهُمْ وَيُشَيِّعُ جَنَائِزَهُمْ وَلَا يَحْقِرُ فَقِيرًا أَدْقَعَهُ الْفَقْرُ وَأَشْوَاهْ ❁"],"transliteration":["Wa-kāna ṣalla Llāhu taʿālā ʿalayhi wa-sallama shadīda l-ḥayā'i wa-t-tawāḍuʿi yakhṣifu naʿlahu wa-yarqaʿu thawbahu wa-yaḥlubu shātahu wa-yasīru fī khidmati ahlihi bi-sīratin sariyyah","wa-yuḥibbu l-fuqarā'a wa-l-masākīna wa-yajlisu maʿahum wa-yaʿūdu marḍāhum wa-yushayyiʿu janā'izahum wa-lā yaḥqiru faqīran adqaʿahu l-faqru wa-ashwāh."],"translation":["He, may Allah Most High send prayers and peace upon him, was exceedingly modest and humble. He mended his own sandals, patched his garments, milked his ewe, and served his family in a noble manner. And he loved the poor and needy, sat with them, visited their sick, accompanied their funeral processions, and never looked down upon a poor person whom poverty had reduced to extreme hardship and destitution.",""],"isRefrain":false},{"arabic":["وَيَقْبَلُ الْمَعْذِرَةَ وَلَا يُقَابِلُ أَحَدًا بِمَا يَكْرَهُ وَيَمْشِي مَعَ الْأَرْمَلَةِ وَذَوِي الْعُبُودِيَّةْ ❁","وَلَا يَهَابُ الْمُلُوكَ وَيَغْضَبُ لِلَّهِ وَيَرْضَى لِرِضَاهْ ❁"],"transliteration":["Wa-yaqbalu l-maʿdhirata wa-lā yuqābilu aḥadan bi-mā yakrahu wa-yamshī maʿa l-armalati wa-dhawi l-ʿubūdiyyah","wa-lā yahābu l-mulūka wa-yaghḍabu li-Llāhi wa-yarḍā li-riḍāh"],"translation":["And he accepted excuses, never confronted anyone with what they disliked, and walked alongside widows and those in servitude. And he feared no kings, became angry for Allah’s sake, and was pleased with what pleased Him. And he walked behind his companions and would say, “Leave the space behind me for the spiritual angels.” And he rode camels, horses and mules, as well as a donkey that one of the kings had gifted to him.",""],"isRefrain":false},{"arabic":["وَيَمْشِي خَلْفَ أَصْحَابِهِ وَيَقُولُ: خَلُّوا ظَهْرِي لِلْمَلَائِكَةِ الرُّوحَانِيَّةْ ❁","وَيَرْكَبُ الْبَعِيرَ وَالْفَرَسَ وَالْبَغْلَةَ وَحِمَارًا بَعْضُ الْمُلُوكِ إِلَيْهِ أَهْدَاهْ ❁"],"transliteration":["wa-yamshī khalfa aṣḥābihi wa-yaqūlu khallū ẓahrī li-l-malā'ikati r-rūḥāniyyah","wa-yarkabu l-baʿīra wa-l-farasa wa-l-baghlata wa-ḥimāran baʿḍu l-mulūki ilayhi ahdāh."],"translation":["",""],"isRefrain":false},{"arabic":["وَيَعْصِبُ عَلَى بَطْنِهِ الْحَجَرَ مِنَ الْجُوعِ وَقَدْ أُوتِيَ مَفَاتِيحَ الْخَزَائِنِ الْأَرْضِيَّةْ ❁","وَرَاوَدَتْهُ الْجِبَالُ بِأَنْ تَكُونَ لَهُ ذَهَبًا فَأَبَاهْ ❁"],"transliteration":["Wa-yaʿṣibu ʿalā baṭnihi l-ḥajara mina l-jūʿi wa-qad ūtiya mafātīḥa l-khazā'ini l-arḍiyyah","wa-rāwadat-hu l-jibālu bi-an takūna lahu dhahaban fa-abāh"],"translation":["And he would bind a stone against his stomach out of hunger, though he had been given the keys to the treasures of the earth. And the mountains offered to become gold for him, but he refused. And he, may Allah Most High send prayers and peace upon him, engaged very little in idle speech, was the first to greet those he met with peace, prolonged the prayer, and kept the Friday sermons brief.",""],"isRefrain":false},{"arabic":["وَكَانَ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ يُقِلُّ اللَّغْوَ وَيَبْدَأُ مَنْ لَقِيَهُ بِالسَّلَامِ وَيُطِيلُ الصَّلَاةَ وَيَقْصُرُ الْخُطَبَ الْجُمُعِيَّةْ ❁"],"transliteration":["wa-kāna ṣalla Llāhu taʿālā ʿalayhi wa-sallama yuqillu l-laghwa wa-yabda'u man laqiyahu bi-s-salāmi wa-yuṭīlu ṣ-ṣalāta wa-yaqṣuru l-khuṭaba l-jumuʿiyyah.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَيَتَأَلَّفُ أَهْلَ الشَّرَفِ وَيُكْرِمُ أَهْلَ الْفَضْلِ وَيَمْزَحُ وَلَا يَقُولُ إِلَّا حَقًّا يُحِبُّهُ اللَّهُ تَعَالَى وَيَرْضَاهْ ❁","وَهَاهُنَا وَقَفَ بِنَا جَوَادُ الْمَقَالِ عَنِ الطِّرَادِ فِي الْحَلْبَةِ الْبَيَانِيَّةْ ❁"],"transliteration":["Wa-yata'allafu ahla sh-sharafi wa-yukrimu ahla l-faḍli wa-yamzaḥu wa-lā yaqūlu illā ḥaqqan yuḥibbuhu Llāhu taʿālā wa-yarḍāh","wa-hāhunā waqafa bi-nā jawādu l-maqāli ʿani ṭ-ṭirādi fī l-ḥalbati l-bayāniyyah"],"translation":["And he would win the hearts of people of honour, show respect to people of virtue, and joke without ever speaking anything but the truth that Allah Most High loves and is pleased with. And here the steed of discourse comes to a halt, unable to race any further in the arena of eloquence, and the traveller of composition has reached the end of his journey through the vast expanses of exposition.",""],"isRefrain":false},{"arabic":["وَبَلَغَ ظَاعِنُ الْإِمْلَاءِ فِي فَدَافِدِ الْإِيضَاحِ مُنْتَهَاهْ ❁"],"transliteration":["wa-balagha ẓāʿinu l-imlā'i fī fadāfidi l-īḍāḥi muntahāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["عَطِّرِ اللَّهُمَّ قَبْرَهُ الْكَرِيمَ بِعَرْفٍ شَذِيٍّ مِنْ صَلَاةٍ وَتَسْلِيمٍ ❁","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَيْهِ ❁"],"transliteration":["ʿAṭṭiri Llāhumma qabrahu l-karīma bi-ʿarfin shadhiyyin min ṣalātin wa-taslīmin. Allāhumma ṣalli wa-sallim wa-bārik ʿalayhi.",""],"translation":["O Allah, perfume his noble grave with a fragrant scent of prayers and peace. O Allah, send prayers, peace, and blessings upon him.",""],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: The Concluding Supplication","englishTitle":"Mawlid al-Barzanji: The Concluding Supplication","couplets":[{"arabic":["اللَّهُمَّ يَا بَاسِطَ الْيَدَيْنِ بِالْعَطِيَّةْ ❁","يَا مَنْ إِذَا رُفِعَتْ إِلَيْهِ أَكُفُّ الْعَبْدِ كَفَاهْ ❁"],"transliteration":["Allāhumma yā bāsiṭa l-yadayni bi-l-ʿaṭiyyah","yā man idhā rufiʿat ilayhi akuffu l-ʿabdi kafāh"],"translation":["O Allah, O You who extend both hands in giving, O You who, when the servant raises his hands to You, suffice him. O You who, in Your Essence and Attributes of Oneness, are exalted beyond all likeness and comparison. O You who alone possess everlastingness, beginninglessness, and eternality. O You besides whom none is hoped in and upon none besides whom reliance is placed.",""],"isRefrain":false},{"arabic":["يَا مَنْ تَنَزَّهَ فِي ذَاتِهِ وَصِفَاتِهِ الْأَحَدِيَّةْ ❁","عَنْ أَنْ يَكُونَ لَهُ فِيهَا نَظَائِرُ وَأَشْبَاهْ ❁"],"transliteration":["yā man tanazzaha fī dhātihi wa-ṣifātihi l-aḥadiyyah","ʿan an yakūna lahu fīhā naẓā'iru wa-ashbāh"],"translation":["",""],"isRefrain":false},{"arabic":["يَا مَنْ تَفَرَّدَ بِالْبَقَاءِ وَالْقِدَمِ وَالْأَزَلِيَّةْ ❁","يَا مَنْ لَا يُرْجَى غَيْرُهُ وَلَا يُعَوَّلُ عَلَى سِوَاهْ ❁"],"transliteration":["yā man tafarrada bi-l-baqā'i wa-l-qidami wa-l-azaliyyah","yā man lā yurjā ghayruhu wa-lā yuʿawwalu ʿalā siwāh."],"translation":["",""],"isRefrain":false},{"arabic":["يَا مَنِ اسْتَنَدَ الْأَنَامُ إِلَى قُدْرَتِهِ الْقَيُّومِيَّةْ ❁","وَأَرْشَدَ بِفَضْلِهِ مَنِ اسْتَرْشَدَهُ وَاسْتَهْدَاهْ ❁"],"transliteration":["Yā mani-stanada l-anāmu ilā qudratihi l-qayyūmiyyah","wa-arshada bi-faḍlihi mani-starshadahu wa-s-tahdāh"],"translation":["O You upon whose sustaining power all creation depends, and who by Your grace guide those who seek guidance and direction from You. We ask You by Your sacred lights, which dispelled the deep darkness of doubt, and we seek a means of approach to You through the honour of the Muhammadan Essence, he who is the last of the prophets in outward form and the first of them in meaning, and through his family, the stars of safety for creation and the ship of safety and salvation.",""],"isRefrain":false},{"arabic":["نَسْأَلُكَ بِأَنْوَارِكَ الْقُدْسِيَّةِ ❁","الَّتِي أَزَاحَتْ مِنْ ظُلُمَاتِ الشَّكِّ دُجَاهْ ❁"],"transliteration":["nas'aluka bi-anwārika l-qudsiyyah","allatī azāḥat min ẓulumāti sh-shakki dujāh"],"translation":["",""],"isRefrain":false},{"arabic":["وَنَتَوَسَّلُ إِلَيْكَ بِشَرَفِ الذَّاتِ الْمُحَمَّدِيَّةْ ❁","وَمَنْ هُوَ آخِرُ الْأَنْبِيَاءِ بِصُورَتِهِ وَأَوَّلُهُمْ بِمَعْنَاهْ ❁"],"transliteration":["wa-natawassalu ilayka bi-sharafi dh-dhāti l-Muḥammadiyyah","wa-man huwa ākhiru l-anbiyā'i bi-ṣūratihi wa-awwaluhum bi-maʿnāh"],"translation":["",""],"isRefrain":false},{"arabic":["وَبِآلِهِ كَواكِبِ أَمْنِ الْبَرِيَّةْ ❁","وَسَفِينَةِ السَّلَامَةِ وَالنَّجَاةْ ❁"],"transliteration":["wa-bi-ālihi kawākibi amni l-bariyyah","wa-safīnati s-salāmati wa-n-najāh."],"translation":["",""],"isRefrain":false},{"arabic":["وَبِأَصْحَابِهِ أُولِي الْهِدَايَةِ وَالْأَفْضَلِيَّةْ ❁","الَّذِينَ بَذَلُوا نُفُوسَهُمْ لِلَّهِ يَبْتَغُونَ فَضْلًا مِنَ اللَّهْ ❁"],"transliteration":["Wa-bi-aṣḥābihi ūli l-hidāyati wa-l-afḍaliyyah","alladhīna badhalū nufūsahum li-Llāhi yabtaghūna faḍlan mina Llāh"],"translation":["And through his Companions, possessors of guidance and excellence, who devoted themselves to Allah, seeking bounty from Allah, and through the bearers of his Sacred Law, possessors of virtues and distinction, who rejoiced in blessing and bounty from Allah, we ask You to grant us success in making our intentions sincere in all our words and deeds.",""],"isRefrain":false},{"arabic":["وَبِحَمَلَةِ شَرِيعَتِهِ أُولِي الْمَنَاقِبِ وَالْخُصُوصِيَّةْ ❁","الَّذِينَ اسْتَبْشَرُوا بِنِعْمَةٍ وَفَضْلٍ مِنَ اللَّهْ ❁"],"transliteration":["wa-bi-ḥamalati sharīʿatihi ūli l-manāqibi wa-l-khuṣūṣiyyah","alladhīna-s-tabsharū bi-niʿmatin wa-faḍlin mina Llāh"],"translation":["",""],"isRefrain":false},{"arabic":["أَنْ تُوَفِّقَنَا فِي الْأَقْوَالِ وَالْأَعْمَالِ لِإِخْلَاصِ النِّيَّةْ ❁"],"transliteration":["an tuwaffiqanā fī l-aqwāli wa-l-aʿmāli li-ikhlāṣi n-niyyah.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَتُنْجِحَ لِكُلٍّ مِنَ الْحَاضِرِينَ مَطْلَبَهُ وَمُنَاهْ ❁","وَتُخَلِّصَنَا مِنْ أَسْرِ الشَّهَوَاتِ وَالْأَدْوَاءِ الْقَلْبِيَّةْ ❁"],"transliteration":["Wa-tunjiḥa li-kullin mina l-ḥāḍirīna maṭlabahu wa-munāh","wa-tukhalliṣanā min asri sh-shahawāti wa-l-adwā'i l-qalbiyyah"],"translation":["And fulfil for each of those present his request and desire, and free us from the bondage of passions and the diseases of the heart. And fulfil for us the hopes we have placed in You, and suffice us against every overwhelming adversity and calamity. And do not make us among those whom their own desires have led astray. And bring within our reach the ripe and abundant fruits of true certainty, and erase from us every sin we have committed.",""],"isRefrain":false},{"arabic":["وَتُحَقِّقَ لَنَا مِنَ الْآمَالِ مَا بِكَ ظَنَنَّاهْ ❁","وَتَكْفِيَنَا كُلَّ مُدْلَهِمَّةٍ وَبَلِيَّةْ ❁"],"transliteration":["wa-tuḥaqqiqa lanā mina l-āmāli mā bika ẓanannāh","wa-takfiyanā kulla mudlahimmatin wa-baliyyah"],"translation":["",""],"isRefrain":false},{"arabic":["وَلَا تَجْعَلْنَا مِمَّنْ أَهْوَاهُ هَوَاهْ ❁","وَتُدْنِيَ لَنَا مِنْ حُسْنِ الْيَقِينِ قُطُوفًا دَانِيَةً جَنِيَّةْ ❁"],"transliteration":["wa-lā tajʿalnā mimman ahwāhu hawāh","wa-tudniya lanā min ḥusni l-yaqīni quṭūfan dāniyatan janiyyah"],"translation":["",""],"isRefrain":false},{"arabic":["وَتَمْحُوَ عَنَّا كُلَّ ذَنْبٍ جَنَيْنَاهْ ❁"],"transliteration":["wa-tamḥuwa ʿannā kulla dhanbin janaynāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَتَسْتُرَ لِكُلٍّ مِنَّا عَيْبَهُ وَعَجْزَهُ وَحَصْرَهُ وَعِيَّهْ ❁","وَتُسَهِّلَ لَنَا مِنْ صَالِحِ الْأَعْمَالِ مَا عَزَّ ذُرَاهْ ❁"],"transliteration":["Wa-tastura li-kullin minnā ʿaybahu wa-ʿajzahu wa-ḥaṣrahu wa-ʿiyyah wa-tusahhila lanā min ṣāliḥi l-aʿmāli mā ʿazza dhurāh allāhumma innaka jaʿalta li-kulli sā'ilin maqāman wa-maziyyah wa-li-kulli rājin mā ammalahu fīka wa-rajāh wa-qad sa'alnāka rājīna mawāhibaka l-laduniyyah, fa-ḥaqqiq lanā mā minka rajawnāh wa-taʿumma jamʿanā hādhā min khazā'ini minaḥika s-saniyyah.",""],"translation":["And conceal for each of us his faults, his weakness, his inability, and his inarticulateness, and make easy for us those righteous deeds whose heights are difficult to attain. O Allah, You have appointed for every seeker a station and distinction, and for everyone who hopes in You that which he hopes for and seeks from You. And we have asked You, hoping for Your divine gifts, so fulfil for us what we have hoped for from You, and encompass this gathering of ours with the treasures of Your sublime gifts.",""],"isRefrain":false},{"arabic":["اللَّهُمَّ إِنَّكَ جَعَلْتَ لِكُلِّ سَائِلٍ مَقَامًا وَمَزِيَّةْ ❁","وَلِكُلِّ رَاجٍ مَا أَمَّلَهُ فِيكَ وَرَجَاهْ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["وَقَدْ سَأَلْنَاكَ رَاجِينَ مَوَاهِبَكَ اللَّدُنِيَّةْ ❁","فَحَقِّقْ لَنَا مَا مِنْكَ رَجَوْنَاهْ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["وَتَعُمَّ جَمْعَنَا هَذَا مِنْ خَزَائِنِ مِنَحِكَ السَّنِيَّةْ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["بِرَحْمَةٍ وَمَغْفِرَةٍ وَتُدِيمَ عَمَّنْ سِوَاكَ غِنَاهْ ❁","اللَّهُمَّ آمِنِ الرَّوْعَاتِ وَأَصْلِحِ الرُّعَاةَ وَالرَّعِيَّةْ ❁"],"transliteration":["Bi-raḥmatin wa-maghfiratin wa-tudīma ʿamman siwāka ghināh","Allāhumma āmini r-rawʿāti wa-aṣliḥi r-ruʿāta wa-r-raʿiyyah"],"translation":["With mercy and forgiveness, and grant us lasting independence from all besides You. O Allah, grant safety from all fears, and set right the leaders and the people. And magnify the reward of the one who caused this good to take place on this day and brought it about. O Allah, make this land and all the lands of Islam secure and prosperous, and grant us abundant rain whose flowing bounty spreads across the plains and their hills.",""],"isRefrain":false},{"arabic":["وَأَعْظِمِ الْأَجْرَ لِمَنْ جَعَلَ هَذَا الْخَيْرَ فِي هَذَا الْيَوْمِ وَأَجْرَاهْ ❁","اللَّهُمَّ اجْعَلْ هَذِهِ الْبَلْدَةَ وَسَائِرَ بِلَادِ الْإِسْلَامِ آمِنَةً رَخِيَّةْ ❁"],"transliteration":["wa-aʿẓimi l-ajra li-man jaʿala hādhā l-khayra fī hādhā l-yawmi wa-ajrāh","Allāhumma-jʿal hādhihi l-baldata wa-sā'ira bilādi al-islāmi āminatan rakhiyyah"],"translation":["",""],"isRefrain":false},{"arabic":["وَاسْقِنَا غَيْثًا يَعُمُّ انْسِيَابُ سَيْبِهِ السَّبْسَبَ وَرُبَاهْ ❁"],"transliteration":["wa-s-qinā ghaythan yaʿummu nsiyābu saybihi s-sabsaba wa-rubāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَاغْفِرْ لِنَاسِخِ هَذِهِ الْبُرُودِ الْمُحْبَّرَةِ الْمَوْلِدِيَّةْ ❁","جَعْفَرِ مَنْ إِلَى الْبَرْزَنْجِيِّ نِسْبَتُهُ وَمُنْتَمَاهْ ❁"],"transliteration":["Wa-ghfir li-nāsikhi hādhihi l-burūdi l-muḥabbarati l-mawlidiyyah","Jaʿfar man ilā l-barzanjiyyi nisbatuhu wa-muntamāh"],"translation":["And forgive the author of this beautifully adorned Mawlid, Ja'far, whose lineage and affiliation are to al-Barzanji. Grant him the triumph of nearness to You and the fulfilment of his hopes and aspirations. Make his resting place and abode among those brought near to You. Conceal his faults, his weakness, his limitations, and his inability to express himself.",""],"isRefrain":false},{"arabic":["وَحَقِّقْ لَهُ الْفَوْزَ بِقُرْبِكَ وَالرَّجَاءَ وَالْأُمْنِيَّةْ ❁","وَاجْعَلْ مَعَ الْمُقَرَّبِينَ مَقِيلَهُ وَسُكْنَاهْ ❁"],"transliteration":["wa-ḥaqqiq lahu l-fawza bi-qurbika wa-r-rajā'a wa-l-umniyyah","wa-jʿal maʿa l-muqarrabīna maqīlahu wa-suknāh"],"translation":["",""],"isRefrain":false},{"arabic":["وَاسْتُرْ لَهُ عَيْبَهُ وَعَجْزَهُ وَحَصْرَهُ وَعِيَّهْ ❁"],"transliteration":["wa-s-tur lahu ʿaybahu wa-ʿajzahu wa-ḥaṣrahu wa-ʿiyyah.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَلِكَاتِبِهَا وَقَارِئِهَا وَمَنْ أَصَاخَ إِلَيْهَا سَمْعَهُ وَأَصْغَاهْ ❁","وَصَلِّ اللَّهُمَّ عَلَى أَوَّلِ قَابِلٍ لِلتَّجَلِّي مِنَ الْحَقِيقَةِ الْكُلِّيَّةْ ❁"],"transliteration":["Wa-li-kātibihā wa-qāri'ihā wa-man aṣākha ilayhā samʿahu wa-aṣghāh","wa-ṣalli Llāhumma ʿalā awwali qābilin li-t-tajallī mina l-ḥaqīqati l-kulliyyah"],"translation":["And forgive its writer, its reader, and whoever lends his ear to it and listens attentively. O Allah, send prayers upon the first to receive the manifestation from the Universal Reality, and upon his family, his Companions, and all who supported him and showed him loyalty, for as long as ears are adorned with jewelled earrings fashioned from his pearl-like description, and the foremost places of noble gatherings are adorned with necklaces of his beautiful qualities.",""],"isRefrain":false},{"arabic":["وَعَلَى آلِهِ وَصَحْبِهِ وَمَنْ نَصَرَهُ وَوَالَاهْ ❁","مَا شُنِّفَتِ الْآذَانُ مِنْ وَصْفِهِ الدُّرِّيِّ بِأَقْرَاطٍ جَوْهَرِيَّةْ ❁"],"transliteration":["wa-ʿalā ālihi wa-ṣaḥbihi wa-man naṣarahu wa-wālāh","mā shunnifati l-ādhānu min waṣfihi d-durriyyi bi-aqrāṭin jawhariyyah"],"translation":["",""],"isRefrain":false},{"arabic":["وَتَحَلَّتْ صُدُورُ الْمَحَافِلِ الْمُنِيفَةِ بِعُقُودِ حُلَاهْ ❁"],"transliteration":["wa-taḥallat ṣudūru l-maḥāfili l-munīfati bi-ʿuqūdi ḥulāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَأَفْضَلُ الصَّلَاةِ وَأَتَمُّ التَّسْلِيمِ عَلَى سَيِّدِنَا وَمَوْلَانَا مُحَمَّدٍ خَاتَمِ الْأَنْبِيَاءِ وَالْمُرْسَلِينَ ❁","وَعَلَى آلِهِ وَصَحْبِهِ أَجْمَعِينَ ❁"],"transliteration":["Wa-afḍalu ṣ-ṣalāti wa-atammu t-taslīmi ʿalā sayyidinā wa-mawlānā Muḥammadin khātami l-anbiyā'i wa-l-mursalīna, wa-ʿalā ālihi wa-ṣaḥbihi ajmaʿīna, ﴾subḥāna Rabbika Rabbi l-ʿizzati ʿammā yaṣifūna, wa-salāmun ʿalā l-mursalīna wa-l-ḥamdu li-Llāhi Rabbi l-ʿālamīn.﴿",""],"translation":["And the finest prayers and most complete peace be upon our master and patron Muhammad, the Seal of the Prophets and Messengers, and upon all his family and Companions. “Glory be to your Lord, the Lord of Might, above what they ascribe. And peace be upon the Messengers. And all praise is for Allah, Lord of the Worlds.” (al-Saffat, 37:180–182)",""],"isRefrain":false},{"arabic":["﴿سُبْحَـٰنَ رَبِّكَ رَبِّ ٱلْعِزَّةِ عَمَّا يَصِفُونَ ❁","وَسَلَـٰمٌ عَلَى ٱلْمُرْسَلِينَ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["وَٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَـٰلَمِينَ ❁","﴾ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false}]}];

const waitingScreen = document.getElementById('waitingScreen');
const qasidahDisplay = document.getElementById('qasidahDisplay');
const qasidahTitle = document.getElementById('qasidahTitle');
const qasidahSubtitle = document.getElementById('qasidahSubtitle');
const coupletsContainer = document.getElementById('coupletsContainer');
const transToggle = document.getElementById('transToggle');
const translationToggle = document.getElementById('translationToggle');

let showTransliteration = true;
let showTranslation = true;

transToggle.addEventListener('click', () => {
  showTransliteration = !showTransliteration;
  transToggle.classList.toggle('active', showTransliteration);
  updateLayersVisibility();
});

translationToggle.addEventListener('click', () => {
  showTranslation = !showTranslation;
  translationToggle.classList.toggle('active', showTranslation);
  updateLayersVisibility();
});

function updateLayersVisibility() {
  const transOpacity = showTransliteration ? 1 : 0;
  const translationOpacity = showTranslation ? 1 : 0;

  document.querySelectorAll('.transliteration-lines').forEach(el => {
    el.style.opacity = transOpacity;
    el.style.pointerEvents = showTransliteration ? 'auto' : 'none';
  });

  document.querySelectorAll('.translation-lines').forEach(el => {
    el.style.opacity = translationOpacity;
    el.style.pointerEvents = showTranslation ? 'auto' : 'none';
  });
}

function renderQasidah(qasidahIndex) {
  if (qasidahIndex < 0 || qasidahIndex >= qasidahs.length) {
    waitingScreen.classList.add('show');
    qasidahDisplay.classList.remove('show');
    return;
  }

  const qasidah = qasidahs[qasidahIndex];

  waitingScreen.classList.remove('show');
  qasidahDisplay.classList.add('show');

  qasidahTitle.textContent = qasidah.title;
  qasidahSubtitle.textContent = qasidah.englishTitle;

  // Clear and rebuild couplets container
  coupletsContainer.innerHTML = '';

  qasidah.couplets.forEach((couplet) => {
    const section = document.createElement('div');
    section.className = 'couplet-section';

    const arabicDiv = document.createElement('div');
    arabicDiv.className = 'arabic-lines';
    arabicDiv.innerHTML = couplet.arabic.map(line => `<div class="line">${line}</div>`).join('');

    const translitDiv = document.createElement('div');
    translitDiv.className = 'transliteration-lines';
    translitDiv.innerHTML = couplet.transliteration.map(line => `<div class="line">${line}</div>`).join('');

    const translationDiv = document.createElement('div');
    translationDiv.className = 'translation-lines';
    translationDiv.innerHTML = couplet.translation.map(line => `<div class="line">${line}</div>`).join('');

    section.appendChild(arabicDiv);
    section.appendChild(translitDiv);
    section.appendChild(translationDiv);

    coupletsContainer.appendChild(section);
  });

  // Apply current visibility settings to new content
  updateLayersVisibility();

  // Auto-scroll to top
  window.scrollTo(0, 0);
}

// Listen for changes from Firebase (qasidahIndex only)
onValue(ref(db, 'mawlid/qasidahIndex'), (snap) => {
  const qasidahIndex = snap.val() ?? -1;
  renderQasidah(qasidahIndex);
});
</script>
</body>
</html>
