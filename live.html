 fear.",""],"isRefrain":false},{"arabic":["وَبُشِّرَتِ الْجِنُّ بِإِظْلَالِ زَمَنِهِ وَانْتُهِكَتِ الْكَهَانَةْ ❁","وَرَهِبَتِ الرَّهْبَانِيَّةْ ❁"],"transliteration":["wa-bush-shirati l-jinnu bi-iẓlāli zamanihi wa-ntuhikati l-kahānah","wa-rahibati r-rahbāniyyah."],"translation":["",""],"isRefrain":false},{"arabic":["وَلَهِجَ بِخَبَرِهِ كُلُّ حَبْرٍ خَبِيرٍ وَفِي حُلَا حُسْنِهِ تَاهْ ❁","وَأُتِيَتْ أُمُّهُ فِي الْمَنَامِ فَقِيلَ لَهَا: إِنَّكِ قَدْ حَمَلْتِ بِسَيِّدِ الْعَالَمِينَ وَخَيْرِ الْبَرِيَّةْ ❁"],"transliteration":["Wa-lahija bi-khabarihi kullu ḥabrin khabīrin wa-fī ḥulā ḥusnihi tāh","wa-ūtiyat ummuhu fī l-manāmi fa-qīla lahā: innaki qad ḥamalti bi-sayyidi l-ʿālamīna wa-khayri l-bariyyah"],"translation":["Every learned sage spoke eagerly of his news and was lost in wonder at the adornments of his beauty. His mother was visited in a dream and told, “You are carrying the Master of the Worlds and the best of creation. When you give birth to him, name him Muhammad, for his outcome shall be praised.”",""],"isRefrain":false},{"arabic":["فَسَمِّيهِ إِذَا وَضَعْتِيهِ مُحَمَّدًا فَإِنَّهُ سَتُحْمَدُ عُقْبَاهْ ❁"],"transliteration":["fa-sammīhi idhā waḍaʿtīhi Muḥammadan fa-innahu sa-tuḥmadu ʿuqbāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["عَطِّرِ اللَّهُمَّ قَبْرَهُ الْكَرِيمَ بِعَرْفٍ شَذِيٍّ مِنْ صَلَاةٍ وَتَسْلِيمٍ ❁","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَيْهِ ❁"],"transliteration":["ʿAṭṭiri Llāhumma qabrahu l-karīma bi-ʿarfin shadhiyyin min ṣalātin wa-taslīmin. Allāhumma ṣalli wa-sallim wa-bārik ʿalayhi.",""],"translation":["O Allah, perfume his noble grave with a fragrant scent of prayers and peace. O Allah, send prayers, peace, and blessings upon him.",""],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: The Birth of the Prophet ﷺ","englishTitle":"Mawlid al-Barzanji: The Birth of the Prophet ﷺ","couplets":[{"arabic":["وَلَمَّا تَمَّ مِنْ حَمْلِهِ شَهْرَانِ عَلَى مَشْهُورِ الْأَقْوَالِ الْمَرْوِيَّةْ ❁","تُوُفِّيَ بِالْمَدِينَةِ الْمُنَوَّرَةِ أَبُوهُ عَبْدُ اللهْ ❁"],"transliteration":["Wa-lammā tamma min ḥamlihi shahrāni ʿalā mash-hūri l-aqwāli l-marwiyyah","tuwūffiya bi-l-Madīnati l-Munawwarati abūhu ʿAbdu Llāh"],"translation":["When two months of the pregnancy had passed, according to the most widely reported account, his father Abd Allah passed away in al-Madinah al-Munawwarah. He had stopped with his maternal relatives, the Banu Adiyy of the Najjar clan, and remained among them for a month while ill, as they tended to his sickness and suffering.",""],"isRefrain":false},{"arabic":["وَكَانَ قَدِ اجْتَازَ بِأَخْوَالِهِ بَنِي عَدِيٍّ مِنَ الطَّائِفَةِ النَّجَّارِيَّةْ ❁","وَمَكَثَ فِيهِمْ شَهْرًا سَقِيمًا يُعَانُونَ سُقْمَهُ وَشَكْوَاهْ ❁"],"transliteration":["wa-kāna qadi ijtāza bi-akhwālihi banī ʿadiyyin mina ṭ-ṭā'ifati n-Najjāriyyah","wa-makatha fīhim shahran saqīman yuʿānūna suqmahu wa-shakwāh."],"translation":["",""],"isRefrain":false},{"arabic":["وَلَمَّا تَمَّ مِنْ حَمْلِهِ عَلَى الرَّاجِحِ تِسْعَةُ أَشْهُرٍ قَمَرِيَّةْ ❁","وَآنَ لِلزَّمَانِ أَنْ يَنْجَلِيَ عَنْهُ صَدَاهْ ❁"],"transliteration":["Wa-lammā tamma min ḥamlihi ʿalā r-rājiḥi tisʿatu ash-hurin qamariyyah","wa-āna li-z-zamāni an yanjaliya ʿanhu ṣadāh"],"translation":["When the pregnancy reached nine lunar months, according to the strongest view, and the time had come for the age to be cleared of its darkness, Asiyah and Maryam came to his mother on the night of his birth, among a company of women from the sacred assembly. Then the pangs of labour came upon her, and she gave birth to him ﷺ as a light whose radiance shone brilliantly.",""],"isRefrain":false},{"arabic":["حَضَرَ أُمَّهُ لَيْلَةَ مَوْلِدِهِ آسِيَةُ وَمَرْيَمُ فِي نِسْوَةٍ مِنَ الْحَظِيرَةِ الْقُدْسِيَّةْ ❁","وَأَخَذَهَا الْمَخَاضُ فَوَلَدَتْهُ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ نُورًا يَتَلَأْلَأُ سَنَاهْ ❁"],"transliteration":["ḥaḍara ummahu laylata mawlidihi Āsiyatu wa-Maryamu fī niswatin mina l-ḥaẓīrati l-qudsiyyah","wa-akhadhaha l-makhāḍu fa-waladat-hu ṣalla Llāhu taʿālā ʿalayhi wa-sallama nūran yatala'la'u sanāh."],"translation":["",""],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: The Standing (Qiyam)","englishTitle":"Mawlid al-Barzanji: The Standing (Qiyam)","couplets":[{"arabic":["يَا نَبِيِّ سَلَامٌ عَلَيْكَ ❁","يَا رَسُولَ سَلَامٌ عَلَيْكَ ❁"],"transliteration":["Yā nabiyyi salām ʿalayka","yā rasūla salām ʿalayka"],"translation":["O Prophet, peace be upon you. O Messenger, peace be upon you. O Beloved, peace be upon you. Allah’s prayers be upon you.",""],"isRefrain":false},{"arabic":["يَا حَبِيبَ سَلَامٌ عَلَيْكَ ❁","صَلَوَاتُ اللَّهِ عَلَيْكَ ❁"],"transliteration":["yā ḥabība salām ʿalayka","ṣalawātu Llāhi ʿalayka."],"translation":["",""],"isRefrain":false},{"arabic":["أَشْرَقَ الْبَدْرُ عَلَيْنَا ❁","فَاخْتَفَتْ مِنْهُ الْبُدُورُ ❁"],"transliteration":["Ashraqa l-badru ʿalaynā","fa-khtafat minhu l-budūru"],"translation":["The full moon has risen upon us, and all other moons have faded before it. Never have we seen beauty like yours, O face of joy.",""],"isRefrain":false},{"arabic":["مِثْلَ حُسْنِكَ مَا رَأَيْنَا ❁","قَطُّ يَا وَجْهَ السُّرُورِ ❁"],"transliteration":["mithla ḥusnika mā ra'aynā","qaṭṭu yā wajha s-surūri."],"translation":["",""],"isRefrain":false},{"arabic":["أَنْتَ شَمْسٌ أَنْتَ بَدْرٌ ❁","أَنْتَ نُورٌ فَوْقَ نُورٍ ❁"],"transliteration":["Anta shamsun anta badrun","anta nūrun fawqa nūrin"],"translation":["You are a sun, you are a full moon, you are light upon light, you are a precious elixir, you are the lamp of hearts.",""],"isRefrain":false},{"arabic":["أَنْتَ إِكْسِيرٌ وَغَالِي ❁","أَنْتَ مِصْبَاحُ الصُّدُورِ ❁"],"transliteration":["anta iksīrun wa-ghālī","anta miṣbāḥu ṣ-ṣudūri."],"translation":["",""],"isRefrain":false},{"arabic":["يَا حَبِيبِي يَا مُحَمَّدُ ❁","يَا عَرُوسَ الْخَافِقَيْنِ ❁"],"transliteration":["Yā ḥabībī yā Muḥammadu","yā ʿarūsa l-khāfiqayni"],"translation":["O my beloved, O Muhammad, O bridegroom of the two horizons. O you who are supported, O you who are glorified, O leader of the two qiblas.",""],"isRefrain":false},{"arabic":["يَا مُؤَيَّدُ يَا مُمَجَّدُ ❁","يَا إِمَامَ الْقِبْلَتَيْنِ ❁"],"transliteration":["yā mu'ayyadu yā mumajjadu","yā imāma l-qiblatayni."],"translation":["",""],"isRefrain":false},{"arabic":["مَنْ رَأَى وَجْهَكَ يَسْعَدْ ❁","يَا كَرِيمَ الْوَالِدَيْنِ ❁"],"transliteration":["Man ra'ā wajhaka yasʿad","yā karīma l-wālidayni"],"translation":["Whoever sees your face finds happiness, O noble son of noble parents, may we come to your pure, refreshing Basin on the Day of Resurrection.",""],"isRefrain":false},{"arabic":["حَوْضُكَ الصَّافِي فِي الْمُبْرَدِ ❁","وَرَدْنَا يَوْمَ النُّشُورِ ❁"],"transliteration":["ḥawḍuka ṣ-ṣāfī fī l-mubarradi","waradnā yawma n-nushūr."],"translation":["",""],"isRefrain":false},{"arabic":["مَا رَأَيْنَا الْعِيسَ حَنَّتْ ❁","بِالسُّرَى إِلَّا إِلَيْكَ ❁"],"transliteration":["Mā ra'aynā l-ʿīsa ḥannat","bi-s-surā illā ilayka"],"translation":["Never have we seen the camels yearn through the night except towards you, and the cloud indeed shaded you, and the heavenly assembly sent prayers upon you.",""],"isRefrain":false},{"arabic":["وَالْغَمَامَةُ قَدْ أَظَلَّتْ ❁","وَالْمَلَا صَلَّوْا عَلَيْكَ ❁"],"transliteration":["wa-l-ghamāmatu qad aẓallat","wa-l-malā ṣallaw ʿalayka."],"translation":["",""],"isRefrain":false},{"arabic":["وَأَتَاكَ الْعُودُ يَبْكِي ❁","وَتَذَلَّلَ بَيْنَ يَدَيْكَ ❁"],"transliteration":["Wa-atāka l-ʿūdu yabkī","wa-tadhallala bayna yadayka"],"translation":["The tree trunk came to you weeping and humbled itself before you, and the timid gazelle sought refuge with you, O my beloved.",""],"isRefrain":false},{"arabic":["وَاسْتَجَارَتْ يَا حَبِيبِي ❁","عِنْدَكَ الظَّبْيُ النُّفُورُ ❁"],"transliteration":["wa-stajarāt yā ḥabībī","ʿindaka ẓ-ẓabyu n-nufūru."],"translation":["",""],"isRefrain":false},{"arabic":["عِنْدَمَا شَدُّوا الْمَحَامِلَ ❁","وَتَنَادَوْا لِلرَّحِيلِ ❁"],"transliteration":["ʿIndamā shaddū l-maḥāmila","wa-tanādaw li-l-raḥīli"],"translation":["When they secured their litters and called out to depart, I came to them with tears flowing and said, “Wait for me, O guide.",""],"isRefrain":false},{"arabic":["جِئْتُهُمْ وَالدَّمْعُ سَائِلٌ ❁","قُلْتُ قِفْ لِي يَا دَلِيلُ ❁"],"transliteration":["ji'tuhum wa-d-damʿu sā'ilun","qultu qif lī yā dalīlu."],"translation":["",""],"isRefrain":false},{"arabic":["وَتَحْمِلُ لِي رَسَائِلَ ❁","أَيُّهَا الشَّوْقُ الْجَزِيلُ ❁"],"transliteration":["Wa-taḥmilu lī rasā'ila","ayyuha sh-shawqu l-jazīlu"],"translation":["And carry messages for me, O great longing, To those distant dwellings, in the evening and at dawn.”",""],"isRefrain":false},{"arabic":["نَحْوَ هَاتِيكَ الْمَنَازِلِ ❁","فِي الْعَشِيِّ وَالْبُكُورِ ❁"],"transliteration":["naḥwa hātīka l-manāzili","fī l-ʿashiyyi wa-l-bukūri."],"translation":["",""],"isRefrain":false},{"arabic":["كُلُّ مَنْ فِي الْكَوْنِ هَامُوا ❁","فِيكَ يَا بَاهِيَ الْجَبِينِ ❁"],"transliteration":["Kullu man fī l-kawni hāmū","fīka yā bāhiya l-jabīni"],"translation":["All who dwell within creation are enraptured by you, O you whose brow is radiant, and for you they bear a passionate love, a longing and a yearning.",""],"isRefrain":false},{"arabic":["وَلَهُمْ فِيكَ غَرَامٌ ❁","وَاشْتِيَاقٌ وَحَنِينٌ ❁"],"transliteration":["wa-lahum fīka gharāmun","wa-shtiyāqun wa-ḥanīnun."],"translation":["",""],"isRefrain":false},{"arabic":["فِي مَعَانِيكَ الْأَنَامُ ❁","قَدْ تَبَدَّتْ حَائِرِينَ ❁"],"transliteration":["Fī maʿānīka l-anāmu","qad tabaddat ḥā'irīna"],"translation":["Before your sublime qualities, all people stand bewildered. You are the Seal of the Messengers, and ever grateful to the Lord.",""],"isRefrain":false},{"arabic":["أَنْتَ لِلرُّسُلِ خِتَامٌ ❁","أَنْتَ لِلْمَوْلَى شَكُورٌ ❁"],"transliteration":["anta li-r-rusuli khitāmun","anta li-l-mawlā shakūrun."],"translation":["",""],"isRefrain":false},{"arabic":["عَبْدُكَ الْمِسْكِينُ يَرْجُو ❁","فَضْلَكَ الْجَمَّ الْغَفِيرَ ❁"],"transliteration":["ʿAbduka l-miskīnu yarjū","faḍlaka l-jamma l-ghafīra"],"translation":["Your poor servant hopes for your immense and abundant grace, and I have placed my good expectations in you, O bearer of glad tidings, O warner.",""],"isRefrain":false},{"arabic":["فِيكَ قَدْ أَحْسَنْتُ ظَنِّي ❁","يَا بَشِيرُ يَا نَذِيرُ ❁"],"transliteration":["fīka qad aḥsantu ẓannī","yā bashīru yā nadhīru."],"translation":["",""],"isRefrain":false},{"arabic":["فَأَغِثْنِي وَأَجِرْنِي ❁","يَا مُجِيرَ مِنَ السَّعِيرِ ❁"],"transliteration":["Fa-aghithnī wa-ajirnī","yā mujīra mina s-saʿīri"],"translation":["So come to my aid and grant me refuge, O protector from the Blazing Fire, O my aid, O my refuge in the most pressing of affairs.",""],"isRefrain":false},{"arabic":["يَا غِيَاثِي يَا مَلَاذِي ❁","فِي مُهِمَّاتِ الْأُمُورِ ❁"],"transliteration":["yā ghiyāthī yā malādhī","fī muhimmāti l-umūri."],"translation":["",""],"isRefrain":false},{"arabic":["سَعِدَ عَبْدٌ قَدْ تَمَلَّى ❁","وَانْجَلَى عَنْهُ الْحَزِينُ ❁"],"transliteration":["Saʿida ʿabdun qad tamallā","wanjalā ʿanhu l-ḥazīnu"],"translation":["Blessed is the servant who has drunk his fill, and whose sorrow has departed. In you, O full moon, splendour has manifested, and yours is the beautiful description.",""],"isRefrain":false},{"arabic":["فِيكَ يَا بَدْرُ تَجَلَّى ❁","فَلَكَ الْوَصْفُ الْحَسِينُ ❁"],"transliteration":["fīka yā badru tajallā","falaka l-waṣfu l-ḥasīnu."],"translation":["",""],"isRefrain":false},{"arabic":["لَيْسَ أَزْكَى مِنْكَ أَصْلًا ❁","قَطُّ يَا جِدَّ الْحُسَيْنِ ❁"],"transliteration":["Laysa azkā minka aṣlan","qaṭṭu yā jidda l-Ḥusayni"],"translation":["None is purer than you in lineage, O grandfather of al-Husayn, and may Allah send prayers upon you always, throughout the ages.",""],"isRefrain":false},{"arabic":["فَعَلَيْكَ اللَّهُ صَلَّى ❁","دَائِمًا طُولَ الدُّهُورِ ❁"],"transliteration":["fa-ʿalayka Llāhu ṣallā","dā'iman ṭūla d-duhūri."],"translation":["",""],"isRefrain":false},{"arabic":["يَا وَلِيَّ الْحَسَنَاتِ ❁","يَا رَفِيعَ الدَّرَجَاتِ ❁"],"transliteration":["Yā waliyyā l-ḥasanāti","yā rafīʿa d-darajāti"],"translation":["O Guardian of good deeds, O Exalted in rank, remove my sins from me, and forgive me my misdeeds.",""],"isRefrain":false},{"arabic":["كَفِّرْ عَنِّي الذُّنُوبَ ❁","وَاغْفِرْ عَنِّي السَّيِّئَاتِ ❁"],"transliteration":["kaffir ʿannī dh-dhunūba","waghfir ʿannī s-sayyi'āti."],"translation":["",""],"isRefrain":false},{"arabic":["أَنْتَ عَفَّارُ الْخَطَايَا ❁","وَالذُّنُوبِ الْمُحْرِقَاتِ ❁"],"transliteration":["Anta ʿaffāru l-khaṭāyā","wa-dh-dhunūbi l-muḥriqāti"],"translation":["You are the Great Forgiver of faults and of sins that burn, and You are the Concealer of shortcomings and the Pardoner of slips.",""],"isRefrain":false},{"arabic":["أَنْتَ سِتَّارُ الْمَسَاوِي ❁","وَمُقِيلُ الْعَثَرَاتِ ❁"],"transliteration":["Anta sittāru l-masāwī","wa-muqīlu l-ʿatharāti."],"translation":["",""],"isRefrain":false},{"arabic":["عَالِمُ السِّرِّ وَالْخَفَى ❁","مُسْتَجِيبُ الدَّعَوَاتِ ❁"],"transliteration":["ʿĀlimu s-sirri wa-l-khafā","mustajību d-daʿawāti"],"translation":["Knower of the secret and the hidden, Responder to supplications, O Lord, have mercy upon us all through every righteous deed.",""],"isRefrain":false},{"arabic":["رَبِّ فَارْحَمْنَا جَمِيعًا ❁","بِجَمِيعِ الصَّالِحَاتِ ❁"],"transliteration":["Rabbi farḥamnā jamīʿan","bi-jamīʿi ṣ-ṣāliḥāti."],"translation":["",""],"isRefrain":false},{"arabic":["وَمُحَيًّا كَالشَّمْسِ مِنْكَ مُضِيءٌ أَسْفَرَتْ عَنْهُ لَيْلَةٌ غَرَّاءُ ❁","لَيْلَةُ الْمَوْلِدِ الَّذِي كَانَ لِلدِّينِ سُرُورٌ بِيَوْمِهِ وَازْدِهَاءُ ❁"],"transliteration":["Wa-muḥayyan ka-sh-shamsi minka muḍī'un asfarat ʿanhu laylatun gharrā'u laylatu l-mawlidi lladhī kāna li-d-dīni surūrun bi-yawmihi wa-zdihā'u yawma nālat bi-waḍʿihi-bnatu Wahbin min fakhārin mā lam tanalhu n-nisā'u, wa-atat qawmahā bi-afḍala mimmā ḥamalat qablu Maryamu l-ʿadhrā'u, mawlidun kāna minhu fī ṭāliʿi l-kufri wabālun ʿalayhum wa-wabā'u.",""],"translation":["And from you came a countenance radiant like the sun, unveiled by a resplendent night, the night of the Birth, whose day brought joy and splendour to the religion. On that day, through giving birth to him, the daughter of Wahb attained an honour that no woman had ever attained, and she brought to her people one more excellent than he whom Maryam the Virgin had borne before, a birth whose rising brought calamity and affliction upon disbelief.",""],"isRefrain":false},{"arabic":["يَوْمَ نَالَتْ بِوَضْعِهِ ابْنَةُ وَهْبٍ مِنْ فَخَارٍ مَا لَمْ تَنَلْهُ النِّسَاءُ ❁","وَأَتَتْ قَوْمَهَا بِأَفْضَلَ مِمَّا حَمَلَتْ قَبْلُ مَرْيَمُ الْعَذْرَاءُ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["مَوْلِدٌ كَانَ مِنْهُ فِي طَالِعِ الْكُفْرِ وَبَالٌ عَلَيْهُمْ وَوَبَاءُ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["وَتَوَالَتْ بُشْرَى الْهَوَاتِفِ أَنْ قَدْ وُلِدَ الْمُصْطَفَى وَحَقَّ الْهَنَاءُ ❁","هَذَا وَقَدِ اسْتَحْسَنَ الْقِيَامَ عِنْدَ ذِكْرِ مَوْلِدِهِ الشَّرِيفِ أَئِمَّةٌ ذَوُو رِوَايَةٍ وَرَوِيَّةْ ❁"],"transliteration":["Wa-tawālat bushra l-hawātifi an qad wulida l-Muṣṭafā wa-ḥaqqa l-hanā'u","hādhā wa-qadi-s-taḥsana l-qiyāma ʿinda dhikri mawlidihi sh-sharīfi a'immatun dhawū riwāyatin wa-rawiyyah"],"translation":["And the glad tidings of the voices followed one after another, proclaiming that the Chosen One had indeed been born and that the time for rejoicing had truly come. Leading scholars endowed with sound transmission and considered judgement have deemed it commendable to stand at the mention of his noble birth. So blessed is the one whose ultimate aim and aspiration is to honour him, may Allah Most High send prayers and peace upon him.",""],"isRefrain":false},{"arabic":["فَطُوبَى لِمَنْ كَانَ تَعْظِيمُهُ صَلَّى اللَّهُ عَلَيْهِ تَعَالَى وَسَلَّمَ غَايَةَ مَرَامِهِ وَمَرْمَاهْ ❁"],"transliteration":["fa-ṭūba li-man kāna taʿẓīmuhu ṣalla Llāhu ʿalayhi taʿālā wa-sallama ghāyata marāmihi wa-marmāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["عَطِّرِ اللَّهُمَّ قَبْرَهُ الْكَرِيمَ بِعَرْفٍ شَذِيٍّ مِنْ صَلَاةٍ وَتَسْلِيمٍ ❁","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَيْهِ ❁"],"transliteration":["ʿAṭṭiri Llāhumma qabrahu l-karīma bi-ʿarfin shadhiyyin min ṣalātin wa-taslīmin. Allāhumma ṣalli wa-sallim wa-bārik ʿalayhi.",""],"translation":["O Allah, perfume his noble grave with a fragrant scent of prayers and peace. O Allah, send prayers, peace, and blessings upon him.",""],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: The Newborn Prophet ﷺ","englishTitle":"Mawlid al-Barzanji: The Newborn Prophet ﷺ","couplets":[{"arabic":["وَبَرَزَ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ وَاضِعًا يَدَيْهِ عَلَى الْأَرْضِ رَافِعًا رَأْسَهُ إِلَى السَّمَاءِ الْعَلِيَّةْ ❁","مُومِيًا بِذَلِكَ الرَّفْعِ إِلَى سُؤْدَدِهِ وَعُلَاهْ ❁"],"transliteration":["Wa-baraza ṣalla Llāhu taʿālā ʿalayhi wa-sallama wāḍiʿan yadayhi ʿalā l-arḍi rāfiʿan ra'sahu ilā s-samā'i l-ʿaliyyah","mūmiyan bi-dhālika r-rafʿi ilā su'dadihi wa-ʿulāh"],"translation":["He, may Allah Most High send prayers and peace upon him, emerged with his hands placed upon the earth and his head raised towards the lofty heavens, alluding through this raising to his nobility and exalted rank, and indicating the loftiness of his station above all creation, and that he is the Beloved whose nature and character are beautiful. His mother then called for Abd al-Muttalib while he was circumambulating that Sacred House.",""],"isRefrain":false},{"arabic":["وَمُشِيرًا إِلَى رِفْعَةِ قَدْرِهِ عَلَى سَائِرِ الْبَرِيَّةْ ❁","وَأَنَّهُ الْحَبِيبُ الَّذِي حَسُنَتْ طِبَاعُهُ وَسَجَايَاهْ ❁"],"transliteration":["wa-mushīran ilā rifʿati qadrihi ʿalā sā'iri l-bariyyah","wa-annahu l-ḥabību lladhī ḥasunat ṭibāʿuhu wa-sajāyāh"],"translation":["",""],"isRefrain":false},{"arabic":["وَدَعَتْ أُمُّهُ عَبْدَ الْمُطَّلِبِ وَهُوَ يَطُوفُ بِهَاتِيكَ الْبَنِيَّةْ ❁"],"transliteration":["wa-daʿat ummuhu ʿabda l-Muṭṭalibi wa-huwa yaṭūfu bi-hātīka l-baniyyah.",""],"translation":["",""],"isRefrain":false},{"arabic":["فَأَقْبَلَ مُسْرِعًا وَنَظَرَ إِلَيْهِ وَبَلَغَ مِنَ السُّرُورِ مُنَاهْ ❁","وَأَدْخَلَهُ الْكَعْبَةَ الْغَرَّاءَ وَقَامَ يَدْعُو بِخُلُوصِ النِّيَّةْ ❁"],"transliteration":["Fa-aqbala musriʿan wa-naẓara ilayhi wa-balagha mina s-surūri munāh","wa-adkhalahu l-kaʿbata l-gharrā'a wa-qāma yadʿū bi-khulūṣi n-niyyah"],"translation":["And he came quickly, looked upon him, and attained the fullness of his joy. He took him into the radiant Ka'bah and stood supplicating with sincere intention, and thanking Allah Most High for what He had graciously bestowed upon him and given him. And he, may Allah Most High send prayers and peace upon him, was born clean, circumcised, and with his umbilical cord severed by the hand of Divine Power.",""],"isRefrain":false},{"arabic":["وَيَشْكُرُ اللَّهَ تَعَالَى عَلَى مَا مَنَّ بِهِ عَلَيْهِ وَأَعْطَاهْ ❁","وَوُلِدَ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ نَظِيفًا مَخْتُونًا مَقْطُوعَ السُّرِّ بِيَدِ الْقُدْرَةِ الْإِلَـٰهِيَّةْ ❁"],"transliteration":["wa-yash-kuru Llāha taʿālā ʿalā mā manna bihi ʿalayhi wa-aʿṭāh","wa-wulida ṣalla Llāhu taʿālā ʿalayhi wa-sallama naẓīfan makhtūnan maqṭūʿa s-surri bi-yadi l-qudrati l-ilāhiyyah."],"translation":["",""],"isRefrain":false},{"arabic":["طَيِّبًا دَهِينًا مَكْحُولَةً بِكُحْلِ الْعِنَايَةِ عَيْنَاهْ ❁","وَقِيلَ خَتَنَهُ جَدُّهُ بَعْدَ سَبْعِ لَيَالٍ سَوِيَّةْ ❁"],"transliteration":["Ṭayyiban dahīnan makḥūlatan bi-kuḥli l-ʿināyati ʿaynāh","wa-qīla khatanahu jadduhu baʿda sabʿi layālin sawiyyah"],"translation":["Fragrant and anointed, with his eyes lined with the kohl of Divine Care. And it is said that his grandfather circumcised him after seven full nights, held a feast and fed the people, named him Muhammad, and honoured his abode.",""],"isRefrain":false},{"arabic":["وَأَوْلَمَ وَأَطْعَمَ وَسَمَّاهُ مُحَمَّدًا وَأَكْرَمَ مَثْوَاهْ ❁"],"transliteration":["wa-awlama wa-aṭʿama wa-sammāhu Muḥammadan wa-akrama mathwāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["عَطِّرِ اللَّهُمَّ قَبْرَهُ الْكَرِيمَ بِعَرْفٍ شَذِيٍّ مِنْ صَلَاةٍ وَتَسْلِيمٍ ❁","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَيْهِ ❁"],"transliteration":["ʿAṭṭiri Llāhumma qabrahu l-karīma bi-ʿarfin shadhiyyin min ṣalātin wa-taslīmin. Allāhumma ṣalli wa-sallim wa-bārik ʿalayhi.",""],"translation":["O Allah, perfume his noble grave with a fragrant scent of prayers and peace. O Allah, send prayers, peace, and blessings upon him.",""],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: The Signs and Miracles of His Blessed Birth ﷺ","englishTitle":"Mawlid al-Barzanji: The Signs and Miracles of His Blessed Birth ﷺ","couplets":[{"arabic":["وَظَهَرَ عِنْدَ وَلَادَتِهِ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ خَوَارِقُ وَغَرَائِبُ غَيْبِيَّةْ ❁","إِرْهَاصًا لِنُبُوَّتِهِ وَإِعْلَامًا بِأَنَّهُ مُخْتَارُ اللَّهِ تَعَالَى وَمُجْتَبَاهْ ❁"],"transliteration":["Wa-ẓahara ʿinda wilādatihi ṣalla Llāhu taʿālā ʿalayhi wa-sallama khawāriqu wa-gharā'ibu ghaybiyyah","irhāṣan li-nubuwwatihi wa-iʿlāman bi-annahu mukhtāru Llāhi taʿālā wa-mujtabāh"],"translation":["At his birth, may Allah Most High send prayers and peace upon him, extraordinary wonders and unseen marvels appeared as signs heralding his Prophethood and proclaiming that he was the one chosen and elected by Allah Most High. And the heavens were further guarded, and the rebellious ones and those of satanic souls were driven away from them, and the radiant stars pelted every accursed one as he attempted to ascend.",""],"isRefrain":false},{"arabic":["فَزِيدَتِ السَّمَاءُ حِفْظًا وَرُدَّ عَنْهَا الْمَرَدَةُ وَذَوُو النُّفُوسِ الشَّيْطَانِيَّةْ ❁","وَرَجَمَتْ نُجُومُ النَّيِّرَاتِ كُلَّ رَجِيمٍ فِي حَالِ مَرْقَاهْ ❁"],"transliteration":["fa-zīdati s-samā'u ḥifẓan wa-rudda ʿanha l-maradatu wa-dhawū n-nufūsi sh-shayṭāniyyah","wa-rajamat nujūmu n-nayyirāti kulla rajīmin fī ḥāli marqāh."],"translation":["",""],"isRefrain":false},{"arabic":["وَتَدَلَّتْ إِلَيْهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ الْأَنْجُمُ الزُّهْرِيَّةْ ❁","وَاسْتَنَارَتْ بِنُورِهَا وِهَادُ الْحَرَمِ وَرُبَاهْ ❁"],"transliteration":["Wa-tadallat ilayhi ṣalla Llāhu ʿalayhi wa-sallama l-anjumu z-zuhriyyah","wa-s-tanārat bi-nūrihā wihādu l-ḥarami wa-rubāh"],"translation":["The radiant stars drew near to him, may Allah send prayers and peace upon him, and by their light the valleys and hills of the Sacred Sanctuary were illuminated. With him, may Allah send prayers and peace upon him, came forth a light by which the imperial palaces of Syria were illuminated, and they were seen by those whose homes and dwellings were in the plains of Makkah. And the imperial palace at al-Mada'in was split apart, whose lofty structure Anushirwan had raised and fashioned.",""],"isRefrain":false},{"arabic":["وَخَرَجَ مَعَهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نُورٌ أَضَاءَتْ لَهُ قُصُورُ الشَّامِ الْقَيْصَرِيَّةْ ❁","فَرَآهَا مَنْ بِطَاحُ مَكَّةَ دَارُهُ وَمَغْنَاهْ ❁"],"transliteration":["wa-kharaja maʿahu ṣalla Llāhu ʿalayhi wa-sallama nūrun aḍā'at lahu quṣūru sh-shāmi l-qayṣariyyah","fa-rāhā man biṭāḥu makkata dāruhu wa-maghnāh"],"translation":["",""],"isRefrain":false},{"arabic":["وَانْصَدَعَ الْإِيوَانُ بِالْمَدَائِنِ الْكِسْرَوِيَّةْ ❁","الَّذِي رَفَعَ أَنُوشَرْوَانَ سَمْكَهُ وَسَوَّاهْ ❁"],"transliteration":["wa-n-ṣadaʿa l-īwānu bi-l-Madā'ini l-kisrawiyyah","alladhī rafaʿa Anūsharwāna samkahu wa-sawwāh."],"translation":["",""],"isRefrain":false},{"arabic":["وَسَقَطَ أَرْبَعٌ وَعَشْرٌ مِنْ شُرُفَاتِهِ الْعُلْوِيَّةْ ❁","وَكُسِرَ سَرِيرُ الْمَلِكِ كِسْرَى لِهَوْلِ مَا أَصَابَهُ وَعَرَاهْ ❁"],"transliteration":["Wa-saqaṭa arbaʿun wa-ʿashrun min shurufātihi l-ʿulwiyyah","wa-kusira sarīru l-maliki Kisrā li hawli mā aṣābahu wa-ʿarāh"],"translation":["Fourteen of its lofty balconies fell, and the throne of Kisra was broken by the terror of what had befallen him. And the fires worshipped throughout the Persian realms were extinguished at the rising of his radiant full moon and the shining of his countenance. Lake Sawah, which lay between Hamadhan and Qumm in the Persian lands, receded and dried up when the abundant flow of its surging waters ceased, along with the springs that fed them.",""],"isRefrain":false},{"arabic":["وَخَمَدَتِ النِّيرَانُ الْمَعْبُودَةُ بِالْمَمَالِكِ الْفَارِسِيَّةْ ❁","لِطُلُوعِ بَدْرِهِ الْمُنِيرِ وَإِشْرَاقِ مُحَيَّاهْ ❁"],"transliteration":["wa-khamadati n-nīrānu l-maʿbūdatu bi-l-mamāliki l-fārisiyyah","li-ṭulūʿi badrihi l-munīri wa-ishrāqi muḥayyāh"],"translation":["",""],"isRefrain":false},{"arabic":["وَغَاضَتْ بُحَيْرَةُ سَاوَةَ وَكَانَتْ بَيْنَ هَمَذَانَ وَقُمَّ مِنَ الْبِلَادِ الْعَجَمِيَّةْ ❁","وَجَفَّتْ إِذْ كَفَّ وَاكِفُ مَوْجِهَا الثَّجَّاجِ يَنَابِيعُ هَاتِيكَ الْمِيَاهْ ❁"],"transliteration":["wa-ghāḍat buḥayratu sāwata wa-kānat bayna Hamadhāna wa-Qumma mina l-bilādi l-ʿajamiyyah","wa-jaffat idh kaffa wākifu mawjiha th-thajjāji yanābīʿu hātīka l-miyāh."],"translation":["",""],"isRefrain":false},{"arabic":["وَفَاضَ وَادِي سَمَاوَةَ وَهِيَ مَفازَةٌ فِي فَلَاةٍ وَبَرِّيَّةْ ❁","لَمْ يَكُنْ بِهَا مِنْ قَبْلُ مَاءٌ يَنْقَعُ لِلظَّمْآنِ اللَّهَاهْ ❁"],"transliteration":["Wa-fāḍa wādī Samāwata wa-hiya mafāzatun fī falātin wa-barriyyah","lam yakun bihā min qablu mā'un yanqaʿu li-ẓ-ẓamāni l-lahāh"],"translation":["The Valley of Samawah overflowed, though it was a waterless wilderness in a barren and desolate land where, before this, there had been no water to quench the thirst of the parched. And his birth, may Allah Most High send prayers and peace upon him, took place at the location known as al-Iras in Makkah, within the Sacred City, whose trees may not be cut down and whose wild herbage may not be gathered.",""],"isRefrain":false},{"arabic":["وَكَانَ مَوْلِدُهُ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ بِالْمَوْضِعِ الْمَعْرُوفِ بِالْعِرَاصِ الْمَكِّيَّةْ ❁","وَالْبَلَدِ الْحَرَامِ الَّذِي لَا يُعْضَدُ شَجَرُهُ وَلَا يُخْتَلَى خَلَاهْ ❁"],"transliteration":["wa-kāna mawliduhu ṣalla Llāhu taʿālā ʿalayhi wa-sallama bi-l-mawḍiʿi l-maʿrūfi bi-l-ʿIrāṣi l-Makkiyyah","wa-l-baladi l-ḥarāmi lladhī lā yuʿḍadu shajaruhu wa-lā yukhtalā khalāh."],"translation":["",""],"isRefrain":false},{"arabic":["وَاخْتُلِفَ فِي عَامِ وَلَادَتِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَفِي شَهْرِهَا وَفِي يَوْمِهَا عَلَى أَقْوَالٍ لِلْعُلَمَاءِ مَرْوِيَّةْ ❁","وَالرَّاجِحُ أَنَّهَا قُبَيْلَ فَجْرِ يَوْمِ الْإِثْنَيْنِ ثَانِي عَشَرَ شَهْرِ رَبِيعٍ الْأَوَّلِ مِنْ عَامِ الْفِيلِ الَّذِي صَدَّهُ اللَّهُ تَعَالَى عَنِ الْحَرَمِ وَحَمَاهْ ❁"],"transliteration":["Wa-khtulifa fī ʿāmi wilādatihi ṣalla Llāhu ʿalayhi wa-sallama wa-fī shahrihā wa-fī yawmihā ʿalā aqwālin li-l-ʿulamā'i marwiyyah","wa-r-rājiḥu annahā qubayla fajri yawmi l-ithnayni thānī ʿashara shahri rabīʿin l-awwali min ʿāmi l-fīli lladhī ṣaddahu Llāhu taʿālā ʿani l-ḥarami wa-ḥamāh."],"translation":["The scholars have differed regarding the year of his birth, may Allah send prayers and peace upon him, as well as its month and its day, with various opinions having been transmitted. The strongest view is that it occurred shortly before dawn on Monday, the twelfth of Rabi al-Awwal, in the Year of the Elephant, which Allah Most High turned away from the Sacred Sanctuary and thereby protected it.",""],"isRefrain":false},{"arabic":["عَطِّرِ اللَّهُمَّ قَبْرَهُ الْكَرِيمَ بِعَرْفٍ شَذِيٍّ مِنْ صَلَاةٍ وَتَسْلِيمٍ ❁","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَيْهِ ❁"],"transliteration":["ʿAṭṭiri Llāhumma qabrahu l-karīma bi-ʿarfin shadhiyyin min ṣalātin wa-taslīmin. Allāhumma ṣalli wa-sallim wa-bārik ʿalayhi.",""],"translation":["O Allah, perfume his noble grave with a fragrant scent of prayers and peace. O Allah, send prayers, peace, and blessings upon him.",""],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: The Prophet’s Childhood ﷺ","englishTitle":"Mawlid al-Barzanji: The Prophet’s Childhood ﷺ","couplets":[{"arabic":["وَأَرْضَعَتْهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أُمُّهُ أَيَّامًا ثُمَّ أَرْضَعَتْهُ ثُوَيْبَةُ الْأَسْلَمِيَّةْ ❁","الَّتِي أَعْتَقَهَا أَبُو لَهَبٍ حِينَ وَافَتْهُ عِنْدَ مِيلَادِهِ عَلَيْهِ الصَّلاةُ والسَّلَامُ بِبُشْرَاه ❁"],"transliteration":["Wa-arḍaʿat-hu ṣalla Llāhu ʿalayhi wa-sallama ummuhu ayyāman thumma arḍaʿat-hu Thuwaybatu l-aslamiyyah","allatī aʿtaqahā Abū Lahabin ḥīna wāfat-hu ʿinda mīlādihi ʿalayhi ṣ-ṣalātu wa-s-salāmu bi-bushrāh"],"translation":["His mother nursed him, may Allah send prayers and peace upon him, for several days. Then he was nursed by Thuwaybah al-Aslamiyyah, whom Abu Lahab set free when she came to him at the time of his birth, peace and prayers be upon him, bearing the glad tidings. She nursed him, may Allah send prayers and peace upon him, together with her son Masruh and Abu Salamah, and she cared for him devotedly. Before him, she had nursed Hamzah, whose noble efforts in supporting the religion were praised.",""],"isRefrain":false},{"arabic":["فَأَرْضَعَتْهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَعَ ابْنِهَا مَسْرُوحٍ وَأَبِي سَلَمَةَ وَهِيَ بِهِ حَفِيَّةْ ❁","وَأَرْضَعَتْ قَبْلَهُ حَمْزَةَ الَّذِي حُمِدَ فِي نُصْرَةِ الدِّينِ سُرَاهْ ❁"],"transliteration":["fa-arḍaʿat-hu ṣalla Llāhu ʿalayhi wa-sallama maʿa-bnihā Masrūḥin wa-abī Salamata wa-hiya bihi ḥafiyyah","wa-arḍaʿat qablahu Ḥamzata lladhī ḥumida fī nuṣrati d-dīni surāh."],"translation":["",""],"isRefrain":false},{"arabic":["وَكَانَ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ يَبْعَثُ إِلَيْهَا مِنَ الْمَدِينَةِ بِصِلَةٍ وَكِسْوَةٍ هِيَ بِهَا حَرِيَّةْ ❁","إِلَى أَنْ أَوْرَدَ هَيْكَلَهَا رَائِدُ الْمَنُونِ الضَّرِيحَ وَوَارَاهْ ❁"],"transliteration":["Wa-kāna ṣalla Llāhu taʿālā ʿalayhi wa-sallama yabʿathu ilayhā mina l-madīnati bi-ṣilatin wa-kiswatin hiya bihā ḥariyyah","ilā an awrada haykalahā rā'idu l-manūni ḍ-ḍarīḥa wa-wārāh"],"translation":["And he, may Allah Most High send prayers and peace upon him, would send her gifts and clothing from Madinah, as she was deserving of such kindness, until the herald of death brought her body to the grave and concealed it therein. It is said that she remained upon the religion of her people, the people of the Age of Ignorance, and it is also said that she embraced Islam. Ibn Mandah recorded and related this difference of opinion. Then the young woman Halimah al-Sadiyyah nursed him, may Allah send prayers and peace upon him. Everyone among the people had rejected her breast because of her poverty and refused it, but her life became prosperous after hardship before the evening had even arrived.",""],"isRefrain":false},{"arabic":["قِيلَ عَلَى دِينِ قَوْمِهَا الْفِئَةِ الْجَاهِلِيَّةْ ❁","وَقِيلَ أَسْلَمَتْ ❁"],"transliteration":["qīla ʿalā dīni qawmiha l-fi'ati l-jāhiliyyah","wa-qīla aslamat"],"translation":["",""],"isRefrain":false},{"arabic":["أَثْبَتَ الْخِلَافَ ابْنُ مَنْدَهَ وَحَكَاهْ ❁","ثُمَّ أَرْضَعَتْهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ الْفَتَاةُ حَلِيمَةُ السَّعْدِيَّةْ ❁"],"transliteration":["athbata l-khilāfa-bnu Mandaha wa-ḥakāh","thumma arḍaʿat-hu ṣalla Llāhu ʿalayhi wa-sallama l-fatātu Ḥalīmatu s-Saʿdiyyah"],"translation":["",""],"isRefrain":false},{"arabic":["وَكَانَ قَدْ رَدَّ كُلٌّ مِنَ الْقَوْمِ ثَدْيَهَا لِفَقْرِهَا وَأَبَاهْ ❁","فَأَخْصَبَ عَيْشُهَا بَعْدَ الْمَحْلِ قَبْلَ الْعَشِيَّةْ ❁"],"transliteration":["wa-kāna qad radda kullun mina l-qawmi thadyahā li-faqrihā wa-abāh","fa-akhṣaba ʿayshuhā baʿda l-maḥli qabla l-ʿashiyyah."],"translation":["",""],"isRefrain":false},{"arabic":["وَدَرَّ ثَدْيَاهَا بِدُرِّ دَرٍّ لَبَنَهُ الْيَمِينُ مِنْهُمَا وَأَلْبَنَ الْآخَرُ أَخَاهْ ❁","وَأَصْبَحَتْ بَعْدَ الْهُزَالِ الْفَقْرِ وَالْهُوَالِ غَنِيَّةْ ❁"],"transliteration":["Wa-darra thadyāhā bi-durri darrin labanahu l-yamīnu minhumā wa-albana l-ākharu akhāh","wa-aṣbaḥat baʿda l-huzāli wa-l-faqri wa-l-huwāli ghaniyyah"],"translation":["Her breasts flowed abundantly with milk, the right one giving its milk to him and the other giving milk to his foster brother. After emaciation, poverty, and hardship, she became prosperous, and the old she-camel and the sheep in her care grew fat. Every hardship and affliction withdrew from her side, and happiness embroidered and adorned the garment of her pleasant life.",""],"isRefrain":false},{"arabic":["وَسَمِنَتِ الشَّارِفُ لَدَيْهَا وَالشِّيَاهْ ❁","وَانْجَابَ عَنْ جَانِبِهَا كُلُّ مُلِمَّةٍ وَرَزِيَّةْ ❁"],"transliteration":["wa-saminati sh-shārifu ladayhā wa-sh-shiyāh","wa-njāba ʿan jānibihā kullu mulimmatin wa-raziyyah"],"translation":["",""],"isRefrain":false},{"arabic":["وَطَرَّزَ السُّعْدُ بُرْدَ عَيْشِهَا الْهَنِيِّ وَوَشَاهْ ❁"],"transliteration":["wa-ṭarraza s-suʿdu burda ʿayshihā l-haniyyi wa-washāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["عَطِّرِ اللَّهُمَّ قَبْرَهُ الْكَرِيمَ بِعَرْفٍ شَذِيٍّ مِنْ صَلَاةٍ وَتَسْلِيمٍ ❁","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَيْهِ ❁"],"transliteration":["ʿAṭṭiri Llāhumma qabrahu l-karīma bi-ʿarfin shadhiyyin min ṣalātin wa-taslīmin. Allāhumma ṣalli wa-sallim wa-bārik ʿalayhi.",""],"translation":["O Allah, perfume his noble grave with a fragrant scent of prayers and peace. O Allah, send prayers, peace, and blessings upon him.",""],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: The Prophet's Upbringing ﷺ","englishTitle":"Mawlid al-Barzanji: The Prophet's Upbringing ﷺ","couplets":[{"arabic":["وَكَانَ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ يَشِبُّ فِي الْيَوْمِ شَبَابَ الصَّبِيِّ فِي الشَّهْرِ بِعِنَايَةٍ رَبَّانِيَّةْ ❁","فَقَامَ عَلَى قَدَمَيْهِ فِي ثَلَاثٍ وَمَشَى فِي خَمْسٍ وَقَوِيَتْ فِي تِسْعٍ مِنَ الشُّهُورِ بِفَصِيحِ النُّطْقِ قُوَاهْ ❁"],"transliteration":["Wa-kāna ṣalla Llāhu taʿālā ʿalayhi wa-sallama yashibbu fī l-yawmi shabāba ṣ-ṣabiyyi fī sh-shahri bi-ʿināyatin Rabbāniyyah","fa-qāma ʿalā qadamayhi fī thalāthin wa-mashā fī khamsin wa-qawiyat fī tisʿin mina sh-shuhūri bi-faṣīḥi n-nuṭqi quwāh"],"translation":["He, may Allah Most High send prayers and peace upon him, would grow in a single day as much as a child would grow in a month, through Divine Care. He stood upon his feet at three months, walked at five months, and by nine months his strength had developed such that he spoke with clear and eloquent speech. The two angels then opened his noble chest while he was with her and removed from it a clot of blood.",""],"isRefrain":false},{"arabic":["وَشَقَّ الْمَلَكَانِ صَدْرَهُ الشَّرِيفَ لَدَيْهَا وَأَخْرَجَا مِنْهُ عَلَقَةً دَمَوِيَّةْ ❁"],"transliteration":["wa-shaqqa l-malakāni ṣadrahu sh-sharīfa ladayhā wa-akhrajā minhu ʿalaqatan damawiyyah.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَأَزَالَا مِنْهُ حَظَّ الشَّيْطَانِ وَبِالثَّلْجِ غَسَلَاهْ ❁","وَمَلَآهُ حِكْمَةً وَمَعَانِيَ إِيمَانِيَّةْ ❁"],"transliteration":["Wa-azāla minhu ḥaẓẓa sh-shayṭāni wa-bi-th-thalji ghasalāh","wa-mala'āhu ḥikmatan wa-maʿāniya īmāniyyah"],"translation":["They removed from him all that by which Satan could claim a share, washed him with snow, filled him with wisdom and the meanings of faith, then stitched him and sealed him with the Seal of Prophethood. They weighed him, and he outweighed a thousand members of his blessed community. He, may Allah Most High send prayers and peace upon him, grew up possessing the most perfect qualities from the days of his childhood.",""],"isRefrain":false},{"arabic":["ثُمَّ خَاطَاهُ وَبِخَاتَمِ النُّبُوَّةِ خَتَمَاهْ ❁","وَوَزَنَاهُ فَرَجَحَ بِأَلْفٍ مِنْ أُمَّتِهِ الْخَيْرِيَّةْ ❁"],"transliteration":["thumma khāṭāhu wa-bi-khātami n-nubuwwati khatamāh","wa-wazanāhu fa-rajaḥa bi-alfin min ummatihi l-khayriyyah"],"translation":["",""],"isRefrain":false},{"arabic":["وَنَشَأَ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ عَلَى أَكْمَلِ الْأَوْصَافِ مِنْ حَالِ صِبَاهْ ❁"],"transliteration":["wa-nasha'a ṣalla Llāhu taʿālā ʿalayhi wa-sallama ʿalā akmali l-awṣāfi min ḥāli ṣibāh",""],"translation":["",""],"isRefrain":false},{"arabic":["ثُمَّ رَدَّتْهُ إِلَى أُمِّهِ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ وَهِيَ بِهِ غَيْرُ سَخِيَّةْ ❁","حَذَرًا مِنْ أَنْ يُصَابَ بِمُصَابِ حَادِثٍ تَخْشَاهْ ❁"],"transliteration":["Thumma raddat-hu ilā ummihi ṣalla Llāhu taʿālā ʿalayhi wa-sallama wa-hiya bihi ghayru sakhiyyah","ḥadharan min an yuṣāba bi-muṣābi ḥādithin takhshāh"],"translation":["Then Halimah returned him, may Allah Most High send prayers and peace upon him, to his mother, though she was unwilling to part with him, fearing that some misfortune she dreaded might befall him. Halimah later came to visit him during the lifetime of the esteemed Lady Khadijah, and he bestowed upon her from his abundant generosity during his lifetime. She also came to him on the day of Hunayn, and he rose to receive her, moved by warm-hearted generosity.",""],"isRefrain":false},{"arabic":["وَوَفَدَتْ عَلَيْهِ حَلِيمَةُ فِي أَيَّامِ خَدِيجَةَ السَّيِّدَةِ الْمَرْضِيَّةْ ❁","فَحَبَاهَا مِنْ حِبَائِهِ الْوَافِرِ بِحَيَاهْ ❁"],"transliteration":["wa-wafadat ʿalayhi Ḥalīmatu fī ayyāmi Khadījata s-sayyidati l-marḍiyyah","fa-ḥabāhā min ḥibā'ihi l-wāfiri bi-ḥayāh"],"translation":["",""],"isRefrain":false},{"arabic":["وَقَدِمَتْ عَلَيْهِ يَوْمَ حُنَيْنٍ فَقَامَ إِلَيْهَا وَأَخَذَتْهُ الْأَرْيَحِيَّةْ ❁"],"transliteration":["wa-qadimat ʿalayhi yawma Ḥunīnin fa-qāma ilayhā wa-akhadhat-hu l-aryaḥiyyah.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَبَسَطَ لَهَا مِنْ رِدَائِهِ الشَّرِيفِ بِسَاطَ بِرِّهِ وَنَدَاهْ ❁","وَالصَّحِيحُ أَنَّهَا أَسْلَمَتْ مَعَ زَوْجِهَا وَالْبَنِينَ وَالذُّرِّيَّةْ ❁"],"transliteration":["Wa-basaṭa lahā min ridā'ihi sh-sharīfi bisāṭa birihi wa-nadāh","wa-ṣ-ṣaḥīḥu annahā aslamat maʿa zawjihā wa-l-banīna wa-dh-dhurriyyah"],"translation":["And he spread out his noble cloak for her as a carpet of his kindness and generosity. The soundest view is that she embraced Islam along with her husband, her children, and her descendants, and a number of trustworthy narrators counted her and her husband among the Companions.",""],"isRefrain":false},{"arabic":["وَقَدْ عَدَّهُمَا فِي الصَّحَابَةِ جَمْعٌ مِنْ ثِقَاتِ الرُّوَاةْ ❁"],"transliteration":["wa-qad ʿaddahumā fī ṣ-ṣaḥābati jamʿun min thiqāti r-ruwāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["عَطِّرِ اللَّهُمَّ قَبْرَهُ الْكَرِيمَ بِعَرْفٍ شَذِيٍّ مِنْ صَلَاةٍ وَتَسْلِيمٍ ❁","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَيْهِ ❁"],"transliteration":["ʿAṭṭiri Llāhumma qabrahu l-karīma bi-ʿarfin shadhiyyin min ṣalātin wa-taslīmin. Allāhumma ṣalli wa-sallim wa-bārik ʿalayhi.",""],"translation":["O Allah, perfume his noble grave with a fragrant scent of prayers and peace. O Allah, send prayers, peace, and blessings upon him.",""],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: The Passing of His Blessed Mother ﷺ","englishTitle":"Mawlid al-Barzanji: The Passing of His Blessed Mother ﷺ","couplets":[{"arabic":["وَلَمَّا بَلَغَ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ أَرْبَعَ سِنِينَ خَرَجَتْ بِهِ أُمُّهُ إِلَى الْمَدِينَةِ النَّبَوِيَّةْ ❁","ثُمَّ عَادَتْ فَوَافَتْهَا بِالْأَبْوَاءِ أَوْ بِشِعْبِ الْحَجُونِ الْوَفَاةْ ❁"],"transliteration":["Wa-lammā balagha ṣalla Llāhu taʿālā ʿalayhi wa-sallama arbaʿa sinīna kharajat bihi ummuhu ilā l-madīnati n-nabawiyyah","thumma ʿādat fa-wāfat-hā bi-l-abwa'i aw bi-shiʿbi l-ḥajūni l-wafāh"],"translation":["When he, may Allah Most High send prayers and peace upon him, reached four years of age, his mother took him to al-Madinah al-Nabawiyyah. Then, on her return, death overtook her at al-Abwa, or, according to another account, in the valley of al-Hajun. His nurse, Umm Ayman the Abyssinian, then took him into her care. He later married her to his freedman, Zayd ibn Harithah.",""],"isRefrain":false},{"arabic":["فَحَمَلَتْهُ حَاضِنَتُهُ أُمُّ أَيْمَنَ الْحَبَشِيَّةْ ❁","الَّتِي زَوَّجَهَا بَعْدُ مِنْ زَيْدِ بْنِ حَارِثَةَ مَوْلَاهْ ❁"],"transliteration":["fa-ḥamalat-hu ḥāḍinatuhu Ummu Aymana l-ḥabashiyyah","allatī zawwajahā baʿdu min zaydi-bni ḥārithata mawlāh."],"translation":["",""],"isRefrain":false},{"arabic":["وَأَدْخَلَتْهُ عَلَى جَدِّهِ عَبْدِ الْمُطَّلِبِ فَضَمَّهُ إِلَيْهِ وَرَقَّ لَهُ وَأَعْلَى رُقِيَّهْ ❁","وَقَالَ إِنَّ لِإِبْنِي هَذَا لَشَأْنًا عَظِيمًا فَبَخٍ بَخٍ لِمَنْ وَقَّرَهُ وَوَالَاهْ ❁"],"transliteration":["Wa-adkhalat-hu ʿalā jaddihi ʿabdi l-Muṭṭalibi fa-ḍammahu ilayhi wa-raqqa lahu wa-aʿlā ruqiyyah","wa-qāla inna li-bnī hādhā la-sha'nan ʿaẓīman fa-bakhin bakhin li-man waqqarahu wa-wālāh"],"translation":["And she brought him to his grandfather Abd al-Muttalib, who embraced him, showed him tenderness, and held him in the highest regard. He said, “Indeed, this son of mine shall have a momentous destiny. How blessed, how blessed is the one who honours him and is devoted to him.” During his childhood, his noble soul never complained of hunger or thirst. Often, he would begin his day by taking nourishment from the water of Zamzam, and it would satisfy his hunger and quench his thirst.",""],"isRefrain":false},{"arabic":["وَلَمْ تَشْكُ فِي صِبَاهُ جُوعًا وَلَا عَطَشًا قَطُّ نَفْسُهُ الْأَبِيَّةْ ❁","وَكَثِيرًا مَا غَدَا فَاغْتَذَى بِمَاءِ زَمْزَمَ فَأَشْبَعَهُ وَأَرْوَاهْ ❁"],"transliteration":["wa-lam tashku fī ṣibāhu jūʿan wa-lā ʿaṭashan qaṭṭu nafsuhu l-abiyyah","wa-kathīran mā ghadā fa-ghtadhā bi-mā'i zamzama fa-ashbaʿahu wa-arwāh."],"translation":["",""],"isRefrain":false},{"arabic":["وَلَمَّا أُنِيخَتْ بِفِنَاءِ جَدِّهِ عَبْدِ الْمُطَّلِبِ مَطَايَا الْمَنِيَّةْ ❁","كَفَلَهُ عَمُّهُ أَبُو طَالِبٍ شَقِيقُ أَبِيهِ عَبْدِالله ❁"],"transliteration":["Wa-lammā unīkhat bi-finā'i jaddihi ʿabdi l-Muṭṭalibi maṭāya l-maniyyah","kafalahu ʿammuhu Abū Ṭālibin shaqīqu abīhi ʿabdi Llāh"],"translation":["When the steeds of death knelt at the dwelling of his grandfather Abd al-Muttalib, his uncle Abu Talib, the full brother of his father Abd Allah, took him into his care. He cared for him with firm resolve, determination, and protective devotion, placing him before himself and his own children and raising him. When he reached twelve years of age, his uncle journeyed with him to the lands of al-Sham.",""],"isRefrain":false},{"arabic":["فَقَامَ بِكَفَالَتِهِ بِعَزْمٍ قَوِيٍّ وَهِمَّةٍ وَحَمِيَّةْ ❁","وَقَدَّمَهُ عَلَى النَّفْسِ وَالْبَنِينَ وَرَبَّاهْ ❁"],"transliteration":["fa-qāma bi-kafālatihi bi-ʿazmin qawiyyin wa-himmatin wa-ḥamiyyah","wa-qaddamahu ʿalā n-nafsi wa-l-banīna wa-rabbāh"],"translation":["",""],"isRefrain":false},{"arabic":["وَلَمَّا بَلَغَ اثْنَتَيْ عَشْرَةَ سَنَةً رَحَلَ بِهِ عَمُّهُ إِلَى الْبِلَادِ الشَّامِيَّةْ ❁"],"transliteration":["wa-lammā balagha-thnatay ʿashrata sanatan raḥala bihi ʿammuhu ilā l-bilādi sh-shāmiyyah.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَعَرَفَهُ الرَّاهِبُ بَحِيرَا بِمَا حَازَهُ مِنْ وَصْفِ النُّبُوَّةِ وَحَوَاهْ ❁","وَقَالَ: إِنِّي أَرَاهُ سَيِّدَ الْعَالَمِينَ وَرَسُولَ اللَّهِ وَنَبِيَّهْ ❁"],"transliteration":["Wa-ʿarafahu r-rāhibu Baḥīrā bi-mā ḥāzahu min waṣfi n-nubuwwati wa-ḥawāh","wa-qāla: innī arāhu sayyida l-ʿālamīna wa-rasūla Llāhi wa-nabiyyah"],"translation":["And the monk Bahira recognised him by the signs of Prophethood that he possessed and embodied, and said, “Indeed, I see him as the Master of the Worlds, the Messenger of Allah, and His Prophet. The trees and stones have prostrated before him, and they do not prostrate except before a deeply devout prophet. Indeed, we find his description in the ancient heavenly scriptures.”",""],"isRefrain":false},{"arabic":["وَقَدْ سَجَدَ لَهُ الشَّجَرُ وَالْحَجَرُ وَلَا يَسْجُدَانِ إِلَّا لِنَبِيٍّ أَوَّاهْ ❁","وَإِنَّا لَنَجِدُ نَعْتَهُ فِي الْكُتُبِ الْقَدِيمَةِ السَّمَاوِيّةْ ❁"],"transliteration":["wa-qad sajada lahu sh-shajaru wa-l-ḥajaru wa-lā yasjudāni illā li-nabiyyin awwāh","wa-innā lanajidu naʿtahu fī l-kutubi l-qadīmati s-samāwiyyah."],"translation":["",""],"isRefrain":false},{"arabic":["وَبَيْنَ كَتِفَيْهِ خَاتَمُ النُّبُوَّةِ قَدْ عَمَّهُ النُّورُ وَعَلَاهْ ❁","وَأَمَرَ عَمَّهُ بِرَدِّهِ إِلَى مَكَّةَ تَخَوُّفًا عَلَيْهِ مِنْ أَهْلِ دِينِ الْيَهُودِيَّةْ ❁"],"transliteration":["Wa-bayna katifayhi khātamu n-nubuwwati qad ʿammahu n-nūru wa-ʿalāh","wa-amara ʿammahu bi-raddihi ilā Makkata takhawwufan ʿalayhi min ahli dīni l-yahūdiyyah"],"translation":["And between his shoulders was the Seal of Prophethood, enveloped and covered by light. Fearing for him from the followers of Judaism, the monk instructed his uncle to return him to Makkah. So he returned with him and did not proceed beyond Busra into the blessed lands of al-Sham.",""],"isRefrain":false},{"arabic":["فَرَجَعَ بِهِ وَلَمْ يُجَاوِزْ مِنَ الشَّامِ الْمُقَدَّسِ بُصْرَاهْ ❁"],"transliteration":["fa-rajaʿa bihi wa-lam yujāwiz mina sh-shāmi l-muqaddasi buṣrāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["عَطِّرِ اللَّهُمَّ قَبْرَهُ الْكَرِيمَ بِعَرْفٍ شَذِيٍّ مِنْ صَلَاةٍ وَتَسْلِيمٍ ❁","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَيْهِ ❁"],"transliteration":["ʿAṭṭiri Llāhumma qabrahu l-karīma bi-ʿarfin shadhiyyin min ṣalātin wa-taslīmin. Allāhumma ṣalli wa-sallim wa-bārik ʿalayhi.",""],"translation":["O Allah, perfume his noble grave with a fragrant scent of prayers and peace. O Allah, send prayers, peace, and blessings upon him.",""],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: The Prophet's Early Adulthood ﷺ","englishTitle":"Mawlid al-Barzanji: The Prophet's Early Adulthood ﷺ","couplets":[{"arabic":["وَلَمَّا بَلَغَ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ خَمْسًا وَعِشْرِينَ سَنَةً سَافَرَ إِلَى بُصْرَى فِي تِجَارَةٍ لِخَدِيجَةَ الْغَنِيَّةْ ❁","وَمَعَهُ غُلَامُهَا مَيْسَرَةُ يَخْدِمُهُ عَلَيْهِ الصَّلَاةُ وَالسَّلَامُ وَيَقُومُ بِمَا عَنَاهْ ❁"],"transliteration":["Wa-lammā balagha ṣalla Llāhu taʿālā ʿalayhi wa-sallama khamsan wa-ʿishrīna sanatan sāfara ilā buṣrā fī tijāratin li-Khadījata l-ghaniyyah","wa-maʿahu ghulāmuhā Maysaratu yakhdimuhu ʿalayhi ṣ-ṣalātu wa-s-salāmu wa-yaqūmu bi-mā ʿanāh"],"translation":["When he, may Allah Most High send prayers and peace upon him, reached twenty-five years of age, he travelled to Busra on a trading journey for the wealthy Khadijah. Accompanying him was her servant Maysarah, who served him, prayers and peace be upon him, and attended to his needs. He stopped beneath a tree near the hermitage of Nustur, a Christian monk.",""],"isRefrain":false},{"arabic":["وَنَزَلَ تَحْتَ شَجَرَةٍ لَدَى صَوْمَعَةِ نُسْطُورَ رَاهِبِ النَّصْرَانِيَّةْ ❁"],"transliteration":["wa-nazala taḥta shajaratin ladā ṣawmaʿati Nusṭūra rāhibi n-naṣrāniyyah.",""],"translation":["",""],"isRefrain":false},{"arabic":["فَعَرَفَهُ الرَّاهِبُ إِذْ مَالَ إِلَيْهِ ظِلُّهَا الْوَارِفُ وَآوَاهْ ❁","وَقَالَ: مَا نَزَلَ تَحْتَ هَذِهِ الشَّجَرَةِ قَطُّ إِلَّا نَبِيٌّ ذُو صِفَاتٍ نَقِيَّةْ ❁"],"transliteration":["Fa-ʿarafahu r-rāhibu idh māla ilayhi ẓilluha l-wārifu wa-awwāh, wa-qāla: mā nazala taḥta hādhihi sh-shajarati qaṭṭu illā nabiyyun dhū ṣifātin naqiyyah, wa-rasūlun qad khaṣṣahu Llāhu taʿālā bi-l-faḍā'ili wa-ḥabāh, thumma qāla li-Maysarata: afī ʿaynayhi ḥumratun, istiẓhāran li-l-ʿalāmati l-khafiyyah, fa-ajābahu bi-naʿam fa-ḥaqqa ladayhi mā ẓannahu fīhi wa-tawakhkhāh.",""],"translation":["The monk recognised him when the tree’s ample shade inclined towards him and sheltered him, and said, “None has ever rested beneath this tree except a Prophet of pure qualities and a Messenger whom Allah Most High has specially endowed and favoured with virtues.” Then he asked Maysarah, “Is there redness in his eyes?”, seeking to confirm the hidden sign. Maysarah replied, “Yes,” and thus what he had suspected and sought to confirm about him was established in his mind.",""],"isRefrain":false},{"arabic":["وَرَسُولٌ قَدْ خَصَّهُ اللَّهُ تَعَالَى بِالْفَضَائِلِ وَحَبَاهْ ❁","ثُمَّ قَالَ لِمَيْسَرَةَ : أَفِي عَيْنَيْهِ حُمْرَةٌ؟ اسْتِظْهَارًا لِلْعَلَامَةِ الْخَفِيَّةْ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["فَأَجَابَهُ بِنَعَمْ فَحَقَّ لَدَيْهِ مَا ظَنَّهُ فِيهِ وَتَوَخَّاهْ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["وَ قَالَ لِمَيْسَرَةَ: لَا تُفَارِقْهُ وَكُنْ مَعَهُ بِصِدْقِ عَزْمٍ وَحُسْنِ طَوِيَّةْ ❁","فَإِنَّهُ مِمَّنْ أَكْرَمَهُ اللَّهُ تَعَالَى بِالنُّبُوَّةِ وَاجْتَبَاهْ ❁"],"transliteration":["Wa-qāla li-Maysarata: lā tufāriqhu wa-kun maʿahu bi-ṣidqi ʿazmin wa-ḥusni ṭawiyyah","fa-innahu mimman akramahu Llāhu taʿālā bi-n-nubuwwati wa-jtabāh"],"translation":["And he said to Maysarah, “Do not leave him, and remain with him with sincere resolve and a good heart, for he is among those whom Allah Most High has honoured with Prophethood and chosen.” Then he returned to Makkah, and Khadijah saw him approaching while she was among a group of women in an upper chamber, with two angels shading his noble head from the blazing heat of the sun.",""],"isRefrain":false},{"arabic":["ثُمَّ عَادَ إِلَى مَكَّةَ فَرَأَتْهُ خَدِيجَةُ مُقْبِلًا وَهِيَ بَيْنَ نِسْوَةٍ فِي عُلِّيَّةْ ❁","وَمَلَكَانِ عَلَى رَأْسِهِ الشَّرِيفِ مِنْ وَهَجِ الشَّمْسِ قَدْ أَظَلَّاهْ ❁"],"transliteration":["thumma ʿāda ilā Makkata fara'athu Khadījatu muqbilan wa-hiya bayna niswatin fī ʿulliyyah","wa-malakāni ʿalā ra'sihi sh-sharīfi min wahaji sh-shamsi qad aẓallāh."],"translation":["",""],"isRefrain":false},{"arabic":["وَأَخْبَرَها مَيْسَرَةُ بِأَنَّهُ رَأَى ذَلِكَ فِي السَّفَرِ كُلِّهِ وَبِمَا قَالَهُ الرَّاهِبُ وَأَوْدَعَهُ لَدَيْهِ مِنَ الْوَصِيَّةْ ❁","وَضَاعَفَ اللَّهُ فِي تِلْكَ التِّجَارَةِ رِبْحَهَا وَنَمَّاهْ ❁"],"transliteration":["Wa-akhbarahā Maysaratu bi-annahu ra'ā dhālika fī s-safari kullihi wa-bi-mā qālahu r-rāhibu wa-awdaʿahu ladayhi mina l-waṣiyyah","wa-ḍāʿafa Llāhu taʿālā fī tilka t-tijārati ribḥahā wa-nammāh"],"translation":["And Maysarah told her that he had witnessed this throughout the entire journey, and informed her of what the monk had said and the counsel he had entrusted to him concerning him. Allah Most High doubled the profit of that trade and caused it to increase. From what Khadijah had seen and heard, it became clear to her that he was the Messenger of Allah Most High to all creation, whom Allah Most High had specially favoured with nearness to Himself and chosen.",""],"isRefrain":false},{"arabic":["فَبَانَ لِخَدِيجَةَ بِمَا رَأَتْ وَمَا سَمِعَتْ أَنَّهُ رَسُولُ اللَّهِ تَعَالَى إِلَى الْبَرِيَّةْ ❁","الَّذِي خَصَّهُ اللَّهُ تَعَالَى بِقُرْبِهِ وَاصْطَفَاهْ ❁"],"transliteration":["fa-bāna li-Khadījata bi-mā ra'at wa-mā samiʿat annahu rasūlu Llāhi taʿālā ilā l-bariyyah","alladhī khaṣṣahu Llāhu taʿālā bi-qurbihi wa-ṣ-ṭafāh."],"translation":["",""],"isRefrain":false},{"arabic":["فَخَطَبَتْهُ لِنَفْسِهَا الزَّكِيَّةْ ❁","لِتَشُمَّ مِنَ الْإِيمَانِ بِهِ طِيبَ رَيَّاهْ ❁"],"transliteration":["Fa-khaṭabat-hu li-nafsiha z-zakiyyah","li-tashumma mina l-īmāni bihi ṭība rayyāh"],"translation":["So she sought him in marriage for her pure self, that she might breathe the sweet fragrance of faith in him. He, may Allah send prayers and peace upon him, then informed his uncles of what this righteous and God-fearing woman had invited him to. They desired her for her virtue, religion, beauty, wealth, standing, and lineage, qualities that everyone among the people would desire. Abu Talib then delivered the marriage address and praised him, may Allah Most High send prayers and peace upon him, after praising Allah with sublime praises.",""],"isRefrain":false},{"arabic":["فَأَخْبَرَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَعْمَامَهُ بِمَا دَعَتْهُ إِلَيْهِ هَذِهِ الْبَرَّةُ التَّقِيَّةْ ❁","فَرَغِبُوا فِيهَا لِفَضْلٍ وَدِينٍ وَجَمَالٍ وَمَالٍ وَحَسَبٍ وَنَسَبٍ كُلٌّ مِنَ الْقَوْمِ يَهْوَاهْ ❁"],"transliteration":["fa-akhbara ṣalla Llāhu ʿalayhi wa-sallama aʿmāmahu bi-mā daʿat-hu ilayhi hādhihi l-barratu t-taqiyyah","fa-raghibū fīhā li-faḍlin wa-dīnin wa-jamālin wa-mālin wa-ḥasabin wa-nasabin kullun mina l-qawmi yahwāh"],"translation":["",""],"isRefrain":false},{"arabic":["وَخَطَبَ أَبُو طَالِبٍ وَأَثْنَى عَلَيْهِ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ بَعْدَ أَنْ حَمِدَ اللَّهَ بِمَحَامِدَ سَنِيَّةْ ❁"],"transliteration":["wa-khaṭaba Abū Ṭālibin wa-athnā ʿalayhi ṣalla Llāhu taʿālā ʿalayhi wa-sallama baʿda an ḥamida Llāha bi-maḥāmida saniyyah.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَقَالَ هُوَ وَاللَّهِ لَهُ نَبَأٌ عَظِيمٌ يُحْمَدُ فِيهِ مَسْرَاهْ ❁","فَزَوَّجَهَا مِنْهُ عَلَيْهِ الصَّلَاةُ وَالسَلَّامَ أَبُوهَا وَقِيلَ عَمُّهَا وَقِيلَ: أَخُوهَا لِسَابِقِ سَعَادَتِهَا الْأَزَلِيَّةْ ❁"],"transliteration":["Wa-qāla huwa wa-Llāhi lahu naba'un ʿaẓīmun yuḥmadu fīhi masrāh","fa-zawwajahā minhu ṣalla Llāhu ʿalayhi wa-sallama abūhā wa-qīla ʿammahā wa-qīla akhūhā li-sābiqi saʿādatiha l-azaliyyah"],"translation":["And he said, “By Allah, he shall have a momentous destiny, and his course shall be praised therein.” Her father then gave her in marriage to him, prayers and peace be upon him, though it is also said that it was her uncle, and it is said that it was her brother, on account of the eternal happiness that had been decreed for her. She bore him all of his children except the one whom he named after the Friend of Allah, Ibrahim.",""],"isRefrain":false},{"arabic":["وَأَوْلَدَهَا كُلَّ أَوْلَادِهِ إِلَّا الَّذِي بِاسْمِ الْخَلِيلِ سَمَّاهْ ❁"],"transliteration":["wa-awladahā kulla awlādihi illa lladhī bi-smi l-khalīli sammāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["عَطِّرِ اللَّهُمَّ قَبْرَهُ الْكَرِيمَ بِعَرْفٍ شَذِيٍّ مِنْ صَلَاةٍ وَتَسْلِيمٍ ❁","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَيْهِ ❁"],"transliteration":["ʿAṭṭiri Llāhumma qabrahu l-karīma bi-ʿarfin shadhiyyin min ṣalātin wa-taslīmin. Allāhumma ṣalli wa-sallim wa-bārik ʿalayhi.",""],"translation":["O Allah, perfume his noble grave with a fragrant scent of prayers and peace. O Allah, send prayers, peace, and blessings upon him.",""],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: The Raising of the Black Stone","englishTitle":"Mawlid al-Barzanji: The Raising of the Black Stone","couplets":[{"arabic":["وَلَمَّا بَلَغَ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلّمَ خَمْسًا وَثَلَاثِينَ سَنَةً بَنَتْ قُرَيْشٌ الْكَعْبَةَ لِانْصِدَاعِهَا بِالْسُّيُولِ الْأَبْطَحِيَّةْ ❁","وَتَنَازَعُوا فِي رَفْعِ الْحَجَرِ الْأَسْوَدِ فَكُلٌّ أَرَادَ رَفْعَهُ وَرَجَاهْ ❁"],"transliteration":["Wa-lammā balagha ṣalla Llāhu taʿālā ʿalayhi wa-sallama khamsan wa-thalāthīna sanatan banat qurayshun l-kaʿbata li-n-ṣidāʿihā bi-s-suyūli l-abṭaḥiyyah","wa-tanāzaʿū fī rafʿi l-ḥajari l-aswadi fa-kullun arāda rafʿahu wa-rajāh"],"translation":["When he, may Allah Most High send prayers and peace upon him, reached thirty-five years of age, Quraysh rebuilt the Ka'bah after it had been damaged by the floods of al-Abtah. They disputed over the raising of the Black Stone, each group desiring and hoping to have the honour of raising it. The dispute and contention grew intense, and they pledged themselves to fight as tribal rivalry became ever stronger.",""],"isRefrain":false},{"arabic":["وَعَظُمَ الْقِيلُ وَالْقَالُ وَتَحَالَفُوا عَلَى الْقِتَالِ وَقَوِيَتِ الْعَصَبِيَّةْ ❁"],"transliteration":["wa-ʿaẓuma l-qīlu wa-l-qālu wa-taḥālafū ʿalā l-qitāli wa-qawiyati l-ʿaṣabiyyah.",""],"translation":["",""],"isRefrain":false},{"arabic":["ثُمَّ تَدَاعُوا إِلَى الْإِنْصَافِ وَفَوَّضُوا الْأَمْرَ إِلَى ذِي رَأْيٍ صَائِبٍ وَأَنَاةْ ❁","فَحَكَمَ بِتَحْكِيمِ أَوَّلِ دَاخِلٍ مِنْ بَابِ السَّدَنَةِ الشَّيْبِيَّةْ ❁"],"transliteration":["Thumma tadāʿū ilā l-inṣāfi wa-fawwaḍū l-amra ilā dhī ra'yin ṣā'ibin wa-anāh","fa-ḥakama bi-taḥkīmi awwali dākhilin min bābi s-sadanati sh-shaybiyyah"],"translation":["Then they called one another to fairness and entrusted the matter to a man of sound judgement and deliberation, who ruled that the first person to enter through the gate of the Banu Shaybah should be appointed as arbiter. The Prophet, may Allah Most High send prayers and peace upon him, was the first to enter, so they said, “This is al-Amin, the Trustworthy One, and we all accept him and are pleased with him.” They then informed him that they had agreed to accept him as the judge and the one entrusted with resolving this difficult matter.",""],"isRefrain":false},{"arabic":["فَكَانَ النَّبِيُّ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ أَوَّلَ دَاخِلٍ فَقَالُوا: هَذَا الْأَمِينُ وَكُلُّنَا نَقْبَلُهُ وَنَرْضَاهْ ❁","فَأَخْبَرُوهُ بِأَنَّهُمْ رَضُوهُ أَنْ يَكُونَ صَاحِبَ الْحُكْمِ فِي هَذَا الْمُلِمِّ وَوَلِيَّهْ ❁"],"transliteration":["fa-kāna n-nabiyyu ṣalla Llāhu taʿālā ʿalayhi wa-sallama awwala dākhilin fa-qālū: hādhā l-amīnu wa-kullunā naqbaluhu wa-narḍāh","fa-akhbarūhu bi-annahum raḍūhu an yakūna ṣāḥiba l-ḥukmi fī hādhā l-mulimmi wa-waliyyah."],"translation":["",""],"isRefrain":false},{"arabic":["فَوَضَعَ الحَجَرَ فِي ثَوْبٍ ثُمَّ أَمَرَ أَنْ تَرْفَعَهُ الْقَبَائِلُ جَمِيعًا إِلَى مُرْتَقَاهْ ❁","فَرَفَعُوهُ إِلَى مَقَرِّهِ مِنْ رُكْنِ هَاتِيكَ الْبَنِيَّةْ ❁"],"transliteration":["Fa-waḍaʿa l-ḥajara fī thawbin thumma amara an tarfaʿahu l-qabā'ilu jamīʿan ilā murtaqāh","fa-rafaʿūhu ilā maqarrihi min rukni hātīka l-baniyyah"],"translation":["He placed the Black Stone in a cloth, then instructed all the tribes to raise it together to its appointed height. They raised it to its place in the corner of that Sacred House, and he, may Allah Most High send prayers and peace upon him, placed it with his noble hand in the position where it remains today and set it firmly in place.",""],"isRefrain":false},{"arabic":["وَوَضَعَهُ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ بِيَدِهِ الشَّرِيفَةِ فِي مَوْضِعِهِ الْآنَ وَبَنَاهْ ❁"],"transliteration":["wa-waḍaʿahu ṣalla Llāhu taʿālā ʿalayhi wa-sallama bi-yadihi sh-sharīfati fī mawḍiʿihi l-āna wa-banāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["عَطِّرِ اللَّهُمَّ قَبْرَهُ الْكَرِيمَ بِعَرْفٍ شَذِيٍّ مِنْ صَلَاةٍ وَتَسْلِيمٍ ❁","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَيْهِ ❁"],"transliteration":["ʿAṭṭiri Llāhumma qabrahu l-karīma bi-ʿarfin shadhiyyin min ṣalātin wa-taslīmin. Allāhumma ṣalli wa-sallim wa-bārik ʿalayhi.",""],"translation":["O Allah, perfume his noble grave with a fragrant scent of prayers and peace. O Allah, send prayers, peace, and blessings upon him.",""],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: The Beginning of Revelation","englishTitle":"Mawlid al-Barzanji: The Beginning of Revelation","couplets":[{"arabic":["وَلَمَّا كَمُلَ لَهُ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ أَرْبَعُونَ سَنَةً عَلَى أَوْفَقِ الْأَقْوَالِ لِذَوِي الْعَالَمِيَّةْ ❁","بَعَثَهُ اللَّهُ تَعَالَى لِلْعَالَمِينَ بَشِيرًا وَنَذِيرًا فَعَمَّهُمْ بِرُحْمَاهْ ❁"],"transliteration":["Wa-lammā kamula lahu ṣalla Llāhu taʿālā ʿalayhi wa-sallama arbaʿūna sanatan ʿalā awfaqi l-aqwāli li-dhawi l-ʿālamiyyah","baʿathahu Llāhu taʿālā li-l-ʿālamīna bashīran wa-nadhīran fa-ʿammahum bi-ruḥmāh"],"translation":["When he, may Allah Most High send prayers and peace upon him, reached forty years of age, according to the most reliable of the opinions held by the learned, Allah Most High sent him to all the worlds as a bearer of glad tidings and a warner, encompassing them with His mercy through him. He was first given clear and truthful dreams for a period of six months, and he would see no dream except that it came to pass like the breaking of dawn, radiant with light.",""],"isRefrain":false},{"arabic":["وَبُدِئَ إِلَى تَمَامِ سِتَّةِ أَشْهُرٍ بِالرُّؤْيَا الصَّادِقَةِ الْجَلِيَّةْ ❁","فَكَانَ لَا يَرَى رُؤْيًا إِلَّا جَاءَتْ مِثْلَ فَلَقِ صُبْحٍ أَضَاءَ سَنَاهْ ❁"],"transliteration":["wa-budi'a ilā tamāmi sittati ash-hurin bi-r-ru'ya ṣ-ṣādiqati l-jaliyyah","fa-kāna lā yarā ru'yan illā jā'at mithla falaqi ṣubḥin aḍā'a sanāh."],"translation":["",""],"isRefrain":false},{"arabic":["وَإِنَّمَا ابْتُدِئَ بِالرُّؤْيَا تَمْرِينًا لِلْقُوَّةِ الْبَشَرِيَّةْ ❁","لِئَلَّا يَفْجَأَهُ الْمَلَكُ بِصَرِيحِ النُّبُوَّةِ فَلَا تَقْوَاهُ قُوَاهْ ❁"],"transliteration":["Wa-innama-btudi'a bi-r-ru'yā tamrīnan li-l-quwwati l-bashariyyah","li-'allā yafja'ahu l-malaku bi-ṣarīḥi n-nubuwwati fa-lā taqwāhu quwāh"],"translation":["And he was first given truthful dreams as a preparation for his human faculties, so that the angel would not suddenly come to him with the manifest reality of Prophethood while his faculties were unable to bear it. Solitude was made beloved to him, and he would worship at Hira for a number of nights, until the manifest Truth came to him there. This occurred on a Monday, when seventeen nights had passed of the month of the Night of Decree. There are also other opinions that it occurred after seven nights had passed, or after twenty-four nights of that month, or after eight nights had passed of the month of his birth, in which the full moon of his countenance first appeared.",""],"isRefrain":false},{"arabic":["وَحُبِّبَ إِلَيْهِ الْخَلَاءُ فَكَانَ يَتَعَبَّدُ بِحِرَاءٍ اللَّيَالِيَ الْعَدَدِيَّةْ ❁","إِلى أَنْ أَتَاهُ فِيهِ صَرِيحُ الْحَقِّ وَوَافَاهْ ❁"],"transliteration":["wa-ḥubbiba ilayhi l-khalā'u fa-kāna yataʿabbadu bi-ḥirā'in l-layāliya l-ʿadadiyyah","ilā an atāhu fīhi ṣarīḥu l-ḥaqqi wa-wāfāh"],"translation":["",""],"isRefrain":false},{"arabic":["وَذَلِكَ فِي يَوْمِ الْإثْنَيْنِ لِسَبْعَ عَشْرَةَ لَيْلَةً خَلَتْ مِنْ شَهْرِ اللَّيْلَةِ الْقَدْرِيَّةْ ❁","وَثَمَّ أَقْوَالٌ لِسَبْعٍ أَوْ لِأَرْبَعٍ وَعِشْرِينَ مِنْهُ أَوْ لِثَمَانٍ خَلَتْ مِنْ شَهْرِ مَوْلِدِهِ الَّذِي بَدَا فِيهِ بَدْرُ مُحَيَّاهْ ❁"],"transliteration":["wa-dhālika fī yawmi l-ithnayni li-sabʿa ʿashrata laylatan khalat min shahri l-laylati l-qadriyyah","wa-thamma aqwālun li-sabʿin aw li-arbaʿin wa-ʿishrīna minhu aw li-thamānin khalat min shahri mawlidihi lladhī badā fīhi badru muḥayyāh."],"translation":["",""],"isRefrain":false},{"arabic":["فَقَالَ لَهُ اقْرَأْ ❁","فَأَبَى فَغَطَّهُ غَطَّةً قَوِيَّةْ ❁"],"transliteration":["Fa-qāla lahu iqra fa-abā fa-ghaṭṭahu ghaṭṭatan qawiyyah, thumma qāla lahu iqra fa-abā fa-ghaṭṭahu ghaṭṭatan thaniyatan ḥattā balagha minhu l-jahda wa-ghaṭṭāh, thumma qāla lahu iqra fa-abā fa-ghaṭṭahu thālithatan li-yatawajjaha ilā mā sayulqā ilayhi bi-jamʿiyyah, wa-yuqābilahu bi-jiddin wa-jtihādin wa-yatalaqqāh, thumma fatara l-waḥyu thalātha sinīna aw thalāthīna shahran li-yashtāqa ila-n-tishāqi hātīka n-nafaḥāti sh-shadhiyyah.",""],"translation":["Then he said to him, “Read.” He declined, so the angel pressed him with a powerful embrace. Then he said to him, “Read.” He declined again, so the angel pressed him a second time until he reached the limit of his endurance. Then he said to him, “Read.” He declined, so the angel pressed him a third time, so that he might turn with complete concentration towards what was about to be imparted to him, receive it with earnestness and utmost effort, and take it in. Revelation then ceased for three years, or according to another opinion, thirty months, so that he might yearn to breathe in those fragrant breezes once again.",""],"isRefrain":false},{"arabic":["ثُمَّ قَالَ لَهُ: اقْرَأْ ❁","فَأَبَى فَغَطَّهُ غَطَّةً ثَانِيَةً حَتَّى بَلَغَ مِنْهُ الْجَهْدَ وَغَطَّاهْ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["ثُمَّ قَالَ لَهُ اقْرَأْ فَقَالَ فَأَبَى فَغَطَّهُ ثَالِثَةً لِيَتَوَجَّهَ إِلَى مَا سَيُلْقَى إِلَيْهِ بِجَمْعِيَّةْ ❁","وَيُقَابِلَهُ بِجِدٍّ وَاجْتِهَادٍ وَيَتَلَقَّاهْ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["ثُمَّ فَتَرَ الْوَحْيُ ثَلَاثَ سِنِينَ أَوْ ثَلَاثِينَ شَهْرًا لِيَشْتَاقَ إِلَى انْتِشَاقِ هَاتِيكَ النَّفَحَاتِ الشَّذِيَّةْ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["ثُمَّ أُنْزِلَتْ عَلَيْهِ ﴿يَا أَيُّهَا الْمُدَّثِّرُ﴾ فَجَاءَهُ جِبْرِيلُ بِهَا وَنَادَاهْ ❁","فَكَانَ لِنُبُوَّتِهِ فِي تَقَدُّمِ ﴿اقْرَأْ بِاسْمِ رَبِّكَ﴾ شَاهِدٌ عَلَى أَنَّ لَهَا السَّابِقِيَّةْ ❁"],"transliteration":["Thumma unzilat ʿalayhi ﴾Yā ayyuha l-muddaththir ﴿fa-jā'ahu Jibrīlu bihā wa-nādāh","fa-kāna li-nubuwwatihi fī taqaddumi ﴾Iqra' bi-smi Rabbika ﴿shāhidun ʿalā anna lahā s-sābiqiyyah"],"translation":["Then there was revealed to him, “O you who are wrapped up” (Surah al-Muddaththir), and Jibril came to him with it and called upon him. The preceding revelation of “Read in the name of your Lord” (Surah al-Alaq) was evidence that his Prophethood came first, preceding his Messengership through which he was charged with giving glad tidings and warning those whom he called.",""],"isRefrain":false},{"arabic":["وَالتَّقَدُّمُ عَلَى رِسَالَتِهِ بِالْبِشَارَةِ وَالنِّذَارَةِ لِمَنْ دَعَاهْ ❁"],"transliteration":["wa-t-taqaddumu ʿalā risālatihi bi-l-bishārati wa-n-nidhārati li-man daʿāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["عَطِّرِ اللَّهُمَّ قَبْرَهُ الْكَرِيمَ بِعَرْفٍ شَذِيٍّ مِنْ صَلَاةٍ وَتَسْلِيمٍ ❁","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَيْهِ ❁"],"transliteration":["ʿAṭṭiri Llāhumma qabrahu l-karīma bi-ʿarfin shadhiyyin min ṣalātin wa-taslīmin. Allāhumma ṣalli wa-sallim wa-bārik ʿalayhi.",""],"translation":["O Allah, perfume his noble grave with a fragrant scent of prayers and peace. O Allah, send prayers, peace, and blessings upon him.",""],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: The First Believers","englishTitle":"Mawlid al-Barzanji: The First Believers","couplets":[{"arabic":["وَأَوَّلُ مَنْ آمَنَ بِهِ مِنَ الرِّجَالِ أَبُو بَكْرٍ صَاحِبُ الْغَارِ وَالصِّدِّيقِيَّةْ ❁","وَمِنَ الصِّبْيَانِ عَلِيٌّ وَمِنَ النِّسَاءِ خَدِيجَةُ الَّتِي ثَبَّتَ اللَّهُ بِهَا قَلْبَهُ وَوَقَاهْ ❁"],"transliteration":["Wa-awwalu man āmana bihi mina r-rijāli Abū Bakrin ṣāḥibu l-ghāri wa-ṣ-ṣiddīqiyyah","wa-mina ṣ-ṣibyāni ʿAliyyun wa-mina n-nisā'i Khadījatu llatī thabbata Llāhu bihā qalbahu wa-waqāh"],"translation":["The first to believe in him among the men was Abu Bakr, the Companion of the Cave and the possessor of supreme truthfulness, among the young was Ali, and among the women was Khadijah, through whom Allah strengthened his heart and protected him. Among the freedmen was Zayd ibn Harithah, and among the slaves was Bilal, whom Umayyah tortured for the sake of Allah, whereupon his master Abu Bakr bestowed upon him the great favour of emancipation.",""],"isRefrain":false},{"arabic":["وَمِنَ الْمَوَالِيِ: زَيْدُ بْنُ حَارِثَةَ وَمِنَ الْأَرِقَّاءِ بِلَالٌ الَّذِي عَذَّبَهُ فِي اللَّهِ أُمَيَّةْ ❁","وَأَوْلَاهُ مَوْلَاهُ أَبُو بَكْرٍ مِنَ الْعِتْقِ مَا أَوْلَاهْ ❁"],"transliteration":["wa-mina l-mawālī Zaydu-bnu Ḥārithata wa-mina l-ariqqā'i Bilālun lladhī ʿadhdhabahu fī Llāhi Umayyah","wa-awlāhu mawlāhu Abū Bakrin mina l-ʿitqi mā awlāh."],"translation":["",""],"isRefrain":false},{"arabic":["ثُمَّ أَسْلَمَ عُثْمَانُ وَسَعْدٌ وَسَعِيدٌ وَطَلْحَةٌ وَابْنُ عَوْفٍ وَالزُّبَيْرُ بْنُ الْعَوَّامِ وَابْنُ الْعَمَّةِ صَفِيَّةْ ❁","وَغَيْرُهُمْ مِمَّنْ أَنْهَلَهُ الصِّدِّيقُ بِرَحِيقِ التَّصْدِيقِ وَسَقَاهْ ❁"],"transliteration":["Thumma aslama ʿUthmānu wa-Saʿdun wa-Saʿīdun wa-Ṭalḥatun wa-bnu ʿAwfin wa-Zubayru bnu ʿAwwāmin wa-bnu l-ʿammati Ṣafiyyah","wa-ghayruhum mimman anhalahu ṣ-ṣiddīqu bi-raḥīqi t-taṣdīqi wa-saqāh"],"translation":["Then Uthman, Sad, Said, Talhah, Abd al-Rahman ibn Awf, and al-Zubayr ibn al-Awwam, the son of his paternal aunt Safiyyah, embraced Islam, along with others whom al-Siddiq gave to drink from the pure nectar of belief. His worship, may Allah Most High send prayers and peace upon him, together with his Companions remained concealed until there was revealed to him, “So proclaim openly what you are commanded” (Surah al-Hijr), whereupon he openly called the people to Allah.",""],"isRefrain":false},{"arabic":["وَمَا زَالَتْ عِبَادَتُهُ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ مَعَ أَصْحَابِهِ مَخْفِيَّةْ ❁","حَتَّى أُنْزِلَ عَلَيْهِ ﴿فَاصْدَعْ بِمَا تُؤْمَرُ﴾ فَجَهَرَ بِدُعَاءِ الْخَلْقِ إِلَى اللَّهْ ❁"],"transliteration":["wa-mā zālat ʿibādatuhu ṣalla Llāhu taʿālā ʿalayhi wa-sallama maʿa aṣḥābihi makhfiyyah","ḥattā unzila ʿalayhi ﴾fa-ṣdaʿ bi-mā tu'mar﴿ fa-jahara bi-duʿā'i l-khalqi ilā Llāh."],"translation":["",""],"isRefrain":false},{"arabic":["وَلَمْ يَبْعُدْ مِنْهُ قَوْمُهُ حَتَّى عَابَ آلِهَتَهُمْ وَأَمَرَ بِرَفْضِ مَا سِوَى الْوَحْدَانِيَّةْ ❁","فَتَجَرَّؤُا عَلَى مُبَارَزَتِهِ بِالْعَدَاوَةِ وَأَذَاهْ ❁"],"transliteration":["Wa-lam yabʿud minhu qawmuhu ḥattā ʿāba ālihatahum wa-amara bi-rafḍi mā siwa l-waḥdāniyyah","fa-tajarra'ū ʿalā mubārazatihi bi-l-ʿadāwati wa-adhāh"],"translation":["His people did not distance themselves from him until he condemned their gods and commanded them to reject everything besides Divine Oneness. Then they dared to confront him with hostility and harm. The persecution of the Muslims grew severe, so in the fifth year they migrated towards the land of al-Najashi. His uncle Abu Talib showed him tender care and protection, and everyone among the people feared him and kept their distance from him.",""],"isRefrain":false},{"arabic":["وَاشْتَدَّ عَلَى المُسْلِمِينَ الْبَلَاءُ فَهَاجَرُوا فِي سَنَةِ خَمْسٍ إِلَى النَّاحِيَةِ النَّجَاشِيَّةْ ❁","وَحَدِبَ عَلَيْهِ عَمُّهُ أَبُو طَالِبٍ فَهَابَهُ كُلٌّ مِنَ الْقَوْمِ وَتَحَامَاهْ ❁"],"transliteration":["wa-sh-tadda ʿalā l-muslimīna l-balā'u fa-hājarū fī sanati khamsin ilā n-nāḥiyati n-najāshiyyah","wa-ḥadiba ʿalayhi ʿammuhu Abū Ṭālibin fa-hābahu kullun mina l-qawmi wa-taḥāmāh."],"translation":["",""],"isRefrain":false},{"arabic":["وَفُرِضَ عَلَيْهِ قِيَامُ بَعْضِ السَّاعَاتِ اللَّيْلِيَّةْ ❁","ثُمَّ نُسِخَ بِقَوْلِهِ تَعَالَى ﴿فَاقْرَؤُوا مَا تَيَسَّرَ مِنْهُ وَأَقِيمُوا الصَّلَاةْ﴾ ❁"],"transliteration":["Wa-furiḍa ʿalayhi qiyāmu baʿḍi s-sāʿāti l-layliyyah","thumma nusikha bi-qawlihi taʿālā﴾ fa-qra'ū mā tayassara minhu wa-aqīmū ṣ-ṣalāh﴿"],"translation":["Standing in prayer for a portion of the night was made obligatory upon him. Then this was abrogated by the words of Allah Most High, “So recite what is easy from it and establish the prayer” (Surah al-Muzzammil, 73:20). Two units of prayer in the morning and two units in the evening were then made obligatory upon him. This was subsequently abrogated by the obligation of the five daily prayers on the night of his Night Journey.",""],"isRefrain":false},{"arabic":["وَفُرِضَ عَلَيْهِ رَكْعَتَانِ بِالْغَدَاةِ وَرَكْعَتَانِ بِالْعَشِيَّةْ ❁","ثُمَّ نُسِخَ بِإِيجَابِ الصَّلَوَاتِ الْخَمْسِ فِي لَيْلَةِ مَسْرَاهْ ❁"],"transliteration":["wa-furiḍa ʿalayhi rakʿatāni bi-l-ghadāti wa-rakʿatāni bi-l-ʿashiyyah","thumma nusikha bi-ījābi ṣ-ṣalawāti l-khamsi fī laylati masrāh."],"translation":["",""],"isRefrain":false},{"arabic":["وَمَاتَ أَبُو طَالِبٍ فِي نِصْفِ شَوَّالٍ مِنْ عَاشِرِ الْبِعْثَةِ وَعَظُمَتْ بِمَوْتِهِ الرَّزِيَّةْ ❁","وَتَلَتْهُ خَدِيجَةُ بَعْدَ ثَلَاثَةِ أَيَّامٍ وَشَدَّ الْبَلَاءُ عَلَى الْمُسْلِمِينَ عُرَاهْ ❁"],"transliteration":["Wa-māta Abū Ṭālibin fī niṣfi shawwālin min ʿāshri l-biʿthati wa-ʿaẓumat bi-mawtihi r-raziyyah. Wa-talat-hu Khadījatu baʿda thalathati ayyāmin wa-shadda l-balā'u ʿalā l-muslimīna ʿurāh, wa-awqaʿat Qurayshun bihi ṣalla Llāhu taʿālā ʿalayhi wa-sallama kulla adhiyyah, wa-amma ṭ-ṭā'ifa yadʿū thaqīfan fa-lam yuḥsinū bi-l-ijābati qirāh, wa-aghraw bihi s-sufahā'a wa-l-ʿabīda fa-sabūhu bi-alsinatin badhiyyah.",""],"translation":["Abu Talib passed away in the middle of Shawwal, in the tenth year of the Prophetic mission, and his death was a great calamity. Khadijah followed him three days later, and the trials upon the Muslims grew severe. Quraysh inflicted every kind of harm upon him, may Allah Most High send prayers and peace upon him. He then headed for Taif to call Thaqif, but they offered him no gracious response. Instead, they incited their foolish ones and slaves against him, and they reviled him with foul tongues.",""],"isRefrain":false},{"arabic":["وَأَوْقَعَتْ قُرَيْشٌ بِهِ صَلَّى اللَّهُ تَعَالَى عَلَيْهِ وَسَلَّمَ كُلَّ أَذِيَّةْ ❁","وَأَمَّ الطَّائِفَ يَدْعُو ثَقِيفًا فَلَمْ يُحْسِنُوا بِالْإِجَابَةِ قِرَاهْ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["وَأَغْرَوْا بِهِ السُّفَهَاءَ وَالْعَبِيدَ فَسَبُّوهُ بِأَلْسِنَةٍ بَذِيَّةْ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["وَرَمَوْهُ بِالْحِجَارَةِ حَتَّى خُضِّبَتْ بِالدِّمَاءِ نَعْلَاهْ ❁","ثُمَّ عَادَ إِلَى مَكَّةَ حَزِينًا فَسَأَلَهُ مَلَكَ الْجِبَالِ فِي إِهْلَاكِ أَهْلِهَا ذَوِي الْعَصَبِيَّةْ ❁"],"transliteration":["Wa-ramawhu bi-l-ḥijārati ḥattā khuḍḍibat bi-d-dimā'i naʿlāh","thumma ʿāda ilā Makkata ḥazīnan fa-sa'alahu malaku l-jibāli fī ihlāki ahlihā dhawī l-ʿaṣabiyyah"],"translation":["And they pelted him with stones until his sandals were stained with blood. Then he returned to Makkah sorrowful, and the Angel of the Mountains asked him concerning the destruction of its fanatical people. But he said, “Indeed, I hope that Allah will bring forth from their descendants those who will turn to Him.”",""],"isRefrain":false},{"arabic":["فَقَالَ: إِنِّي أَرْجُو أَنْ يُخْرِجَ اللَّهُ مِنْ أَصْلَابِهِمْ مَنْ يَتَوَلَّاهْ ❁"],"transliteration":["fa-qāla: innī arjū an yukhrija Llāhu min aṣlābihim man yatawallāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["عَطِّرِ اللَّهُمَّ قَبْرَهُ الْكَرِيمَ بِعَرْفٍ شَذِيٍّ مِنْ صَلَاةٍ وَتَسْلِيمٍ ❁","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَيْهِ ❁"],"transliteration":["ʿAṭṭiri Llāhumma qabrahu l-karīma bi-ʿarfin shadhiyyin min ṣalātin wa-taslīmin. Allāhumma ṣalli wa-sallim wa-bārik ʿalayhi.",""],"translation":["O Allah, perfume his noble grave with a fragrant scent of prayers and peace. O Allah, send prayers, peace, and blessings upon him.",""],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: The Night Journey and Ascension (Isra and Mi'raj)","englishTitle":"Mawlid al-Barzanji: The Night Journey and Ascension (Isra and Mi'raj)","couplets":[{"arabic":["ثُمَّ أُسْرِيَ بِرُوحِهِ وَجَسَدِهِ يَقَظَةً مِنَ الْمَسْجِدِ الْحَرَامِ إِلَى الْمَسْجِدِ الْأَقْصَى وَرِحَابِهِ الْقُدْسِيَّةْ ❁","وَعُرِجَ بِهِ إِلَى السَّمَاوَاتِ فَرَأَى آدَمَ فِي الْأُولَى وَقَدْ جَلَّلَهُ بِالْوَقَارِ وَعَلَاهْ ❁"],"transliteration":["Thumma usriya bi-rūḥihi wa-jasadihi yaqaẓatan mina l-Masjidi l-Ḥarāmi ilā l-Masjidi l-Aqṣā wa-riḥābihi l-qudsiyyah","wa-ʿurija bihi ilā s-samāwāti fa-ra'ā Ādama fī l-awlā wa-qad jallalahu bi-l-waqāri wa-ʿalāh"],"translation":["Then he was taken by night, in body and spirit while awake, from al-Masjid al-Haram to al-Masjid al-Aqsa and its sacred precincts. He was then raised through the heavens, where in the first heaven he saw Adam, clothed and encompassed in dignity. And in the second heaven he saw Isa, son of Maryam, the chaste, righteous, and God-fearing woman.",""],"isRefrain":false},{"arabic":["وَرَأَى فِي الثَّانِيَةِ عِيسَى ابْنَ مَرْيَمَ الْبَتُولِ الْبَرَّةِ التَّقِيَّةْ ❁"],"transliteration":["wa-ra'ā fī th-thāniyati ʿĪsa-bna Maryama l-batūli l-barrati t-taqiyyah.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَابْنَ خَالَتِهِ يَحْيَى الَّذِي أُوتِيَ الْحُكْمَ فِي حَالِ صِبَاهْ ❁","وَرَأَى فِي الثَّالِثَةِ يُوسُفَ الصِّدِّيقَ بِصُورَتِهِ الْجَمَالِيَّةْ ❁"],"transliteration":["Wa-bna khālatihi Yaḥya lladhī ūtiya l-ḥukma fī ḥāli ṣibāh","wa-ra’ā fī th-thālithati Yūsufa ṣ-ṣiddīqa bi-ṣūratihi l-jamāliyyah"],"translation":["And with him was his maternal cousin Yahya, who was granted wisdom while still a child. In the third heaven, he saw Yusuf al-Siddiq in his beautiful form, and in the fourth, Idris, whose station Allah raised and exalted. In the fifth, he saw Harun, beloved among the Children of Israel, and in the sixth, Musa, whom Allah spoke to and communed with privately.",""],"isRefrain":false},{"arabic":["وَفِي الرَّابِعَةِ إِدْرِيسَ الَّذِي رَفَعَ اللَّهُ مَكَانَهُ وَأَعْلَاهْ ❁","وَفِي الْخَامِسَةِ هَارُونَ الْمُحَبَّبَ فِي الْأُمَّةِ الْإِسْرَائِيلِيَّةْ ❁"],"transliteration":["wa-fī r-rābiʿati Idrīsa lladhī rafaʿa Llāhu makānahu wa-aʿlāh","wa-fī l-khāmisati Hārūna l-muḥabbaba fī l-ummati l-isrā'īliyyah"],"translation":["",""],"isRefrain":false},{"arabic":["وَفِي السَّادِسَةِ مُوسَى الَّذِي كَلَّمَهُ اللَّهُ وَنَاجَاهْ ❁"],"transliteration":["wa-fī s-sādisati Mūsa lladhī kallamahu Llāhu wa-nājāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَفِي السَّابِعَةِ إِبْرَاهِيمَ الَّذِي جَاءَ رَبَّهُ بِسَلَامَةِ الْقَلْبِ وَالطَّوِيَّةْ ❁","وَحَفِظَهُ مِنْ نَارِ نَمْرُودَ وَعَافَاهْ ❁"],"transliteration":["Wa-fī s-sābiʿati Ibrāhīma lladhī jā'a Rabbahu bi-salāmati l-qalbi wa ṭ-ṭawiyyah","wa-ḥafiẓahu min nāri Namrūda wa-ʿāfāh"],"translation":["And in the seventh heaven, he saw Ibrahim, who came to his Lord with a sound heart and pure inner disposition, and whom Allah preserved from the fire of Namrud and kept safe. Then he was raised to Sidrat al-Muntaha, until he heard the scratching of the pens recording the matters already decreed. He was then raised to the station of direct encounter, where Allah brought him near and drew him close, and removed for him the veils of majestic lights.",""],"isRefrain":false},{"arabic":["ثُمَّ رُفِعَ إِلَى سِدْرَةِ الْمُنْتَهَى إِلَى أَنْ سَمِعَ صَرِيفَ الْأَقْلَامِ بِالْأُمُورِ الْمَقْضِيَّةْ ❁","إِلَى مَقامِ الْمُكَافَحَةِ الَّذِي قَرَّبَهُ اللَّهُ فِيهِ وَأَدْنَاهْ ❁"],"transliteration":["thumma rufiʿa ilā sidrati l-muntahā ilā an samiʿa ṣarīfa l-aqlāmi bi-l-umūri l-maqḍiyyah","ilā maqāmi l-mukāfaḥati lladhī qarrabahu Llāhu fīhi wa-adnāh"],"translation":["",""],"isRefrain":false},{"arabic":["وَأَمَاطَ لَهُ حُجُبَ الْأَنْوَارِ الْجَلَالِيَّةْ ❁"],"transliteration":["wa-amāṭa lahu ḥujuba l-anwāri l-jalāliyyah.",""],"translation":["",""],"isRefrain":false},{"arabic":["وَأَرَاهُ بِعَيْنَيْ رَأْسِهِ مِنْ حَضْرَةِ الرُّبُوبِيَّةِ مَا أَرَاهْ ❁","وَبَسَطَ لَهُ بُسُطَ الْإِدْلَالِ فِي الْمَجَالِي الذَّاتِيَّةْ ❁"],"transliteration":["Wa-arāhu bi-ʿaynay ra'sihi min ḥaḍrati r-rubūbiyyati mā arāh","wa-basaṭa lahu busuṭa l-idlāli fī l-majālī dh-dhātiyyah"],"translation":["And with his own eyes, he was shown from the Presence of Lordship what he was shown. The carpets of intimate favour were spread out for him amid the manifestations of the Divine Essence. And fifty prayers were made obligatory upon him and his community. Then the cloud of Divine Grace poured forth, and they were reduced to five in practice, while retaining the reward of fifty, just as He had willed and decreed in eternity.",""],"isRefrain":false},{"arabic":["وَفَرَضَ عَلَيْهِ وَعَلَى أُمَّتِهِ خَمْسِينَ صَلَاةً ❁","ثُمَّ انْهَلَّ سَحَابُ الْفَضْلِ فَرُدَّتْ إِلَى خَمْسٍ عَمَلِيَّةْ ❁"],"transliteration":["wa-faraḍa ʿalayhi wa-ʿalā ummatihi khamsīna ṣalātan","thumma nhalla saḥābu l-faḍli fa-ruddat ilā khamsin ʿamaliyyah"],"translation":["",""],"isRefrain":false},{"arabic":["وَلَهَا أَجْرُ الْخَمْسِينَ كَمَا شَاءَهُ فِي الْأَزَلِ وَقَضَاهْ ❁"],"transliteration":["wa-lahā ajru l-khamsīna kamā shā'ahu fī l-azali wa-qaḍāh.",""],"translation":["",""],"isRefrain":false},{"arabic":["ثُمَّ عَادَ فِي لَيْلَتِهِ بِالْمَوَاهِبِ اللَّدُنِّيَّةْ ❁","فَصَدَّقَهُ الصِّدِّيقُ بِمَسْرَاهْ ❁"],"transliteration":["Thumma ʿāda fī laylatihi bi-l-mawāhib al-ladunniyya fa-ṣaddaqahu ṣ-ṣiddīqu bi-masrāh, wa-kullu dhī ʿaqlin wa-rawiyyah, wa-ka-dhdhabathu Qurayshun wa-rtadda man aḍallahu sh-shayṭānu wa-aghwāh.",""],"translation":["Then he returned that same night bearing divinely bestowed gifts. Al-Siddiq believed him concerning his Night Journey, as did every person of intellect and sound judgement. Quraysh denied him, while those whom Satan had led astray and beguiled apostatised.",""],"isRefrain":false},{"arabic":["وَكُلُّ ذِي عَقْلٍ وَرَوِيَّةْ ❁","وَكَذَّبَتْهُ قُرَيْشٌ وَارْتَدَّ مَنْ أَضَلَّهُ الشَّيْطَانُ وَأَغْوَاهْ ❁"],"transliteration":["",""],"translation":["",""],"isRefrain":false},{"arabic":["عَطِّرِ اللَّهُمَّ قَبْرَهُ الْكَرِيمَ بِعَرْفٍ شَذِيٍّ مِنْ صَلَاةٍ وَتَسْلِيمٍ ❁","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَيْهِ ❁"],"transliteration":["ʿAṭṭiri Llāhumma qabrahu l-karīma bi-ʿarfin shadhiyyin min ṣalātin wa-taslīmin. Allāhumma ṣalli wa-sallim wa-bārik ʿalayhi.",""],"translation":["O Allah, perfume his noble grave with a fragrant scent of prayers and peace. O Allah, send prayers, peace, and blessings upon him.",""],"isRefrain":false}]},{"title":"Mawlid al-Barzanji: The Ansar and the Pledge of Allegiance","englishTitle":"Mawlid al-Barzanji: The Ansar and the Pledge of Allegiance","couplets":[{"arabic":["ثُمَّ عَرَضَ نَفْسَهُ عَلَى الْقَبَائِلِ بِأَنَّهُ رَسُولُ اللَّهِ فِي الْأَيَّامِ الْمَوْسِمِيَّةْ ❁","فَآمَنَ بِهِ سِتَّةٌ مِنَ الْأَنْصَارِ اخْتَصَّهُمُ اللَّهُ تَعَالَى بِرِضَاهْ ❁"],"transliteration":["Thumma ʿaraḍa nafsahu ʿalā l-qabā'ili bi-annahu rasūlu Llāhi fī l-ayyāmi l-mawsimiyyah","fa-āmana bihi sittatun mina l-Anṣāri ikhtaṣṣahumu Llāhu taʿālā bi-riḍāh"],"translation":["Then, during the days of the pilgrimage season, he presented himself to the tribes, declaring that he was the Messenger of Allah. Six men from the Ansar believed in him, whom Allah Most High
